# The reader on GitHub Pages.
#
# site/index.html and the search indexes are not in git - the page passed
# GitHub's 50 MB file limit - so they are built here from what is: the
# translations under output/ and the study layers under site/morph/. Nothing
# the model writes is made on this runner; it only puts together what the PC
# has already pushed. --complete-only keeps out a language whose chapters are
# still hollow, as it does for the APK.
name: Reader on Pages

on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - "site/**"
      - "targets/**"
      - "scripts/build_site.py"
      - "scripts/build_index.py"
      - "scripts/books.py"
      - "scripts/readaloud.py"
      - "scripts/manifest.py"
      - "scripts/build_apk.py"
      - "android/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a build still running; a deploy already under way is
# let finish, so the site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The search indexes come first: the APK carries them, and the page
      # checks they are not older than the text.
      - name: Build the search indexes
        run: python scripts/build_index.py

      # The reader APK, made from the same commit as the page, so the copy a
      # visitor downloads is the text they were just reading. It is signed
      # with the PC's debug key, kept as a secret: a phone only lets an APK
      # replace one signed with the same key, and a fresh key on every run
      # would make each new copy refuse to install over the last. Without the
      # secret, or if the build fails, the site still goes up, without the
      # download.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build the reader APK
        continue-on-error: true
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::warning::no ANDROID_DEBUG_KEYSTORE secret, so the site goes up without the APK"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          python scripts/build_apk.py
          cp dist/eBible-reader-*-debug.apk site/eBible-reader.apk

      - name: Build the reader
        run: |
          if [ -f site/eBible-reader.apk ]; then
            python scripts/build_site.py --complete-only --apk eBible-reader.apk
          else
            python scripts/build_site.py --complete-only
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
