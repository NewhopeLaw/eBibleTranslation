# The reader on GitHub Pages, and the downloads it offers.
#
# site/index.html and the search indexes are not in git - the page passed
# GitHub's 50 MB file limit - so they are built here from what is: the
# translations under output/ and the study layers under site/morph/. Nothing
# the model writes is made on this runner; it only puts together what the PC
# has already pushed. --complete-only keeps out a language whose chapters are
# still hollow, as it does for the APK.
#
# The page has a Download tray. The offline reader it offers is assembled in
# the visitor's browser from what this site serves, so it costs the site
# nothing. The APKs are built here and go to a GitHub Release, reader-apk,
# not onto the site: eight of them, each carrying the search model, come to
# several hundred megabytes, and a Pages site has 1 GB in all.
name: Reader on Pages

on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - "site/**"
      - "targets/**"
      - "scripts/build_site.py"
      - "scripts/build_index.py"
      - "scripts/books.py"
      - "scripts/readaloud.py"
      - "scripts/manifest.py"
      - "scripts/build_apk.py"
      - "scripts/release_apks.py"
      - "android/**"
      - ".github/workflows/pages.yml"
  # A pull request into main is built the same way and not published, so the
  # first sign that a change breaks the page is a red check on the request,
  # not a site that stops updating after the merge.
  pull_request:
    branches: [main]
    paths:
      - "output/**"
      - "site/**"
      - "targets/**"
      - "scripts/build_site.py"
      - "scripts/build_index.py"
      - "scripts/books.py"
      - "scripts/readaloud.py"
      - "scripts/manifest.py"
      - "scripts/build_apk.py"
      - "scripts/release_apks.py"
      - "android/**"
      - ".github/workflows/pages.yml"
  # Also run by hand after the PC uploads a new search model (README.md,
  # "The search model on GitHub"): an upload to a Release is not a push.
  workflow_dispatch:

permissions:
  contents: write          # the APKs are uploaded to the reader-apk Release
  pages: write
  id-token: write

# A newer push replaces a build still running; a deploy already under way is
# let finish, so the site is never left half-published. A pull request's
# build has a group of its own, and a newer push to it replaces the last,
# so it neither waits behind a deploy nor holds one up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  APK_RELEASE: reader-apk
  MODEL_RELEASE: meaning-model

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The search indexes come first: the APKs carry them, and the page
      # checks they are not older than the text.
      - name: Build the search indexes
        run: python scripts/build_index.py

      # The search model is made on the PC (scripts/build_encoder.py) and is
      # not in git; the PC puts it in a Release and it is fetched from there.
      # Without it the APKs search by meaning with the table, as a browser
      # does, and say nothing worse than that.
      - name: Fetch the search model
        continue-on-error: true
        run: |
          if gh release download "$MODEL_RELEASE" --dir site/model --clobber; then
            ls -l site/model
          else
            echo "::warning::no $MODEL_RELEASE Release, so the APKs search by meaning with the table"
          fi

      # The reader APKs, made from the same commit as the page, so the copy a
      # visitor downloads is the text they were just reading. They are signed
      # with the PC's debug key, kept as a secret: a phone only lets an APK
      # replace one signed with the same key, and a fresh key on every run
      # would make each new copy refuse to install over the last. Without the
      # secret, or if every build fails, the site still goes up, offering the
      # offline reader alone. A pull request is not published, so it skips the
      # APKs: a failed one cannot turn the check red, and they take most of the
      # time.
      - uses: actions/setup-java@v4
        if: github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'pull_request'
        with:
          gradle-version: "8.13"
      - name: Build the reader APKs
        id: apks
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::warning::no ANDROID_DEBUG_KEYSTORE secret, so the site goes up without the APKs"
            exit 0
          fi
          key="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE" | base64 -d > "$key"
          EBIBLE_DEBUG_KEYSTORE="$key" python scripts/release_apks.py \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE}/"
          # The first build here went out signed with a key Gradle made for
          # itself, and nothing said so. An APK whose certificate is not the
          # one in the secret would install over nothing already on a phone,
          # so every one of them is checked, and if any is wrong none goes up:
          # the step fails, the Release is left as it was, and the page offers
          # the offline reader alone.
          want=$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey \
                 | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in dist/release/*.apk; do
            certs=$("$signer" verify --print-certs "$apk")
            # The runner's apksigner is newer than the PC's and does not always
            # number its signers "Signer #1", which left this reading nothing and
            # refusing an APK that may well have been right. Any line naming a
            # certificate digest will do; there is only one key.
            got=$(printf '%s\n' "$certs" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
            echo "$(basename "$apk"): key $want, APK $got"
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              printf '%s\n' "$certs"
              echo "::error::$(basename "$apk") is not signed with the key in ANDROID_DEBUG_KEYSTORE, so no APK is published"
              exit 1
            fi
          done

      # --clobber replaces each file in place, so a link is missing only for
      # the seconds its own upload takes. The notes say which commit the APKs
      # are, which the file names, kept the same for the links, do not.
      - name: Put the APKs in the Release
        id: release
        if: steps.apks.outcome == 'success' && hashFiles('dist/release/apks.json') != ''
        continue-on-error: true
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          notes="The eBible reader for Android, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d) and offered on $site. eBible-reader.apk carries every finished language; the others carry the languages in their names. A name ending in -lite has no search by meaning, and is much smaller."
          gh release view "$APK_RELEASE" >/dev/null 2>&1 \
            || gh release create "$APK_RELEASE" --title "eBible reader for Android" --notes "$notes" --target "$GITHUB_SHA"
          gh release upload "$APK_RELEASE" dist/release/*.apk --clobber
          gh release edit "$APK_RELEASE" --notes "$notes"

      # The page is built last, so its Download tray lists exactly the APKs
      # now in the Release, at the sizes they are. The model has done its
      # work in the APKs and is taken out: a browser cannot run it, and the
      # site has no room to spare for 80 MB nobody here can use.
      - name: Build the reader
        run: |
          rm -rf site/model
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            python scripts/build_site.py --complete-only --downloads --apks dist/release/apks.json
          else
            python scripts/build_site.py --complete-only --downloads
          fi

      # The page reads Taiwanese and Hakka with the voices in site/voice/, and
      # says nothing if they are missing: it simply offers no Listen. So the
      # build checks that every voice it lists reached the page, with its
      # model, a file for each of its books, and the runtime to play them.
      - name: Check the phone voices reached the page
        shell: python
        run: |
          import json, re
          from pathlib import Path
          site = Path("site")
          listed = site / "voice" / "voices.json"
          voices = json.loads(listed.read_text(encoding="utf-8")) if listed.exists() else {}
          page = (site / "index.html").read_text(encoding="utf-8")
          carried = json.loads(re.search(r"const PHONEVOICE = (\{.*?\});\n", page).group(1))
          wrong = [f"{c} is in voices.json but not on the page" for c in voices if c not in carried]
          for c, v in carried.items():
              d = site / "voice" / c
              wrong += [f"{c}: no student.onnx"] * (not (d / "student.onnx").is_file())
              wrong += [f"{c}: no {b}.js" for b in v["books"] if not (d / f"{b}.js").is_file()]
          if carried:
              ort = site / "voice" / "ort"
              wrong += [f"no ort/{f}" for f in ("ort.wasm.min.js", "ort-wasm-simd-threaded.mjs",
                                               "ort-wasm-simd-threaded.wasm") if not (ort / f).is_file()]
          print("phone voices on the page:", ", ".join(f"{c} ({len(v['books'])} books)" for c, v in carried.items()) or "none")
          if wrong:
              raise SystemExit("\n".join(wrong))

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
