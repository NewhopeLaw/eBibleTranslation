ֹלֶד אֶת־תָּֽרַח׃", "25": "וַיְחִי נָחוֹר אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח תְּשַֽׁע־עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "26": "וַֽיְחִי־תֶרַח שִׁבְעִים שָׁנָה וַיּוֹלֶד אֶת־אַבְרָם אֶת־נָחוֹר וְאֶת־הָרָֽן׃", "27": "וְאֵלֶּה תּוֹלְדֹת תֶּרַח תֶּרַח הוֹלִיד אֶת־אַבְרָם אֶת־נָחוֹר וְאֶת־הָרָן וְהָרָן הוֹלִיד אֶת־לֽוֹט׃", "28": "וַיָּמָת הָרָן עַל־פְּנֵי תֶּרַח אָבִיו בְּאֶרֶץ מוֹלַדְתּוֹ בְּאוּר כַּשְׂדִּֽים׃", "29": "וַיִּקַּח אַבְרָם וְנָחוֹר לָהֶם נָשִׁים שֵׁם אֵֽשֶׁת־אַבְרָם שָׂרָי וְשֵׁם אֵֽשֶׁת־נָחוֹר מִלְכָּה בַּת־הָרָן אֲבִֽי־מִלְכָּה וַֽאֲבִי יִסְכָּֽה׃", "30": "וַתְּהִי שָׂרַי עֲקָרָה אֵין לָהּ וָלָֽד׃", "31": "וַיִּקַּח תֶּרַח אֶת־אַבְרָם בְּנוֹ וְאֶת־לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ וְאֵת שָׂרַי כַּלָּתוֹ אֵשֶׁת אַבְרָם בְּנוֹ וַיֵּצְאוּ אִתָּם מֵאוּר כַּשְׂדִּים לָלֶכֶת אַרְצָה כְּנַעַן וַיָּבֹאוּ עַד־חָרָן וַיֵּשְׁבוּ שָֽׁם׃", "32": "וַיִּהְיוּ יְמֵי־תֶרַח חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה וַיָּמָת תֶּרַח בְּחָרָֽן׃"}, "lang": "hbo"}, "12": {"verses": {"1": "The LORD said to Abram, \"Go forth from your land, from your birthplace, and from your father's house to the land that I will show you.\n", "2": "I will make you into a great nation, and I will bless you, and I will make your name great. You will be a source of blessing.\n", "3": "I will bless those who bless you and curse those who curse you, and through you, all the families of the earth will be blessed.\"\n", "4": "Abram went as the LORD had spoken to him, and Lot went with him. Abram was seventy-five years old when he left Haran.\n", "5": "Abram took Sarai his wife, and Lot his nephew, along with all their possessions and all the people they had acquired in Haran. They journeyed to the land of Canaan and arrived there.\n", "6": "Abram passed through the land as far as the site of Shechem, to the terebinth of Moreh. At that time, the Canaanites were already in the land.\n", "7": "The LORD appeared to Abram and said, \"I will give this land to your descendants.\" There Abram built an altar to the LORD who had appeared to him.\n", "8": "Then he moved from there into the hill country east of Bethel and pitched his tent—Bethel to the west and Ai to the east. There he built an altar to the LORD and called upon the name of the LORD.\n", "9": "Abram continued to travel, journeying southward.\n", "10": "A famine struck the land, and Abram went down to Egypt to sojourn there, for the famine was severe in the land.\n", "11": "When he was about to enter Egypt, he said to his wife Sarai, \"I know that you are a very beautiful woman.\n", "12": "When the Egyptians see you, they will say, 'This is his wife,' and they may kill me, but they will let you live.\n", "13": "Please say you are my sister, so that it may go well with me because of you, and so that I may live because of you.\"\n", "14": "When Abram entered Egypt, the Egyptians saw that the woman was very beautiful.\n", "15": "Pharaoh's officials saw her and praised her highly to Pharaoh, and the woman was taken into Pharaoh's house.\n", "16": "Because of her, Pharaoh treated Abram well, giving him flocks and herds, male and female donkeys, male and female slaves, and camels.\n", "17": "But the LORD sent a great plague upon Pharaoh and his house because of Sarai, Abram's wife.\n", "18": "Pharaoh called Abram and said, \"What have you done to me? Why did you not tell me that she was your wife?\n", "19": "Why did you say, 'She is my sister,' so that I took her as my wife? Now then, take your wife and go.\"\n", "20": "Pharaoh gave orders to his men, and they sent Abram away—with his wife and all that he had.\n"}, "notes": "Notes\n- v. 1: \"Go forth from your land\" — \"לֶךְ־לְךָ\" is a rare and emphatic expression, often translated as \"Go for yourself\" or \"Go out to yourself,\" but here rendered as \"Go forth\" to preserve the intensity and direction of the divine command.\n- v. 3: \"curse those who curse you\" — the Hebrew uses \"אָאֹר\" from \"עָרַר,\" meaning to curse or speak against; the translation mirrors the parallel structure of the blessing.\n- v. 13: \"Please say you are my sister\" — the Hebrew \"אֲחֹתִי\" is \"my sister\"; Abram asks Sarai to lie about their relationship.\n- v. 17: \"a great plague\" — the Hebrew \"נְגָעִים גְּדֹלִים\" is literally \"great plagues\" or \"serious afflictions,\" translated as \"a great plague\" to maintain clarity and conciseness.", "src": {"1": "וַיֹּאמֶר יְהוָה אֶל־אַבְרָם לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּֽוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶֽךָּ׃", "2": "וְאֶֽעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה שְׁמֶךָ וֶהְיֵה בְּרָכָֽה׃", "3": "וַאֲבָֽרֲכָה מְבָרְכֶיךָ וּמְקַלֶּלְךָ אָאֹר וְנִבְרְכוּ בְךָ כֹּל מִשְׁפְּחֹת הָאֲדָמָֽה׃", "4": "וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה וַיֵּלֶךְ אִתּוֹ לוֹט וְאַבְרָם בֶּן־חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה בְּצֵאתוֹ מֵחָרָֽן׃", "5": "וַיִּקַּח אַבְרָם אֶת־שָׂרַי אִשְׁתּוֹ וְאֶת־לוֹט בֶּן־אָחִיו וְאֶת־כָּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ וְאֶת־הַנֶּפֶשׁ אֲשֶׁר־עָשׂוּ בְחָרָן וַיֵּצְאוּ לָלֶכֶת אַרְצָה כְּנַעַן וַיָּבֹאוּ אַרְצָה כְּנָֽעַן׃", "6": "וַיַּעֲבֹר אַבְרָם בָּאָרֶץ עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה וְהַֽכְּנַעֲנִי אָז בָּאָֽרֶץ׃", "7": "וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה הַנִּרְאֶה אֵלָֽיו׃", "8": "וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵֽית־אֵל וַיֵּט אָהֳלֹה בֵּֽית־אֵל מִיָּם וְהָעַי מִקֶּדֶם וַיִּֽבֶן־שָׁם מִזְבֵּחַ לַֽיהוָה וַיִּקְרָא בְּשֵׁם יְהוָֽה׃", "9": "וַיִּסַּע אַבְרָם הָלוֹךְ וְנָסוֹעַ הַנֶּֽגְבָּה׃", "10": "וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם כִּֽי־כָבֵד הָרָעָב בָּאָֽרֶץ׃", "11": "וַיְהִי כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה וַיֹּאמֶר אֶל־שָׂרַי אִשְׁתּוֹ הִנֵּה־נָא יָדַעְתִּי כִּי אִשָּׁה יְפַת־מַרְאֶה אָֽתְּ׃", "12": "וְהָיָה כִּֽי־יִרְאוּ אֹתָךְ הַמִּצְרִים וְאָמְרוּ אִשְׁתּוֹ זֹאת וְהָרְגוּ אֹתִי וְאֹתָךְ יְחַיּֽוּ׃", "13": "אִמְרִי־נָא אֲחֹתִי אָתְּ לְמַעַן יִֽיטַב־לִי בַעֲבוּרֵךְ וְחָיְתָה נַפְשִׁי בִּגְלָלֵֽךְ׃", "14": "וַיְהִי כְּבוֹא אַבְרָם מִצְרָיְמָה וַיִּרְאוּ הַמִּצְרִים אֶת־הָאִשָּׁה כִּֽי־יָפָה הִוא מְאֹֽד׃", "15": "וַיִּרְאוּ אֹתָהּ שָׂרֵי פַרְעֹה וַיְהַֽלְלוּ אֹתָהּ אֶל־פַּרְעֹה וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹֽה׃", "16": "וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ וַֽיְהִי־לוֹ צֹאן־וּבָקָר וַחֲמֹרִים וַעֲבָדִים וּשְׁפָחֹת וַאֲתֹנֹת וּגְמַלִּֽים׃", "17": "וַיְנַגַּע יְהוָה ׀ אֶת־פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת־בֵּיתוֹ עַל־דְּבַר שָׂרַי אֵשֶׁת אַבְרָֽם׃", "18": "וַיִּקְרָא פַרְעֹה לְאַבְרָם וַיֹּאמֶר מַה־זֹּאת עָשִׂיתָ לִּי לָמָּה לֹא־הִגַּדְתָּ לִּי כִּי אִשְׁתְּךָ הִֽוא׃", "19": "לָמָה אָמַרְתָּ אֲחֹתִי הִוא וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה וְעַתָּה הִנֵּה אִשְׁתְּךָ קַח וָלֵֽךְ׃", "20": "וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַֽיְשַׁלְּחוּ אֹתוֹ וְאֶת־אִשְׁתּוֹ וְאֶת־כָּל־אֲשֶׁר־לֽוֹ׃"}, "lang": "hbo"}, "13": {"verses": {"1": "Abram and his wife, along with all that he had, went up from Egypt to the Negev.\n", "2": "Abram was very rich in livestock, in silver, and in gold.\n", "3": "He journeyed on from the Negev to Bethel, to the place where his tent had been at the beginning, between Bethel and Ai.\n", "4": "He went to the site of the altar he had made there before and called on the name of the LORD.\n", "5": "Lot, who was going with Abram, had flocks, herds, and tents.\n", "6": "But the land could not bear the two of them together, for their possessions were too numerous, and they could not live together.\n", "7": "A quarrel arose between the herdsmen of Abram and the herdsmen of Lot, and at that time the Canaanite and the Perizzite were living in the land.\n", "8": "Abram said to Lot, \"Let there be no quarrel between me and you, and between my herdsmen and your herdsmen, for we are brothers.\n", "9": "The whole land is before you. Separate yourself from me. If you go to the left, I will go to the right; if you go to the right, I will go to the left.\"\n", "10": "Lot lifted up his eyes and saw the whole plain of the Jordan, for all of it was well watered, before the LORD destroyed Sodom and Gomorrah, like the garden of the LORD, like the land of Egypt—this was the plain of Zoar.\n", "11": "So Lot chose for himself the whole plain of the Jordan, and Lot journeyed east. Thus they separated from one another, each going his own way.\n", "12": "Abram settled in the land of Canaan, while Lot settled among the cities of the plain and pitched his tent as far as Sodom.\n", "13": "Now the men of Sodom were wicked and great sinners against the LORD.\n", "14": "The LORD said to Abram, after Lot had separated from him, \"Lift up your eyes and look from the place where you are—northward, southward, eastward, and westward.\n", "15": "For all the land that you see I will give to you and to your descendants forever.\n", "16": "I will make your descendants as the dust of the earth. If anyone can count the dust of the earth, then your descendants can be counted.\"\n", "17": "\"Rise up and walk through the length and breadth of the land, for I will give it to you.\"\n", "18": "Abram pitched his tent and went to live in the oaks of Mamre, which are in Hebron, and there he built an altar to the LORD.\n"}, "notes": "Notes\n- v. 10: \"this was the plain of Zoar\" — \"Zoar\" is a rare name; some traditions read \"Beloved\" or \"the Well.\" \"Zoar\" is retained as a known name in the context of the Jordan plain.\n- v. 18: \"oaks of Mamre\" — \"Mamre\" is a proper name, retained in the translation. The \"oaks\" refer to the terebinth trees, common in such contexts.", "src": {"1": "וַיַּעַל אַבְרָם מִמִּצְרַיִם הוּא וְאִשְׁתּוֹ וְכָל־אֲשֶׁר־לוֹ וְלוֹט עִמּוֹ הַנֶּֽגְבָּה׃", "2": "וְאַבְרָם כָּבֵד מְאֹד בַּמִּקְנֶה בַּכֶּסֶף וּבַזָּהָֽב׃", "3": "וַיֵּלֶךְ לְמַסָּעָיו מִנֶּגֶב וְעַד־בֵּֽית־אֵל עַד־הַמָּקוֹם אֲשֶׁר־הָיָה שָׁם אָֽהֳלוֹ בַּתְּחִלָּה בֵּין בֵּֽית־אֵל וּבֵין הָעָֽי׃", "4": "אֶל־מְקוֹם הַמִּזְבֵּחַ אֲשֶׁר־עָשָׂה שָׁם בָּרִאשֹׁנָה וַיִּקְרָא שָׁם אַבְרָם בְּשֵׁם יְהוָֽה׃", "5": "וְגַם־לְלוֹט הַהֹלֵךְ אֶת־אַבְרָם הָיָה צֹאן־וּבָקָר וְאֹהָלִֽים׃", "6": "וְלֹא־נָשָׂא אֹתָם הָאָרֶץ לָשֶׁבֶת יַחְדָּו כִּֽי־הָיָה רְכוּשָׁם רָב וְלֹא יָֽכְלוּ לָשֶׁבֶת יַחְדָּֽו׃", "7": "וַֽיְהִי־רִיב בֵּין רֹעֵי מִקְנֵֽה־אַבְרָם וּבֵין רֹעֵי מִקְנֵה־לוֹט וְהַֽכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָֽרֶץ׃", "8": "וַיֹּאמֶר אַבְרָם אֶל־לוֹט אַל־נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶיךָ וּבֵין רֹעַי וּבֵין רֹעֶיךָ כִּֽי־אֲנָשִׁים אַחִים אֲנָֽחְנוּ׃", "9": "הֲלֹא כָל־הָאָרֶץ לְפָנֶיךָ הִפָּרֶד נָא מֵעָלָי אִם־הַשְּׂמֹאל וְאֵימִנָה וְאִם־הַיָּמִין וְאַשְׂמְאִֽילָה׃", "10": "וַיִּשָּׂא־לוֹט אֶת־עֵינָיו וַיַּרְא אֶת־כָּל־כִּכַּר הַיַּרְדֵּן כִּי כֻלָּהּ מַשְׁקֶה לִפְנֵי ׀ שַׁחֵת יְהוָה אֶת־סְדֹם וְאֶת־עֲמֹרָה כְּגַן־יְהוָה כְּאֶרֶץ מִצְרַיִם בֹּאֲכָה צֹֽעַר׃", "11": "וַיִּבְחַר־לוֹ לוֹט אֵת כָּל־כִּכַּר הַיַּרְדֵּן וַיִּסַּע לוֹט מִקֶּדֶם וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִֽיו׃", "12": "אַבְרָם יָשַׁב בְּאֶֽרֶץ־כְּנָעַן וְלוֹט יָשַׁב בְּעָרֵי הַכִּכָּר וַיֶּאֱהַל עַד־סְדֹֽם׃", "13": "וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים לַיהוָה מְאֹֽד׃", "14": "וַֽיהוָה אָמַר אֶל־אַבְרָם אַחֲרֵי הִפָּֽרֶד־לוֹט מֵֽעִמּוֹ שָׂא נָא עֵינֶיךָ וּרְאֵה מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָֽמָּה׃", "15": "כִּי אֶת־כָּל־הָאָרֶץ אֲשֶׁר־אַתָּה רֹאֶה לְךָ אֶתְּנֶנָּה וּֽלְזַרְעֲךָ עַד־עוֹלָֽם׃", "16": "וְשַׂמְתִּי אֶֽת־זַרְעֲךָ כַּעֲפַר הָאָרֶץ אֲשֶׁר ׀ אִם־יוּכַל אִישׁ לִמְנוֹת אֶת־עֲפַר הָאָרֶץ גַּֽם־זַרְעֲךָ יִמָּנֶֽה׃", "17": "קוּם הִתְהַלֵּךְ בָּאָרֶץ לְאָרְכָּהּ וּלְרָחְבָּהּ כִּי לְךָ אֶתְּנֶֽנָּה׃", "18": "וַיֶּאֱהַל אַבְרָם וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן וַיִּֽבֶן־שָׁם מִזְבֵּחַ לַֽיהוָֽה׃"}, "lang": "hbo"}, "14": {"verses": {"1": "In the days of Amraphel king of Shinar, Arioch king of Ellasar, Kedorlaomer king of Elam, and Tidal king of the Goiim,\n", "2": "they made war against Bera king of Sodom, Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboiim, and the king of Bela, that is, Zoar.\n", "3": "All of these joined together in the Valley of Siddim, which is the Salt Sea.\n", "4": "They had served Kedorlaomer for twelve years, but in the thirteenth year they rebelled.\n", "5": "And in the fourteenth year, Kedorlaomer came with the kings who were with him, and they defeated the Rephaim in Ashteroth-Karnaim, the Zuzim in Ham, the Emim in the Valley of Kiriathaim,\n", "6": "the Horites in Mount Hermon, Seir, as far as the region of the Arabah, which is in the wilderness.\n", "7": "They returned and came to Eyn Mishpat, which is Kadesh, and they defeated all the land of the Amalekites, and also the Amorites who lived in Hazazon Tamar.\n", "8": "Then the king of Sodom, the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela, that is, Zoar, went out and made war in the Valley of Siddim,\n", "9": "against Kedorlaomer king of Elam, Tidal king of the Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against five.\n", "10": "The Valley of Siddim had pools of bitumen. The kings of Sodom and Gomorrah fled and fell there, while the survivors escaped to the hills.\n", "11": "They took all the goods of Sodom and Gomorrah and their food and went away.\n", "12": "They also took Lot, the nephew of Abram, along with his possessions, for he was living in Sodom.\n", "13": "A fugitive came and reported to Abram the Hebrew, who was living among the terebinth trees of Mamre the Amorite, a brother of Eshkol and of Aner, both of whom were allied to Abram.\n", "14": "When Abram heard that his brother had been captured, he led out his trained men, born in his household, 318 in all, and pursued them to Dan.\n", "15": "During the night, he and his men divided among them and attacked, routing them and chasing them as far as Hobah, which is to the left of Damascus.\n", "16": "He recovered all the goods and also rescued his brother Lot and his possessions, along with the women and the people.\n", "17": "The king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him, at the Valley of the King, which is the Valley of Shaveh.\n", "18": "Melchizedek, king of Salem, brought out bread and wine. He was a priest of God Most High.\n", "19": "He blessed him and said, \"Blessed be Abram by God Most High, Creator of heaven and earth.\n", "20": "And blessed be God Most High, who has delivered your enemies into your hand.\" Abram gave him a tenth of everything.\n", "21": "The king of Sodom said to Abram, \"Give me the people, and take the goods for yourself.\"\n", "22": "Abram replied to the king of Sodom, \"I have lifted my hand to the LORD, God Most High, Creator of heaven and earth,\n", "23": "that I will not take so much as a thread or a sandal strap from what is yours, lest you say, ‘I have made Abram rich.’\"\n", "24": "\"Except for what the young men have eaten, and the share of the men who went with me—Anar, Eshkol, and Mamre. Let them take their share.\"\n"}, "notes": "Notes\n- v. 23: \"So much as a thread or a sandal strap\" renders מִחוּט וְעַד שְׂרֽוֹךְ־נַעַל literally and idiomatically, capturing the idea of taking even the smallest item.\n- v. 23: \"I have made Abram rich\" is a paraphrase of the implied meaning of the Hebrew, not a direct translation of any specific phrase.", "src": {"1": "וַיְהִי בִּימֵי אַמְרָפֶל מֶֽלֶךְ־שִׁנְעָר אַרְיוֹךְ מֶלֶךְ אֶלָּסָר כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם וְתִדְעָל מֶלֶךְ גּוֹיִֽם׃", "2": "עָשׂוּ מִלְחָמָה אֶת־בֶּרַע מֶלֶךְ סְדֹם וְאֶת־בִּרְשַׁע מֶלֶךְ עֲמֹרָה שִׁנְאָב ׀ מֶלֶךְ אַדְמָה וְשֶׁמְאֵבֶר מֶלֶךְ צְבוֹיִים וּמֶלֶךְ בֶּלַע הִיא־צֹֽעַר׃", "3": "כָּל־אֵלֶּה חָֽבְרוּ אֶל־עֵמֶק הַשִּׂדִּים הוּא יָם הַמֶּֽלַח׃", "4": "שְׁתֵּים עֶשְׂרֵה שָׁנָה עָבְדוּ אֶת־כְּדָרְלָעֹמֶר וּשְׁלֹשׁ־עֶשְׂרֵה שָׁנָה מָרָֽדוּ׃", "5": "וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה בָּא כְדָרְלָעֹמֶר וְהַמְּלָכִים אֲשֶׁר אִתּוֹ וַיַּכּוּ אֶת־רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם וְאֶת־הַזּוּזִים בְּהָם וְאֵת הָֽאֵימִים בְּשָׁוֵה קִרְיָתָֽיִם׃", "6": "וְאֶת־הַחֹרִי בְּהַרְרָם שֵׂעִיר עַד אֵיל פָּארָן אֲשֶׁר עַל־הַמִּדְבָּֽר׃", "7": "וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־עֵין מִשְׁפָּט הִוא קָדֵשׁ וַיַּכּוּ אֶֽת־כָּל־שְׂדֵה הָעֲמָלֵקִי וְגַם אֶת־הָאֱמֹרִי הַיֹּשֵׁב בְּחַֽצְצֹן תָּמָֽר׃", "8": "וַיֵּצֵא מֶֽלֶךְ־סְדֹם וּמֶלֶךְ עֲמֹרָה וּמֶלֶךְ אַדְמָה וּמֶלֶךְ צְבוֹיִם וּמֶלֶךְ בֶּלַע הִוא־צֹעַר וַיַּֽעַרְכוּ אִתָּם מִלְחָמָה בְּעֵמֶק הַשִּׂדִּֽים׃", "9": "אֵת כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם וְתִדְעָל מֶלֶךְ גּוֹיִם וְאַמְרָפֶל מֶלֶךְ שִׁנְעָר וְאַרְיוֹךְ מֶלֶךְ אֶלָּסָר אַרְבָּעָה מְלָכִים אֶת־הַחֲמִשָּֽׁה׃", "10": "וְעֵמֶק הַשִׂדִּים בֶּֽאֱרֹת בֶּאֱרֹת חֵמָר וַיָּנֻסוּ מֶֽלֶךְ־סְדֹם וַעֲמֹרָה וַיִּפְּלוּ־שָׁמָּה וְהַנִּשְׁאָרִים הֶרָה נָּֽסוּ׃", "11": "וַיִּקְחוּ אֶת־כָּל־רְכֻשׁ סְדֹם וַעֲמֹרָה וְאֶת־כָּל־אָכְלָם וַיֵּלֵֽכוּ׃", "12": "וַיִּקְחוּ אֶת־לוֹט וְאֶת־רְכֻשׁוֹ בֶּן־אֲחִי אַבְרָם וַיֵּלֵכוּ וְהוּא יֹשֵׁב בִּסְדֹֽם׃", "13": "וַיָּבֹא הַפָּלִיט וַיַּגֵּד לְאַבְרָם הָעִבְרִי וְהוּא שֹׁכֵן בְּאֵֽלֹנֵי מַמְרֵא הָאֱמֹרִי אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר וְהֵם בַּעֲלֵי בְרִית־אַבְרָֽם׃", "14": "וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וַיָּרֶק אֶת־חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת וַיִּרְדֹּף עַד־דָּֽן׃", "15": "וַיֵּחָלֵק עֲלֵיהֶם ׀ לַיְלָה הוּא וַעֲבָדָיו וַיַּכֵּם וַֽיִּרְדְּפֵם עַד־חוֹבָה אֲשֶׁר מִשְּׂמֹאל לְדַמָּֽשֶׂק׃", "16": "וַיָּשֶׁב אֵת כָּל־הָרְכֻשׁ וְגַם אֶת־לוֹט אָחִיו וּרְכֻשׁוֹ הֵשִׁיב וְגַם אֶת־הַנָּשִׁים וְאֶת־הָעָֽם׃", "17": "וַיֵּצֵא מֶֽלֶךְ־סְדֹם לִקְרָאתוֹ אַחֲרֵי שׁוּבוֹ מֵֽהַכּוֹת אֶת־כְּדָרלָעֹמֶר וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ אֶל־עֵמֶק שָׁוֵה הוּא עֵמֶק הַמֶּֽלֶךְ׃", "18": "וּמַלְכִּי־צֶדֶק מֶלֶךְ שָׁלֵם הוֹצִיא לֶחֶם וָיָיִן וְהוּא כֹהֵן לְאֵל עֶלְיֽוֹן׃", "19": "וַֽיְבָרְכֵהוּ וַיֹּאמַר בָּרוּךְ אַבְרָם לְאֵל עֶלְיוֹן קֹנֵה שָׁמַיִם וָאָֽרֶץ׃", "20": "וּבָרוּךְ אֵל עֶלְיוֹן אֲשֶׁר־מִגֵּן צָרֶיךָ בְּיָדֶךָ וַיִּתֶּן־לוֹ מַעֲשֵׂר מִכֹּֽל׃", "21": "וַיֹּאמֶר מֶֽלֶךְ־סְדֹם אֶל־אַבְרָם תֶּן־לִי הַנֶּפֶשׁ וְהָרְכֻשׁ קַֽח־לָֽךְ׃", "22": "וַיֹּאמֶר אַבְרָם אֶל־מֶלֶךְ סְדֹם הֲרִימֹתִי יָדִי אֶל־יְהוָה אֵל עֶלְיוֹן קֹנֵה שָׁמַיִם וָאָֽרֶץ׃", "23": "אִם־מִחוּט וְעַד שְׂרֽוֹךְ־נַעַל וְאִם־אֶקַּח מִכָּל־אֲשֶׁר־לָךְ וְלֹא תֹאמַר אֲנִי הֶעֱשַׁרְתִּי אֶת־אַבְרָֽם׃", "24": "בִּלְעָדַי רַק אֲשֶׁר אָֽכְלוּ הַנְּעָרִים וְחֵלֶק הָֽאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי עָנֵר אֶשְׁכֹּל וּמַמְרֵא הֵם יִקְחוּ חֶלְקָֽם׃"}, "lang": "hbo"}, "15": {"verses": {"1": "After these events, the word of the LORD came to Abram in a vision, saying, \"Do not fear, Abram. I am your shield, and your reward will be exceedingly great.\"\n", "2": "Abram said, \"O Lord GOD, what will you give me, since I continue childless, and the heir of my household is Eliezer of Damascus?\"\n", "3": "Abram added, \"You have given me no offspring, and so a servant born in my house will inherit me.\"\n", "4": "But the word of the LORD came to him, \"This one will not inherit you. No, the one who will come from your own body will inherit you.\"\n", "5": "He took him outside and said, \"Look now toward the heavens and count the stars, if you are able to count them.\" He said to him, \"So shall your offspring be.\"\n", "6": "Abram believed the LORD, and he counted it to him as righteousness.\n", "7": "He said to him, \"I am the LORD who brought you from Ur of the Chaldeans to give you this land to possess it.\"\n", "8": "Abram asked, \"O Lord GOD, by what will I know that I will possess it?\"\n", "9": "He said to him, \"Take for me a heifer three years old, a female goat three years old, a ram three years old, a turtledove, and a young pigeon.\"\n", "10": "Abram took all these, cut them in two, and placed each half opposite the other. But he did not cut the birds.\n", "11": "Birds of prey descended on the carcasses, and Abram drove them away.\n", "12": "The sun was about to set, and a deep sleep fell upon Abram. A dark and terrifying shadow passed over him.\n", "13": "He said to Abram, \"Know this for certain: your descendants will be strangers in a land not theirs. They will serve and be oppressed there for four hundred years.\n", "14": "But I will judge the nation they serve, and afterward they will go out with great possessions.\n", "15": "As for you, you will go to your fathers in peace. You will be buried at a good old age.\"\n", "16": "But in the fourth generation they will return here, for the sin of the Amorites is not yet complete.\"\n", "17": "The sun had set, and it was dark. A smoking furnace and a flaming torch passed between the pieces.\n", "18": "On that day the LORD made a covenant with Abram, saying, \"To your offspring I give this land, from the river of Egypt to the great river, the Euphrates:\n", "19": "the Kenite, the Kenezzite, and the Kadmonite,\n", "20": "the Hittite, the Perizzite, and the Rephaim,\n", "21": "the Amorite, the Canaanite, the Girgashite, and the Jebusite.\"\n"}, "notes": "Notes\n- v. 8: \"By what will I know\" — the use of \"בַּמָּה\" is idiomatic, often rendered as \"by what\" or \"in what way.\"\n- v. 16: \"the sin of the Amorites is not yet complete\" — the Hebrew uses \"עֲוֺן\" (iniquity/sin) and \"שָׁלֵם\" (complete/satisfied), indicating a moral or judicial delay.\n- v. 17: \"a smoking furnace and a flaming torch passed between the pieces\" — the imagery is poetic and symbolic, representing the seal of the covenant.", "src": {"1": "אַחַר ׀ הַדְּבָרִים הָאֵלֶּה הָיָה דְבַר־יְהוָה אֶל־אַבְרָם בַּֽמַּחֲזֶה לֵאמֹר אַל־תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹֽד׃", "2": "וַיֹּאמֶר אַבְרָם אֲדֹנָי יֱהוִה מַה־תִּתֶּן־לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן־מֶשֶׁק בֵּיתִי הוּא דַּמֶּשֶׂק אֱלִיעֶֽזֶר׃", "3": "וַיֹּאמֶר אַבְרָם הֵן לִי לֹא נָתַתָּה זָרַע וְהִנֵּה בֶן־בֵּיתִי יוֹרֵשׁ אֹתִֽי׃", "4": "וְהִנֵּה דְבַר־יְהוָה אֵלָיו לֵאמֹר לֹא יִֽירָשְׁךָ זֶה כִּי־אִם אֲשֶׁר יֵצֵא מִמֵּעֶיךָ הוּא יִֽירָשֶֽׁךָ׃", "5": "וַיּוֹצֵא אֹתוֹ הַחוּצָה וַיֹּאמֶר הַבֶּט־נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם־תּוּכַל לִסְפֹּר אֹתָם וַיֹּאמֶר לוֹ כֹּה יִהְיֶה זַרְעֶֽךָ׃", "6": "וְהֶאֱמִן בַּֽיהוָה וַיַּחְשְׁבֶהָ לּוֹ צְדָקָֽה׃", "7": "וַיֹּאמֶר אֵלָיו אֲנִי יְהוָה אֲשֶׁר הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִּים לָתֶת לְךָ אֶת־הָאָרֶץ הַזֹּאת לְרִשְׁתָּֽהּ׃", "8": "וַיֹּאמַר אֲדֹנָי יֱהוִה בַּמָּה אֵדַע כִּי אִֽירָשֶֽׁנָּה׃", "9": "וַיֹּאמֶר אֵלָיו קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ וְתֹר וְגוֹזָֽל׃", "10": "וַיִּֽקַּֽח־לוֹ אֶת־כָּל־אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ וַיִּתֵּן אִישׁ־בִּתְרוֹ לִקְרַאת רֵעֵהוּ וְאֶת־הַצִפֹּר לֹא בָתָֽר׃", "11": "וַיֵּרֶד הָעַיִט עַל־הַפְּגָרִים וַיַּשֵּׁב אֹתָם אַבְרָֽם׃", "12": "וַיְהִי הַשֶּׁמֶשׁ לָבוֹא וְתַרְדֵּמָה נָפְלָה עַל־אַבְרָם וְהִנֵּה אֵימָה חֲשֵׁכָה גְדֹלָה נֹפֶלֶת עָלָֽיו׃", "13": "וַיֹּאמֶר לְאַבְרָם יָדֹעַ תֵּדַע כִּי־גֵר ׀ יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָֽה׃", "14": "וְגַם אֶת־הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי וְאַחֲרֵי־כֵן יֵצְאוּ בִּרְכֻשׁ גָּדֽוֹל׃", "15": "וְאַתָּה תָּבוֹא אֶל־אֲבֹתֶיךָ בְּשָׁלוֹם תִּקָּבֵר בְּשֵׂיבָה טוֹבָֽה׃", "16": "וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה כִּי לֹא־שָׁלֵם עֲוֺן הָאֱמֹרִי עַד־הֵֽנָּה׃", "17": "וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵֽלֶּה׃", "18": "בַּיּוֹם הַהוּא כָּרַת יְהוָה אֶת־אַבְרָם בְּרִית לֵאמֹר לְזַרְעֲךָ נָתַתִּי אֶת־הָאָרֶץ הַזֹּאת מִנְּהַר מִצְרַיִם עַד־הַנָּהָר הַגָּדֹל נְהַר־פְּרָֽת׃", "19": "אֶת־הַקֵּינִי וְאֶת־הַקְּנִזִּי וְאֵת הַקַּדְמֹנִֽי׃", "20": "וְאֶת־הַחִתִּי וְאֶת־הַפְּרִזִּי וְאֶת־הָרְפָאִֽים׃", "21": "וְאֶת־הָֽאֱמֹרִי וְאֶת־הַֽכְּנַעֲנִי וְאֶת־הַגִּרְגָּשִׁי וְאֶת־הַיְבוּסִֽי׃"}, "lang": "hbo"}, "16": {"verses": {"1": "Sarai, the wife of Abram, did not bear children for him. She had an Egyptian servant named Hagar.\n", "2": "Sarai said to Abram, \"Look, the LORD has withheld from me the ability to bear children. Please go in to my servant. Perhaps I will have a child through her.\" Abram listened to the voice of Sarai.\n", "3": "Sarai, the wife of Abram, took Hagar the Egyptian, her servant, after Abram had lived ten years in the land of Canaan. She gave her to Abram, her husband, to be his wife.\n", "4": "He went in to Hagar, and she became pregnant. When she saw that she was pregnant, she looked down on her mistress in her eyes.\n", "5": "Sarai said to Abram, \"You have been unjust to me. I gave my servant to your bosom, and when she saw that she was pregnant, she looked down on me. May the LORD be the judge between you and me.\"\n", "6": "Abram said to Sarai, \"Here, your servant is in your power. Do to her what pleases you in your eyes.\" So Sarai treated her harshly, and Hagar fled from her presence.\n", "7": "An angel of the LORD found her by a spring in the wilderness, at the spring on the road to Shur.\n", "8": "He said, \"Hagar, servant of Sarai, where have you come from and where are you going?\" She replied, \"I am fleeing from my mistress Sarai.\"\n", "9": "The angel of the LORD said to her, \"Return to your mistress and be subject to her hand.\"\n", "10": "He said to her, \"I will greatly multiply your offspring, and they will be innumerable because of their abundance.\"\n", "11": "He said to her, \"You are pregnant and will give birth to a son. Name him Ishmael, for the LORD has heard your suffering.\"\n", "12": "He will be a wild man. His hand will be against all, and the hand of all against him. He will dwell over all his brothers.\"\n", "13": "She gave the name of the LORD who had spoken to her: \"You are the God who sees me,\" for she said, \"Have I truly seen the One who sees me?\"\n", "14": "So the well was named Beer-lahai-roi; it is between Kadesh and Bered.\n", "15": "Hagar bore Abram a son, and Abram named the son whom Hagar had borne to him Ishmael.\n", "16": "Abram was eighty-six years old when Hagar bore Ishmael to Abram.\n"}, "notes": "Notes\n- v. 1: \"shifcha\" is translated as \"servant\" rather than \"maidservant\" to align with modern English clarity and the narrative's context.\n- v. 13: \"Ata el ro'i\" is rendered as \"You are the God who sees me,\" reflecting the meaning of the name rather than a direct transliteration.\n- v. 14: \"Beer-lahai-roi\" is transliterated with a brief explanation to preserve the proper name while offering context.", "src": {"1": "וְשָׂרַי אֵשֶׁת אַבְרָם לֹא יָלְדָה לוֹ וְלָהּ שִׁפְחָה מִצְרִית וּשְׁמָהּ הָגָֽר׃", "2": "וַתֹּאמֶר שָׂרַי אֶל־אַבְרָם הִנֵּה־נָא עֲצָרַנִי יְהוָה מִלֶּדֶת בֹּא־נָא אֶל־שִׁפְחָתִי אוּלַי אִבָּנֶה מִמֶּנָּה וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָֽי׃", "3": "וַתִּקַּח שָׂרַי אֵֽשֶׁת־אַבְרָם אֶת־הָגָר הַמִּצְרִית שִׁפְחָתָהּ מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ לוֹ לְאִשָּֽׁה׃", "4": "וַיָּבֹא אֶל־הָגָר וַתַּהַר וַתֵּרֶא כִּי הָרָתָה וַתֵּקַל גְּבִרְתָּהּ בְּעֵינֶֽיהָ׃", "5": "וַתֹּאמֶר שָׂרַי אֶל־אַבְרָם חֲמָסִי עָלֶיךָ אָנֹכִי נָתַתִּי שִׁפְחָתִי בְּחֵיקֶךָ וַתֵּרֶא כִּי הָרָתָה וָאֵקַל בְּעֵינֶיהָ יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶֽיׄךָ׃", "6": "וַיֹּאמֶר אַבְרָם אֶל־שָׂרַי הִנֵּה שִׁפְחָתֵךְ בְּיָדֵךְ עֲשִׂי־לָהּ הַטּוֹב בְּעֵינָיִךְ וַתְּעַנֶּהָ שָׂרַי וַתִּבְרַח מִפָּנֶֽיהָ׃", "7": "וַֽיִּמְצָאָהּ מַלְאַךְ יְהוָה עַל־עֵין הַמַּיִם בַּמִּדְבָּר עַל־הָעַיִן בְּדֶרֶךְ שֽׁוּר׃", "8": "וַיֹּאמַר הָגָר שִׁפְחַת שָׂרַי אֵֽי־מִזֶּה בָאת וְאָנָה תֵלֵכִי וַתֹּאמֶר מִפְּנֵי שָׂרַי גְּבִרְתִּי אָנֹכִי בֹּרַֽחַת׃", "9": "וַיֹּאמֶר לָהּ מַלְאַךְ יְהוָה שׁוּבִי אֶל־גְּבִרְתֵּךְ וְהִתְעַנִּי תַּחַת יָדֶֽיהָ׃", "10": "וַיֹּאמֶר לָהּ מַלְאַךְ יְהוָה הַרְבָּה אַרְבֶּה אֶת־זַרְעֵךְ וְלֹא יִסָּפֵר מֵרֹֽב׃", "11": "וַיֹּאמֶר לָהּ מַלְאַךְ יְהוָה הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל כִּֽי־שָׁמַע יְהוָה אֶל־עָנְיֵֽךְ׃", "12": "וְהוּא יִהְיֶה פֶּרֶא אָדָם יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ וְעַל־פְּנֵי כָל־אֶחָיו יִשְׁכֹּֽן׃", "13": "וַתִּקְרָא שֵׁם־יְהוָה הַדֹּבֵר אֵלֶיהָ אַתָּה אֵל רֳאִי כִּי אָֽמְרָה הֲגַם הֲלֹם רָאִיתִי אַחֲרֵי רֹאִֽי׃", "14": "עַל־כֵּן קָרָא לַבְּאֵר בְּאֵר לַחַי רֹאִי הִנֵּה בֵין־קָדֵשׁ וּבֵין בָּֽרֶד׃", "15": "וַתֵּלֶד הָגָר לְאַבְרָם בֵּן וַיִּקְרָא אַבְרָם שֶׁם־בְּנוֹ אֲשֶׁר־יָלְדָה הָגָר יִשְׁמָעֵֽאל׃", "16": "וְאַבְרָם בֶּן־שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים בְּלֶֽדֶת־הָגָר אֶת־יִשְׁמָעֵאל לְאַבְרָֽם׃"}, "lang": "hbo"}, "17": {"verses": {"1": "Abram was ninety-nine years old when the LORD appeared to him. He said, \"I am El Shaddai. Walk in my presence and be blameless.\n", "2": "I will establish a covenant between me and you. I will multiply you greatly, very greatly.\"\n", "3": "Abram fell on his face, and God spoke to him, saying:\n", "4": "\"I am making this covenant with you. You will be the father of a countless number of nations.\n", "5": "No longer will your name be Abram. Your name will be Abraham, for I have made you the father of a countless number of nations.\n", "6": "I will make you exceedingly fruitful. I will make you into nations, and from you will come forth kings.\n", "7": "I will establish my covenant between me and you, and between your descendants after you, generation after generation, as an everlasting covenant, to be your God and the God of your descendants after you.\n", "8": "I will give to you and to your descendants after you the land of your sojournings, the whole land of Canaan, as a permanent possession. And I will be their God.\n", "9": "God said to Abraham, \"You must keep my covenant, you and your descendants after you, generation after generation.\n", "10": "This is my covenant, which you must keep between me and you and your descendants after you: Every male among you must be circumcised.\n", "11": "You must circumcise the flesh of your foreskins, and it will be a sign of the covenant between me and you.\n", "12": "Every male among you, whether born in your household or bought with your money from a foreign people not of your descendants, must be circumcised at the age of eight days.\n", "13": "Whether born in your household or bought with your money, every male must be circumcised. This will be my covenant in your flesh, an everlasting covenant.\n", "14": "Any male who is not circumcised in the flesh of his foreskin shall be cut off from his people. He has broken my covenant.\"\n", "15": "God said to Abraham, \"As for your wife Sarai, you must no longer call her name Sarai. Her name is Sarah.\n", "16": "I will bless her, and from her I will give you a son. I will bless her, and she will become mothers of nations. Kings of peoples will come from her.\"\n", "17": "Abraham fell on his face, and he laughed. He said to himself, \"Can a son be born to one who is a hundred years old? And can Sarah, who is ninety years old, bear a child?\"\n", "18": "Abraham said to God, \"If only Ishmael might live before you!\"\n", "19": "God said, \"No, but Sarah your wife will bear you a son. His name will be Isaac. I will establish my covenant with him, for an everlasting covenant for his descendants after him.\"\n", "20": "As for Ishmael, I have heard you. I will bless him, and I will multiply him greatly. He will father twelve chieftains, and I will make him into a great nation.\n", "21": "But my covenant I will establish with Isaac, the son whom Sarah will bear to you, in this year at this time, next year.\"\n", "22": "God finished speaking to him, and the presence of God went up from Abraham.\n", "23": "Abraham took Ishmael his son and all those born in his household and all those bought with his money, every male among the men of his household, and circumcised the flesh of their foreskins on the very day God had spoken to him.\n", "24": "Abraham was ninety-nine years old when he was circumcised in the flesh of his foreskin.\n", "25": "Ishmael his son was thirteen years old when he was circumcised in the flesh of his fores", "26": "On the very day Abraham was circumcised, and Ishmael his son.\n", "27": "Every man in his household, whether born in the household or bought with money from a foreigner, was circumcised with him."}, "notes": "Notes\n- v. 14: The Hebrew term נֶפֶשׁ (nephesh) is translated as \"life\" in \"the life shall be cut off,\" which avoids the term \"soul\" and aligns with the glossary instruction to use contextually appropriate terms.\n- v. 15-16: The name change from Sarai to Sarah is presented as a divine directive, with the promise of Sarah becoming \"mothers of nations\" to reflect the Hebrew plural used in reference to her.", "src": {"1": "וַיְהִי אַבְרָם בֶּן־תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים וַיֵּרָא יְהוָה אֶל־אַבְרָם וַיֹּאמֶר אֵלָיו אֲנִי־אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִֽים׃", "2": "וְאֶתְּנָה בְרִיתִי בֵּינִי וּבֵינֶךָ וְאַרְבֶּה אוֹתְךָ בִּמְאֹד מְאֹֽד׃", "3": "וַיִּפֹּל אַבְרָם עַל־פָּנָיו וַיְדַבֵּר אִתּוֹ אֱלֹהִים לֵאמֹֽר׃", "4": "אֲנִי הִנֵּה בְרִיתִי אִתָּךְ וְהָיִיתָ לְאַב הֲמוֹן גּוֹיִֽם׃", "5": "וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ אַבְרָהָם כִּי אַב־הֲמוֹן גּוֹיִם נְתַתִּֽיךָ׃", "6": "וְהִפְרֵתִי אֹֽתְךָ בִּמְאֹד מְאֹד וּנְתַתִּיךָ לְגוֹיִם וּמְלָכִים מִמְּךָ יֵצֵֽאוּ׃", "7": "וַהֲקִמֹתִי אֶת־בְּרִיתִי בֵּינִי וּבֵינֶךָ וּבֵין זַרְעֲךָ אַחֲרֶיךָ לְדֹרֹתָם לִבְרִית עוֹלָם לִהְיוֹת לְךָ לֵֽאלֹהִים וּֽלְזַרְעֲךָ אַחֲרֶֽיךָ׃", "8": "וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת ׀ אֶרֶץ מְגֻרֶיךָ אֵת כָּל־אֶרֶץ כְּנַעַן לַאֲחֻזַּת עוֹלָם וְהָיִיתִי לָהֶם לֵאלֹהִֽים׃", "9": "וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם וְאַתָּה אֶת־בְּרִיתִי תִשְׁמֹר אַתָּה וְזַרְעֲךָ אַֽחֲרֶיךָ לְדֹרֹתָֽם׃", "10": "זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ הִמּוֹל לָכֶם כָּל־זָכָֽר׃", "11": "וּנְמַלְתֶּם אֵת בְּשַׂר עָרְלַתְכֶם וְהָיָה לְאוֹת בְּרִית בֵּינִי וּבֵינֵיכֶֽם׃", "12": "וּבֶן־שְׁמֹנַת יָמִים יִמּוֹל לָכֶם כָּל־זָכָר לְדֹרֹתֵיכֶם יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מִכֹּל בֶּן־נֵכָר אֲשֶׁר לֹא מִֽזַּרְעֲךָ הֽוּא׃", "13": "הִמּוֹל ׀ יִמּוֹל יְלִיד בֵּֽיתְךָ וּמִקְנַת כַּסְפֶּךָ וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָֽם׃", "14": "וְעָרֵל ׀ זָכָר אֲשֶׁר לֹֽא־יִמּוֹל אֶת־בְּשַׂר עָרְלָתוֹ וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ אֶת־בְּרִיתִי הֵפַֽר׃", "15": "וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם שָׂרַי אִשְׁתְּךָ לֹא־תִקְרָא אֶת־שְׁמָהּ שָׂרָי כִּי שָׂרָה שְׁמָֽהּ׃", "16": "וּבֵרַכְתִּי אֹתָהּ וְגַם נָתַתִּי מִמֶּנָּה לְךָ בֵּן וּבֵֽרַכְתִּיהָ וְהָֽיְתָה לְגוֹיִם מַלְכֵי עַמִּים מִמֶּנָּה יִהְיֽוּ׃", "17": "וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו וַיִּצְחָק וַיֹּאמֶר בְּלִבּוֹ הַלְּבֶן מֵאָֽה־שָׁנָה יִוָּלֵד וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵֽד׃", "18": "וַיֹּאמֶר אַבְרָהָם אֶל־הָֽאֱלֹהִים לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶֽיךָ׃", "19": "וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן וְקָרָאתָ אֶת־שְׁמוֹ יִצְחָק וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ לִבְרִית עוֹלָם לְזַרְעוֹ אַחֲרָֽיו׃", "20": "וּֽלְיִשְׁמָעֵאל שְׁמַעְתִּיךָ הִנֵּה ׀ בֵּרַכְתִּי אֹתוֹ וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד שְׁנֵים־עָשָׂר נְשִׂיאִם יוֹלִיד וּנְתַתִּיו לְגוֹי גָּדֽוֹל׃", "21": "וְאֶת־בְּרִיתִי אָקִים אֶת־יִצְחָק אֲשֶׁר תֵּלֵד לְךָ שָׂרָה לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶֽרֶת׃", "22": "וַיְכַל לְדַבֵּר אִתּוֹ וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָֽם׃", "23": "וַיִּקַּח אַבְרָהָם אֶת־יִשְׁמָעֵאל בְּנוֹ וְאֵת כָּל־יְלִידֵי בֵיתוֹ וְאֵת כָּל־מִקְנַת כַּסְפּוֹ כָּל־זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם וַיָּמָל אֶת־בְּשַׂר עָרְלָתָם בְּעֶצֶם הַיּוֹם הַזֶּה כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִֽים׃", "24": "וְאַבְרָהָם בֶּן־תִּשְׁעִים וָתֵשַׁע שָׁנָה בְּהִמֹּלוֹ בְּשַׂר עָרְלָתֽוֹ׃", "25": "וְיִשְׁמָעֵאל בְּנוֹ בֶּן־שְׁלֹשׁ עֶשְׂרֵה שָׁנָה בְּהִמֹּלוֹ אֵת בְּשַׂר עָרְלָתֽוֹ׃", "26": "בְּעֶצֶם הַיּוֹם הַזֶּה נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנֽוֹ׃", "27": "וְכָל־אַנְשֵׁי בֵיתוֹ יְלִיד בָּיִת וּמִקְנַת־כֶּסֶף מֵאֵת בֶּן־נֵכָר נִמֹּלוּ אִתּֽוֹ׃"}, "lang": "hbo"}, "18": {"verses": {"1": "The LORD appeared to Abraham near the terebinth trees of Mamre as he was sitting at the entrance of his tent in the heat of the day.\n", "2": "He looked up and saw three men standing near him. He looked up and ran to greet them, bowing low to the ground.\n", "3": "He said, \"My lord, if I have found favor in your eyes, please do not pass by your servant.\"\n", "4": "\"Let me bring a little water,\" he said, \"and you can wash your feet and rest under the tree.\n", "5": "I will also bring some bread, so you may refresh yourselves before you continue on, for you have passed by your servant.\" They said, \"Do as you have said.\"\n", "6": "Abraham hurried into the tent to Sarah and said, \"Quick, prepare three measures of fine flour, knead it, and make cakes.\"\n", "7": "Then he ran to the herd, selected a tender and good young bull, and gave it to the servant, who hurried to prepare it.\n", "8": "He took curd and milk and the cooked bull, set it before them, and stood over them under the tree while they ate.\n", "9": "The men said to Abraham, \"Where is your wife Sarah?\" He replied, \"There, in the tent.\"\n", "10": "One of them said, \"I will return to you at the appointed time, and behold, Sarah your wife will have a son.\" Sarah was listening at the entrance of the tent behind him.\n", "11": "Abraham and Sarah were both old, advanced in years. It had ceased to be with Sarah as the way of women.\n", "12": "Sarah laughed to herself, thinking, \"After I have grown old, will I have pleasure? And my master is old!\"\n", "13": "The LORD said to Abraham, \"Why did Sarah laugh, saying, 'Shall I indeed bear a child, when I am so old?'\"\n", "14": "\"Is anything too hard for the LORD?\" he asked. \"I will return to you at the appointed time, and Sarah will have a son.\"\n", "15": "Sarah denied it, saying, \"I did not laugh,\" for she was afraid. But he said, \"Yes, you did laugh.\"\n", "16": "The men left from there and looked toward Sodom, and Abraham walked with them to send them off.\n", "17": "The LORD said, \"Shall I hide from Abraham what I am about to do?\n", "18": "For Abraham will surely become a great and mighty nation, and all the nations of the earth will be blessed through him.\n", "19": "For I have chosen him, so that he may command his children and his household after him to keep the way of the LORD by doing righteousness and justice, so that the LORD may bring to Abraham what he has promised him.\"\n", "20": "The LORD said, \"The outcry of Sodom and Gomorrah is great, and their sin is very grave.\n", "21": "I will go down now and see whether they have done entirely according to the outcry that has come to me, and if not, I will know.\"\n", "22": "The men turned from there and went toward Sodom, while Abraham remained standing before the LORD.\n", "23": "Abraham approached and said, \"Will you indeed destroy the righteous along with the wicked?\n", "24": "Suppose there are fifty righteous in the city. Will you destroy and not spare the place for the sake of the fifty righteous who are in it?\n", "25": "Far be it from you to do such a thing, to kill the righteous with the wicked, so that the righteous is like the wicked. Far be it from you! Shall the Judge of all the earth not do justice?\"\n", "26": "The LORD said, \"If I find fifty righteous in Sodom, I will spare the whole place for their sake.\"\n", "27": "Abraham answered, \"I, though I am but dust and ashes, have taken the liberty to speak to my Lord.\n", "28": "Suppose the fifty righteous are lacking five; will you destroy the whole city because of the five?\" And he said, \"I will not destroy it if I find forty-five there.\"\n", "29": "He continued speaking to him and said, \"Suppose forty are found there.\" He said, \"I will not do it for the sake of forty.\"\n", "30": "He said, \"May my Lord not grow angry, and I will speak just once more. Suppose thirty are found there.\" He said, \"I will not do it if I find thirty there.\"\n", "31": "He said, \"I, though I am but dust and ashes, will speak to my Lord just this once. Suppose twenty are found there.\" He said, \"I will not destroy it for the sake of twenty.\"\n", "32": "He said, \"May my Lord not grow angry, and I will speak yet once more. Suppose ten are found there.\" He said, \"I will not destroy it for the sake of ten.\"\n", "33": "The LORD went his way after he had finished speaking to Abraham, and Abraham returned to his place.\n"}, "notes": "Notes\n- v. 10: \"I will return to you at the appointed time\" — the phrase \"the appointed time\" translates מָאתָה, which is a Hebrew idiom for a specific future moment.\n- v. 15: \"I did not laugh\" — Sarah's denial is a rare case where the context forces a departure from the glossary's \"never 'soul' by default\" for נֶפֶשׁ, which appears here in the phrase \"I did not laugh,\" but it is not used in the sense of 'soul' here.\n- v. 25: \"The righteous is like the wicked\" — the Hebrew כָּרָשָׁע is translated as \"the wicked\" but is used here in comparison, hence the repetition for emphasis.\n- v. 32: \"just this once\" — the Hebrew phrase לַפַּעַם is translated as \"just this once\" to reflect the incremental negotiation in tone and intent.", "src": {"1": "וַיֵּרָא אֵלָיו יְהוָה בְּאֵלֹנֵי מַמְרֵא וְהוּא יֹשֵׁב פֶּֽתַח־הָאֹהֶל כְּחֹם הַיּֽוֹם׃", "2": "וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה שְׁלֹשָׁה אֲנָשִׁים נִצָּבִים עָלָיו וַיַּרְא וַיָּרָץ לִקְרָאתָם מִפֶּתַח הָאֹהֶל וַיִּשְׁתַּחוּ אָֽרְצָה׃", "3": "וַיֹּאמַר אֲדֹנָי אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ אַל־נָא תַעֲבֹר מֵעַל עַבְדֶּֽךָ׃", "4": "יֻקַּֽח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִֽשָּׁעֲנוּ תַּחַת הָעֵֽץ׃", "5": "וְאֶקְחָה פַת־לֶחֶם וְסַעֲדוּ לִבְּכֶם אַחַר תַּעֲבֹרוּ כִּֽי־עַל־כֵּן עֲבַרְתֶּם עַֽל־עַבְדְּכֶם וַיֹּאמְרוּ כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּֽרְתָּ׃", "6": "וַיְמַהֵר אַבְרָהָם הָאֹהֱלָה אֶל־שָׂרָה וַיֹּאמֶר מַהֲרִי שְׁלֹשׁ סְאִים קֶמַח סֹלֶת לוּשִׁי וַעֲשִׂי עֻגֽוֹת׃", "7": "וְאֶל־הַבָּקָר רָץ אַבְרָהָם וַיִּקַּח בֶּן־בָּקָר רַךְ וָטוֹב וַיִּתֵּן אֶל־הַנַּעַר וַיְמַהֵר לַעֲשׂוֹת אֹתֽוֹ׃", "8": "וַיִּקַּח חֶמְאָה וְחָלָב וּבֶן־הַבָּקָר אֲשֶׁר עָשָׂה וַיִּתֵּן לִפְנֵיהֶם וְהֽוּא־עֹמֵד עֲלֵיהֶם תַּחַת הָעֵץ וַיֹּאכֵֽלוּ׃", "9": "וַיֹּאמְרוּ אֵׄלָׄיׄוׄ אַיֵּה שָׂרָה אִשְׁתֶּךָ וַיֹּאמֶר הִנֵּה בָאֹֽהֶל׃", "10": "וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וְהִנֵּה־בֵן לְשָׂרָה אִשְׁתֶּךָ וְשָׂרָה שֹׁמַעַת פֶּתַח הָאֹהֶל וְהוּא אַחֲרָֽיו׃", "11": "וְאַבְרָהָם וְשָׂרָה זְקֵנִים בָּאִים בַּיָּמִים חָדַל לִהְיוֹת לְשָׂרָה אֹרַח כַּנָּשִֽׁים׃", "12": "וַתִּצְחַק שָׂרָה בְּקִרְבָּהּ לֵאמֹר אַחֲרֵי בְלֹתִי הָֽיְתָה־לִּי עֶדְנָה וַֽאדֹנִי זָקֵֽן׃", "13": "וַיֹּאמֶר יְהוָה אֶל־אַבְרָהָם לָמָּה זֶּה צָחֲקָה שָׂרָה לֵאמֹר הַאַף אֻמְנָם אֵלֵד וַאֲנִי זָקַֽנְתִּי׃", "14": "הֲיִפָּלֵא מֵיְהוָה דָּבָר לַמּוֹעֵד אָשׁוּב אֵלֶיךָ כָּעֵת חַיָּה וּלְשָׂרָה בֵֽן׃", "15": "וַתְּכַחֵשׁ שָׂרָה ׀ לֵאמֹר לֹא צָחַקְתִּי כִּי ׀ יָרֵאָה וַיֹּאמֶר ׀ לֹא כִּי צָחָֽקְתְּ׃", "16": "וַיָּקֻמוּ מִשָּׁם הָֽאֲנָשִׁים וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם וְאַבְרָהָם הֹלֵךְ עִמָּם לְשַׁלְּחָֽם׃", "17": "וַֽיהֹוָה אָמָר הַֽמְכַסֶּה אֲנִי מֵֽאַבְרָהָם אֲשֶׁר אֲנִי עֹשֶֽׂה׃", "18": "וְאַבְרָהָם הָיוֹ יִֽהְיֶה לְגוֹי גָּדוֹל וְעָצוּם וְנִבְרְכוּ בוֹ כֹּל גּוֹיֵי הָאָֽרֶץ׃", "19": "כִּי יְדַעְתִּיו לְמַעַן אֲשֶׁר יְצַוֶּה אֶת־בָּנָיו וְאֶת־בֵּיתוֹ אַחֲרָיו וְשָֽׁמְרוּ דֶּרֶךְ יְהוָה לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט לְמַעַן הָבִיא יְהוָה עַל־אַבְרָהָם אֵת אֲשֶׁר־דִּבֶּר עָלָֽיו׃", "20": "וַיֹּאמֶר יְהוָה זַעֲקַת סְדֹם וַעֲמֹרָה כִּי־רָבָּה וְחַטָּאתָם כִּי כָבְדָה מְאֹֽד׃", "21": "אֵֽרֲדָה־נָּא וְאֶרְאֶה הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי עָשׂוּ ׀ כָּלָה וְאִם־לֹא אֵדָֽעָה׃", "22": "וַיִּפְנוּ מִשָּׁם הָֽאֲנָשִׁים וַיֵּלְכוּ סְדֹמָה וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד לִפְנֵי יְהוָֽה׃", "23": "וַיִּגַּשׁ אַבְרָהָם וַיֹּאמַר הַאַף תִּסְפֶּה צַדִּיק עִם־רָשָֽׁע׃", "24": "אוּלַי יֵשׁ חֲמִשִּׁים צַדִּיקִם בְּתוֹךְ הָעִיר הַאַף תִּסְפֶּה וְלֹא־תִשָּׂא לַמָּקוֹם לְמַעַן חֲמִשִּׁים הַצַּדִּיקִם אֲשֶׁר בְּקִרְבָּֽהּ׃", "25": "חָלִלָה לְּךָ מֵעֲשֹׂת ׀ כַּדָּבָר הַזֶּה לְהָמִית צַדִּיק עִם־רָשָׁע וְהָיָה כַצַּדִּיק כָּרָשָׁע חָלִלָה לָּךְ הֲשֹׁפֵט כָּל־הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּֽט׃", "26": "וַיֹּאמֶר יְהוָה אִם־אֶמְצָא בִסְדֹם חֲמִשִּׁים צַדִּיקִם בְּתוֹךְ הָעִיר וְנָשָׂאתִי לְכָל־הַמָּקוֹם בַּעֲבוּרָֽם׃", "27": "וַיַּעַן אַבְרָהָם וַיֹּאמַר הִנֵּה־נָא הוֹאַלְתִּי לְדַבֵּר אֶל־אֲדֹנָי וְאָנֹכִי עָפָר וָאֵֽפֶר׃", "28": "אוּלַי יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה הֲתַשְׁחִית בַּחֲמִשָּׁה אֶת־כָּל־הָעִיר וַיֹּאמֶר לֹא אַשְׁחִית אִם־אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּֽׁה׃", "29": "וַיֹּסֶף עוֹד לְדַבֵּר אֵלָיו וַיֹּאמַר אוּלַי יִמָּצְאוּן שָׁם אַרְבָּעִים וַיֹּאמֶר לֹא אֶֽעֱשֶׂה בַּעֲבוּר הָאַרְבָּעִֽים׃", "30": "וַיֹּאמֶר אַל־נָא יִחַר לַֽאדֹנָי וַאֲדַבֵּרָה אוּלַי יִמָּצְאוּן שָׁם שְׁלֹשִׁים וַיֹּאמֶר לֹא אֶֽעֱשֶׂה אִם־אֶמְצָא שָׁם שְׁלֹשִֽׁים׃", "31": "וַיֹּאמֶר הִנֵּֽה־נָא הוֹאַלְתִּי לְדַבֵּר אֶל־אֲדֹנָי אוּלַי יִמָּצְאוּן שָׁם עֶשְׂרִים וַיֹּאמֶר לֹא אַשְׁחִית בַּעֲבוּר הָֽעֶשְׂרִֽים׃", "32": "וַיֹּאמֶר אַל־נָא יִחַר לַֽאדֹנָי וַאֲדַבְּרָה אַךְ־הַפַּעַם אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה וַיֹּאמֶר לֹא אַשְׁחִית בַּעֲבוּר הָעֲשָׂרָֽה׃", "33": "וַיֵּלֶךְ יְהוָה כַּאֲשֶׁר כִּלָּה לְדַבֵּר אֶל־אַבְרָהָם וְאַבְרָהָם שָׁב לִמְקֹמֽוֹ׃"}, "lang": "hbo"}, "19": {"verses": {"1": "The two angels arrived at Sodom in the evening, and Lot was sitting at the gate of the city. When he saw them, he rose to meet them and bowed low to the ground.\n", "2": "He said, \"Now, my lords, please turn aside to your servant’s house and spend the night, and wash your feet. In the morning you may continue on your journey.\" But they said, \"No, we will spend the night in the square.\"\n", "3": "Yet he urged them strongly, and they turned to him and went into his house. He prepared a meal for them, and they ate.\n", "4": "Before they lay down, the men of the city, the men of Sodom, surrounded the house, from the youngest to the oldest, every one of the people, from every end.\n", "5": "They called to Lot and said, \"Where are the men who came to you tonight? Bring them out to us, so that we may know them.\"\n", "6": "Lot went out to them at the entrance and shut the door behind him.\n", "7": "He said, \"My brothers, don’t act so wickedly.\n", "8": "Here now, I have two daughters who have not known a man. Let me bring them out to you, and you may do to them as you please. But don’t do anything to these men, for it is on account of their shade that I have received you.\"\n", "9": "But they said, \"Stand back!\" And one said, \"This fellow came to live among us as a foreigner, and now he wants to judge us? We will treat you worse than them!\" And they pressed hard on the man, Lot, and came to break down the door.\n", "10": "Then the men reached out and brought Lot into the house with them, and they shut the door behind him.\n", "11": "And they struck the men at the entrance of the house, both small and great, so that they were unable to find the door.\n", "12": "Then the men said to Lot, \"Do you have anyone else here—sons-in-law, sons, daughters, or anything you own in the city? Get out of this place.\n", "13": "For we are about to destroy this place, because the outcry of its people has become great to the Lord. And the Lord has sent us to destroy it.\"\n", "14": "So Lot went out and spoke to his sons-in-law, the ones who were taking his daughters in marriage, and said, \"Get up, leave this place, for the Lord is about to destroy the city.\" But to his sons-in-law it seemed like a joke.\n", "15": "As morning began to break, the angels urged Lot, saying, \"Get up, take your wife and your two daughters who are here, or you will be swept away in the punishment of the city.\"\n", "16": "But he hesitated, and the men had to take hold of his hand, his wife's hand, and the hands of his two daughters by the compassion of the Lord for him, and they led him outside and left him beyond the city.\n", "17": "After they had brought him out, one said, \"Escape for your life! Do not look back or stand anywhere in the valley. Escape to the mountains, or you will be swept away.\"\n", "18": "Lot said to them, \"No, my lords,\n", "19": "for surely I have found favor in your eyes, and your kindness has been great toward me in sparing my life. But I cannot escape to the mountains, for the disaster will overtake me, and I will die.\n", "20": "This city is near, and it is small. Please let me escape there, for it is small, and my life will be spared.\"\n", "21": "He said to him, \"I grant you this favor also, in not overthrowing the city of which you have spoken.\n", "22": "Hurry, escape there, for I cannot do anything until you arrive there.\" And so the city was named Zoar.\n", "23": "The sun had risen over the earth when Lot came to Zoar.\n", "24": "Then the Lord rained down on Sodom and Gomorrah brimstone and fire from the Lord out of the heavens.\n", "25": "He overthrew the cities and all the valley and all the people of the cities and the plants of the land.\n", "26": "His wife, looking back from behind him, became a pillar of salt.\n", "27": "Abraham rose early in the morning to the place where he had stood before the Lord.\n", "28": "He looked toward Sodom and Gomorrah and the entire valley of the land, and he saw the smoke of the land rising like the smoke of a furnace.\n", "29": "When God destroyed the cities of the valley, he remembered Abraham and sent Lot out of the disaster when he overthrew the cities where Lot had lived.\n", "30": "Lot went up from Zoar and lived in the mountains, and his two daughters were with him, for he was afraid to live in Zoar. He lived in a cave with his two daughters.\n", "31": "The older daughter said to the younger, \"Our father is old, and there is no man on earth to come in to us like all the world.\n", "32": "Let us go and give our father wine to drink, and we will lie with him, so we may preserve life from our father.\"\n", "33": "That night they gave their father wine to drink, and the older daughter went in and lay with him. He did not know when she lay down or when she rose.\n", "34": "The next day, the older daughter said to the younger, \"I lay with my father last night. Let us give him wine again tonight, and you go in and lie with him, so we may preserve life from our father.\"\n", "35": "That night they gave their father wine to drink, and the younger daughter went in and lay with him. He did not know when she lay down or when she rose.\n", "36": "So the two daughters of Lot became pregnant by their father.\n", "37": "The older daughter bore a son and named him Moab. He became the ancestor of the Moabites to this day.\n", "38": "The younger daughter also bore a son and named him Ben-Ammi. He became the ancestor of the Ammonites to this day.\n"}, "notes": "Notes\n- v. 34: The phrase \"he did not know\" is idiomatic, indicating lack of awareness or recognition.\n- v. 37: \"Moab\" is a proper name; \"the ancestor of the Moabites\" is a clarifying addition.\n- v. 38: \"Ben-Ammi\" is a proper name; \"the ancestor of the Ammonites\" is a clarifying addition.", "src": {"1": "וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה בָּעֶרֶב וְלוֹט יֹשֵׁב בְּשַֽׁעַר־סְדֹם וַיַּרְא־לוֹט וַיָּקָם לִקְרָאתָם וַיִּשְׁתַּחוּ אַפַּיִם אָֽרְצָה׃", "2": "וַיֹּאמֶר הִנֶּה נָּא־אֲדֹנַי סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם וְלִינוּ וְרַחֲצוּ רַגְלֵיכֶם וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם וַיֹּאמְרוּ לֹּא כִּי בָרְחוֹב נָלִֽין׃", "3": "וַיִּפְצַר־בָּם מְאֹד וַיָּסֻרוּ אֵלָיו וַיָּבֹאוּ אֶל־בֵּיתוֹ וַיַּעַשׂ לָהֶם מִשְׁתֶּה וּמַצּוֹת אָפָה וַיֹּאכֵֽלוּ׃", "4": "טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם נָסַבּוּ עַל־הַבַּיִת מִנַּעַר וְעַד־זָקֵן כָּל־הָעָם מִקָּצֶֽה׃", "5": "וַיִּקְרְאוּ אֶל־לוֹט וַיֹּאמְרוּ לוֹ אַיֵּה הָאֲנָשִׁים אֲשֶׁר־בָּאוּ אֵלֶיךָ הַלָּיְלָה הוֹצִיאֵם אֵלֵינוּ וְנֵדְעָה אֹתָֽם׃", "6": "וַיֵּצֵא אֲלֵהֶם לוֹט הַפֶּתְחָה וְהַדֶּלֶת סָגַר אַחֲרָֽיו׃", "7": "וַיֹּאמַר אַל־נָא אַחַי תָּרֵֽעוּ׃", "8": "הִנֵּה־נָא לִי שְׁתֵּי בָנוֹת אֲשֶׁר לֹֽא־יָדְעוּ אִישׁ אוֹצִֽיאָה־נָּא אֶתְהֶן אֲלֵיכֶם וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם רַק לָֽאֲנָשִׁים הָאֵל אַל־תַּעֲשׂוּ דָבָר כִּֽי־עַל־כֵּן בָּאוּ בְּצֵל קֹרָתִֽי׃", "9": "וַיֹּאמְרוּ ׀ גֶּשׁ־הָלְאָה וַיֹּֽאמְרוּ הָאֶחָד בָּֽא־לָגוּר וַיִּשְׁפֹּט שָׁפוֹט עַתָּה נָרַע לְךָ מֵהֶם וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד וַֽיִּגְּשׁוּ לִשְׁבֹּר הַדָּֽלֶת׃", "10": "וַיִּשְׁלְחוּ הָֽאֲנָשִׁים אֶת־יָדָם וַיָּבִיאוּ אֶת־לוֹט אֲלֵיהֶם הַבָּיְתָה וְאֶת־הַדֶּלֶת סָגָֽרוּ׃", "11": "וְֽאֶת־הָאֲנָשִׁים אֲשֶׁר־פֶּתַח הַבַּיִת הִכּוּ בַּסַּנְוֵרִים מִקָּטֹן וְעַד־גָּדוֹל וַיִּלְאוּ לִמְצֹא הַפָּֽתַח׃", "12": "וַיֹּאמְרוּ הָאֲנָשִׁים אֶל־לוֹט עֹד מִֽי־לְךָ פֹה חָתָן וּבָנֶיךָ וּבְנֹתֶיךָ וְכֹל אֲשֶׁר־לְךָ בָּעִיר הוֹצֵא מִן־הַמָּקֽוֹם׃", "13": "כִּֽי־מַשְׁחִתִים אֲנַחְנוּ אֶת־הַמָּקוֹם הַזֶּה כִּֽי־גָֽדְלָה צַעֲקָתָם אֶת־פְּנֵי יְהוָה וַיְשַׁלְּחֵנוּ יְהוָה לְשַׁחֲתָֽהּ׃", "14": "וַיֵּצֵא לוֹט וַיְדַבֵּר ׀ אֶל־חֲתָנָיו ׀ לֹקְחֵי בְנֹתָיו וַיֹּאמֶר קוּמוּ צְּאוּ מִן־הַמָּקוֹם הַזֶּה כִּֽי־מַשְׁחִית יְהוָה אֶת־הָעִיר וַיְהִי כִמְצַחֵק בְּעֵינֵי חֲתָנָֽיו׃", "15": "וּכְמוֹ הַשַּׁחַר עָלָה וַיָּאִיצוּ הַמַּלְאָכִים בְּלוֹט לֵאמֹר קוּם קַח אֶֽת־אִשְׁתְּךָ וְאֶת־שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת פֶּן־תִּסָּפֶה בַּעֲוֺן הָעִֽיר׃", "16": "וַֽיִּתְמַהְמָהּ ׀ וַיַּחֲזִקוּ הָאֲנָשִׁים בְּיָדוֹ וּבְיַד־אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו בְּחֶמְלַת יְהוָה עָלָיו וַיֹּצִאֻהוּ וַיַּנִּחֻהוּ מִחוּץ לָעִֽיר׃", "17": "וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל־נַפְשֶׁךָ אַל־תַּבִּיט אַחֲרֶיךָ וְאַֽל־תַּעֲמֹד בְּכָל־הַכִּכָּר הָהָרָה הִמָּלֵט פֶּן־תִּסָּפֶֽה׃", "18": "וַיֹּאמֶר לוֹט אֲלֵהֶם אַל־נָא אֲדֹנָֽי׃", "19": "הִנֵּה־נָא מָצָא עַבְדְּךָ חֵן בְּעֵינֶיךָ וַתַּגְדֵּל חַסְדְּךָ אֲשֶׁר עָשִׂיתָ עִמָּדִי לְהַחֲיוֹת אֶת־נַפְשִׁי וְאָנֹכִי לֹא אוּכַל לְהִמָּלֵט הָהָרָה פֶּן־תִּדְבָּקַנִי הָרָעָה וָמַֽתִּי׃", "20": "הִנֵּה־נָא הָעִיר הַזֹּאת קְרֹבָה לָנוּס שָׁמָּה וְהִיא מִצְעָר אִמָּלְטָה נָּא שָׁמָּה הֲלֹא מִצְעָר הִוא וּתְחִי נַפְשִֽׁי׃", "21": "וַיֹּאמֶר אֵלָיו הִנֵּה נָשָׂאתִי פָנֶיךָ גַּם לַדָּבָר הַזֶּה לְבִלְתִּי הָפְכִּי אֶת־הָעִיר אֲשֶׁר דִּבַּֽרְתָּ׃", "22": "מַהֵר הִמָּלֵט שָׁמָּה כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר עַד־בֹּאֲךָ שָׁמָּה עַל־כֵּן קָרָא שֵׁם־הָעִיר צֽוֹעַר׃", "23": "הַשֶּׁמֶשׁ יָצָא עַל־הָאָרֶץ וְלוֹט בָּא צֹֽעֲרָה׃", "24": "וַֽיהוָה הִמְטִיר עַל־סְדֹם וְעַל־עֲמֹרָה גָּפְרִית וָאֵשׁ מֵאֵת יְהוָה מִן־הַשָּׁמָֽיִם׃", "25": "וַֽיַּהֲפֹךְ אֶת־הֶעָרִים הָאֵל וְאֵת כָּל־הַכִּכָּר וְאֵת כָּל־יֹשְׁבֵי הֶעָרִים וְצֶמַח הָאֲדָמָֽה׃", "26": "וַתַּבֵּט אִשְׁתּוֹ מֵאַחֲרָיו וַתְּהִי נְצִיב מֶֽלַח׃", "27": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר אֶל־הַמָּקוֹם אֲשֶׁר־עָמַד שָׁם אֶת־פְּנֵי יְהוָֽה׃", "28": "וַיַּשְׁקֵף עַל־פְּנֵי סְדֹם וַעֲמֹרָה וְעַֽל־כָּל־פְּנֵי אֶרֶץ הַכִּכָּר וַיַּרְא וְהִנֵּה עָלָה קִיטֹר הָאָרֶץ כְּקִיטֹר הַכִּבְשָֽׁן׃", "29": "וַיְהִי בְּשַׁחֵת אֱלֹהִים אֶת־עָרֵי הַכִּכָּר וַיִּזְכֹּר אֱלֹהִים אֶת־אַבְרָהָם וַיְשַׁלַּח אֶת־לוֹט מִתּוֹךְ הַהֲפֵכָה בַּהֲפֹךְ אֶת־הֶעָרִים אֲשֶׁר־יָשַׁב בָּהֵן לֽוֹט׃", "30": "וַיַּעַל לוֹט מִצּוֹעַר וַיֵּשֶׁב בָּהָר וּשְׁתֵּי בְנֹתָיו עִמּוֹ כִּי יָרֵא לָשֶׁבֶת בְּצוֹעַר וַיֵּשֶׁב בַּמְּעָרָה הוּא וּשְׁתֵּי בְנֹתָֽיו׃", "31": "וַתֹּאמֶר הַבְּכִירָה אֶל־הַצְּעִירָה אָבִינוּ זָקֵן וְאִישׁ אֵין בָּאָרֶץ לָבוֹא עָלֵינוּ כְּדֶרֶךְ כָּל־הָאָֽרֶץ׃", "32": "לְכָה נַשְׁקֶה אֶת־אָבִינוּ יַיִן וְנִשְׁכְּבָה עִמּוֹ וּנְחַיֶּה מֵאָבִינוּ זָֽרַע׃", "33": "וַתַּשְׁקֶיןָ אֶת־אֲבִיהֶן יַיִן בַּלַּיְלָה הוּא וַתָּבֹא הַבְּכִירָה וַתִּשְׁכַּב אֶת־אָבִיהָ וְלֹֽא־יָדַע בְּשִׁכְבָהּ וּבְקׄוּמָֽהּ׃", "34": "וַֽיְהִי מִֽמָּחֳרָת וַתֹּאמֶר הַבְּכִירָה אֶל־הַצְּעִירָה הֵן־שָׁכַבְתִּי אֶמֶשׁ אֶת־אָבִי נַשְׁקֶנּוּ יַיִן גַּם־הַלַּיְלָה וּבֹאִי שִׁכְבִי עִמּוֹ וּנְחַיֶּה מֵאָבִינוּ זָֽרַע׃", "35": "וַתַּשְׁקֶיןָ גַּם בַּלַּיְלָה הַהוּא אֶת־אֲבִיהֶן יָיִן וַתָּקָם הַצְּעִירָה וַתִּשְׁכַּב עִמּוֹ וְלֹֽא־יָדַע בְּשִׁכְבָהּ וּבְקֻמָֽהּ׃", "36": "וַֽתַּהֲרֶיןָ שְׁתֵּי בְנֽוֹת־לוֹט מֵאֲבִיהֶֽן׃", "37": "וַתֵּלֶד הַבְּכִירָה בֵּן וַתִּקְרָא שְׁמוֹ מוֹאָב הוּא אֲבִֽי־מוֹאָב עַד־הַיּֽוֹם׃", "38": "וְהַצְּעִירָה גַם־הִוא יָלְדָה בֵּן וַתִּקְרָא שְׁמוֹ בֶּן־עַמִּי הוּא אֲבִי בְנֵֽי־עַמּוֹן עַד־הַיּֽוֹם׃"}, "lang": "hbo"}, "20": {"verses": {"1": "Abraham left from there and journeyed to the Negev region, and he settled between Kadesh and Shur, and he sojourned in Gerar.", "2": "Abraham said to Sarah, his wife, \"Say you are my sister,\" and Abimelech, the king of Gerar, sent for Sarah and took her.", "3": "That night, God came to Abimelech in a dream and said to him, \"You will surely die for the woman you have taken, for she is a married woman.\"", "4": "Abimelech did not approach her and said, \"Lord, will you even kill a righteous person?\"", "5": "\"Didn’t he himself say to me, 'She is my sister'?\" he said. \"And she herself said, 'He truly is my brother.' I did this in purity of heart and clean hands.\"", "6": "The God of heaven replied in the dream, \"I know that you did this with a pure heart, and that is why I have not let you touch her, and so I have protected you from sinning against me.\"", "7": "Now return the man’s wife, for he is a prophet. He will pray for you and you will live. But if you do not return her, you must know that you and all that is yours will die.\"", "8": "Abimelech got up early in the morning and called all his servants and repeated all these things to them. The men were very afraid.", "9": "Abimelech summoned Abraham and said, \"What have you done to us? What wrong have I done to you that you have brought such a great sin upon me and my kingdom? You have done things that should not be done with me.\"", "10": "Abimelech asked Abraham, \"Why did you do this thing?\"", "11": "Abraham answered, \"I thought, 'Surely there is no fear of God in this place, and they might kill me because of my wife.'\"", "12": "\"Also,\" he added, \"she is the daughter of my father—though not of my mother—and she became my wife.\"", "13": "\"And when God led me away from my father’s house, I said to her, 'This is the kindness you must do for me in every place we go: say that he is my brother.'\"", "14": "Abimelech gave Abraham sheep, cattle, male and female slaves, and he returned Sarah, Abraham’s wife, to him.", "15": "Abimelech said to Abraham, \"Here is my land before you. Live wherever you please.\"", "16": "He said to Sarah, \"I am giving you a thousand pieces of silver to your brother. It is for you to make a place for yourself wherever you go with him.\"", "17": "Abraham prayed to God, and God healed Abimelech, his wife, and his female slaves, and they had children.", "18": "For the Lord had closed up every womb in the house of Abimelech because of Sarah, the wife of Abraham."}, "notes": "Notes\n- v. 11: The phrase \"רַק אֵין־יִרְאַת אֱלֹהִים\" is translated as \"I thought there was no fear of God,\" reflecting the uncertainty of the human condition in that place.", "src": {"1": "וַיִּסַּע מִשָּׁם אַבְרָהָם אַרְצָה הַנֶּגֶב וַיֵּשֶׁב בֵּין־קָדֵשׁ וּבֵין שׁוּר וַיָּגָר בִּגְרָֽר׃", "2": "וַיֹּאמֶר אַבְרָהָם אֶל־שָׂרָה אִשְׁתּוֹ אֲחֹתִי הִוא וַיִּשְׁלַח אֲבִימֶלֶךְ מֶלֶךְ גְּרָר וַיִּקַּח אֶת־שָׂרָֽה׃", "3": "וַיָּבֹא אֱלֹהִים אֶל־אֲבִימֶלֶךְ בַּחֲלוֹם הַלָּיְלָה וַיֹּאמֶר לוֹ הִנְּךָ מֵת עַל־הָאִשָּׁה אֲשֶׁר־לָקַחְתָּ וְהִוא בְּעֻלַת בָּֽעַל׃", "4": "וַאֲבִימֶלֶךְ לֹא קָרַב אֵלֶיהָ וַיֹּאמַר אֲדֹנָי הֲגוֹי גַּם־צַדִּיק תַּהֲרֹֽג׃", "5": "הֲלֹא הוּא אָֽמַר־לִי אֲחֹתִי הִוא וְהִֽיא־גַם־הִוא אָֽמְרָה אָחִי הוּא בְּתָם־לְבָבִי וּבְנִקְיֹן כַּפַּי עָשִׂיתִי זֹֽאת׃", "6": "וַיֹּאמֶר אֵלָיו הָֽאֱלֹהִים בַּחֲלֹם גַּם אָנֹכִי יָדַעְתִּי כִּי בְתָם־לְבָבְךָ עָשִׂיתָ זֹּאת וָאֶחְשֹׂךְ גַּם־אָנֹכִי אֽוֹתְךָ מֵחֲטוֹ־לִי עַל־כֵּן לֹא־נְתַתִּיךָ לִנְגֹּעַ אֵלֶֽיהָ׃", "7": "וְעַתָּה הָשֵׁב אֵֽשֶׁת־הָאִישׁ כִּֽי־נָבִיא הוּא וְיִתְפַּלֵּל בַּֽעַדְךָ וֶֽחְיֵה וְאִם־אֵֽינְךָ מֵשִׁיב דַּע כִּי־מוֹת תָּמוּת אַתָּה וְכָל־אֲשֶׁר־לָֽךְ׃", "8": "וַיַּשְׁכֵּם אֲבִימֶלֶךְ בַּבֹּקֶר וַיִּקְרָא לְכָל־עֲבָדָיו וַיְדַבֵּר אֶת־כָּל־הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם וַיִּֽירְאוּ הָאֲנָשִׁים מְאֹֽד׃", "9": "וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם וַיֹּאמֶר לוֹ מֶֽה־עָשִׂיתָ לָּנוּ וּמֶֽה־חָטָאתִי לָךְ כִּֽי־הֵבֵאתָ עָלַי וְעַל־מַמְלַכְתִּי חֲטָאָה גְדֹלָה מַעֲשִׂים אֲשֶׁר לֹא־יֵֽעָשׂוּ עָשִׂיתָ עִמָּדִֽי׃", "10": "וַיֹּאמֶר אֲבִימֶלֶךְ אֶל־אַבְרָהָם מָה רָאִיתָ כִּי עָשִׂיתָ אֶת־הַדָּבָר הַזֶּֽה׃", "11": "וַיֹּאמֶר אַבְרָהָם כִּי אָמַרְתִּי רַק אֵין־יִרְאַת אֱלֹהִים בַּמָּקוֹם הַזֶּה וַהֲרָגוּנִי עַל־דְּבַר אִשְׁתִּֽי׃", "12": "וְגַם־אָמְנָה אֲחֹתִי בַת־אָבִי הִוא אַךְ לֹא בַת־אִמִּי וַתְּהִי־לִי לְאִשָּֽׁה׃", "13": "וַיְהִי כַּאֲשֶׁר הִתְעוּ אֹתִי אֱלֹהִים מִבֵּית אָבִי וָאֹמַר לָהּ זֶה חַסְדֵּךְ אֲשֶׁר תַּעֲשִׂי עִמָּדִי אֶל כָּל־הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה אִמְרִי־לִי אָחִי הֽוּא׃", "14": "וַיִּקַּח אֲבִימֶלֶךְ צֹאן וּבָקָר וַעֲבָדִים וּשְׁפָחֹת וַיִּתֵּן לְאַבְרָהָם וַיָּשֶׁב לוֹ אֵת שָׂרָה אִשְׁתּֽוֹ׃", "15": "וַיֹּאמֶר אֲבִימֶלֶךְ הִנֵּה אַרְצִי לְפָנֶיךָ בַּטּוֹב בְּעֵינֶיךָ שֵֽׁב׃", "16": "וּלְשָׂרָה אָמַר הִנֵּה נָתַתִּי אֶלֶף כֶּסֶף לְאָחִיךְ הִנֵּה הוּא־לָךְ כְּסוּת עֵינַיִם לְכֹל אֲשֶׁר אִתָּךְ וְאֵת כֹּל וְנֹכָֽחַת׃", "17": "וַיִּתְפַּלֵּל אַבְרָהָם אֶל־הָאֱלֹהִים וַיִּרְפָּא אֱלֹהִים אֶת־אֲבִימֶלֶךְ וְאֶת־אִשְׁתּוֹ וְאַמְהֹתָיו וַיֵּלֵֽדוּ׃", "18": "כִּֽי־עָצֹר עָצַר יְהוָה בְּעַד כָּל־רֶחֶם לְבֵית אֲבִימֶלֶךְ עַל־דְּבַר שָׂרָה אֵשֶׁת אַבְרָהָֽם׃"}, "lang": "hbo"}, "21": {"verses": {"1": "The LORD visited Sarah as He had said, and He did to Sarah as He had promised.\n", "2": "She became pregnant and gave birth to Abraham a son in his old age, at the time God had appointed for him.\n", "3": "Abraham named the son born to him—whom Sarah had borne—Isaac.\n", "4": "Abraham circumcised his son Isaac when he was eight days old, as God had commanded him.\n", "5": "Abraham was a hundred years old when his son Isaac was born to him.\n", "6": "Sarah said, “God has given me laughter, and everyone who hears of this will laugh with me—Isaac is my laughter!”\n", "7": "And she added, “Who would have told Abraham that Sarah would nurse children? I have indeed borne a son in my old age.”\n", "8": "The boy grew and was weaned, and Abraham held a great feast on the day Isaac was weaned.\n", "9": "But Sarah saw the son of Hagar the Egyptian, whom she had borne to Abraham, laughing.\n", "10": "So she said to Abraham, “Drive out this slave woman and her son, for the son of this slave woman will not inherit with my son Isaac.”\n", "11": "The matter distressed Abraham greatly because his son was his heir.\n", "12": "But God said to Abraham, “Do not let it distress you on account of the boy and your slave woman. Whatever Sarah tells you, listen to her, for through Isaac your descendants will be named.”\n", "13": "And of the son of the slave woman, I will make a nation too, for he is also your offspring.”\n", "14": "At dawn the next day, Abraham took some bread and a skin of water and gave them to Hagar, putting the child on her shoulder. Then he sent her away, and she wandered off into the wilderness of Beersheba.\n", "15": "When the water in the skin was gone, she put the child under one of the desert shrubs.\n", "16": "She went off and sat down opposite him a bowshot away, for she said, “I do not want to watch the child die.” So she sat opposite him and began to weep.\n", "17": "Then God heard the boy crying, and an angel of God called to Hagar from heaven and said to her, “What troubles you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”\n", "18": "“Rise up, lift up the boy, and hold him by the hand, for I will make him into a great nation.”\n", "19": "God opened her eyes, and she saw a well of water. She went and filled the skin with water and gave it to the boy to drink.\n", "20": "Then God was with the boy, and he grew up and lived in the wilderness, becoming a skillful bowman.\n", "21": "He lived in the wilderness of Paran, and his mother got him a wife from the land of Egypt.\n", "22": "At that time Abimelech and Phicol, his general, spoke to Abraham, saying, “God is with you in everything you do.\n", "23": "Now therefore, swear to me here by God that you will deal with me and my descendants and my land with truth, just as the kindness I have shown you.”\n", "24": "Abraham said, “I will swear.”\n", "25": "But Abraham reproved Abimelech regarding a well of water that Abimelech’s servants had taken.\n", "26": "Abimelech said, “I did not know who did this, and you did not tell me, nor did I hear about it until today.”\n", "27": "So Abraham gave him sheep and oxen, and the two of them made a covenant.\n", "28": "Abraham set apart seven ewe lambs by themselves.\n", "29": "Abimelech asked Abraham, “What is the meaning of these seven ewes you have set apart by themselves?”\n", "30": "Abraham replied, “I give you these seven ewes in return for the well you dug, so they will be a witness that I dug this well.”\n", "31": "That is why that place was called Beersheba, for there both of them swore an oath.\n", "32": "So Abraham and Abimelech made a covenant at Beersheba, and Abimelech and his general returned to the land of the Philistines.\n", "33": "Abraham planted a tamarisk tree at Beersheba and called there on the name of the LORD, the Everlasting God.\n", "34": "Abraham sojourned in the land of the Philistines for many days.\n"}, "notes": "Notes\n- v. 12: \"through Isaac your descendants will be named\" renders the Hebrew יִקָּרֵא לְךָ זָֽרַע, which combines the verb \"will be called\" with \"offspring,\" reflecting Isaac as the named ancestor of the promised lineage.\n- v. 20: \"becoming a skillful bowman\" renders רֹבֶה קַשָּֽׁת, where \"roveh\" is a rare term; this translation captures both the idea of \"making many\" and the literal \"skillful with a bow.\"\n- v. 31: \"Beersheba\" is a compound of בְּאֵר (well) and שְׁבַע (seven), reflecting the covenant and the seven ewes.", "src": {"1": "וַֽיהוָה פָּקַד אֶת־שָׂרָה כַּאֲשֶׁר אָמָר וַיַּעַשׂ יְהוָה לְשָׂרָה כַּאֲשֶׁר דִּבֵּֽר׃", "2": "וַתַּהַר וַתֵּלֶד שָׂרָה לְאַבְרָהָם בֵּן לִזְקֻנָיו לַמּוֹעֵד אֲשֶׁר־דִּבֶּר אֹתוֹ אֱלֹהִֽים׃", "3": "וַיִּקְרָא אַבְרָהָם אֶֽת־שֶׁם־בְּנוֹ הַנּֽוֹלַד־לוֹ אֲשֶׁר־יָלְדָה־לּוֹ שָׂרָה יִצְחָֽק׃", "4": "וַיָּמָל אַבְרָהָם אֶת־יִצְחָק בְּנוֹ בֶּן־שְׁמֹנַת יָמִים כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִֽים׃", "5": "וְאַבְרָהָם בֶּן־מְאַת שָׁנָה בְּהִוָּלֶד לוֹ אֵת יִצְחָק בְּנֽוֹ׃", "6": "וַתֹּאמֶר שָׂרָה צְחֹק עָשָׂה לִי אֱלֹהִים כָּל־הַשֹּׁמֵעַ יִֽצְחַק־לִֽי׃", "7": "וַתֹּאמֶר מִי מִלֵּל לְאַבְרָהָם הֵינִיקָה בָנִים שָׂרָה כִּֽי־יָלַדְתִּי בֵן לִזְקֻנָֽיו׃", "8": "וַיִּגְדַּל הַיֶּלֶד וַיִּגָּמַל וַיַּעַשׂ אַבְרָהָם מִשְׁתֶּה גָדוֹל בְּיוֹם הִגָּמֵל אֶת־יִצְחָֽק׃", "9": "וַתֵּרֶא שָׂרָה אֶֽת־בֶּן־הָגָר הַמִּצְרִית אֲשֶׁר־יָלְדָה לְאַבְרָהָם מְצַחֵֽק׃", "10": "וַתֹּאמֶר לְאַבְרָהָם גָּרֵשׁ הָאָמָה הַזֹּאת וְאֶת־בְּנָהּ כִּי לֹא יִירַשׁ בֶּן־הָאָמָה הַזֹּאת עִם־בְּנִי עִם־יִצְחָֽק׃", "11": "וַיֵּרַע הַדָּבָר מְאֹד בְּעֵינֵי אַבְרָהָם עַל אוֹדֹת בְּנֽוֹ׃", "12": "וַיֹּאמֶר אֱלֹהִים אֶל־אַבְרָהָם אַל־יֵרַע בְּעֵינֶיךָ עַל־הַנַּעַר וְעַל־אֲמָתֶךָ כֹּל אֲשֶׁר תֹּאמַר אֵלֶיךָ שָׂרָה שְׁמַע בְּקֹלָהּ כִּי בְיִצְחָק יִקָּרֵא לְךָ זָֽרַע׃", "13": "וְגַם אֶת־בֶּן־הָאָמָה לְגוֹי אֲשִׂימֶנּוּ כִּי זַרְעֲךָ הֽוּא׃", "14": "וַיַּשְׁכֵּם אַבְרָהָם ׀ בַּבֹּקֶר וַיִּֽקַּֽח־לֶחֶם וְחֵמַת מַיִם וַיִּתֵּן אֶל־הָגָר שָׂם עַל־שִׁכְמָהּ וְאֶת־הַיֶּלֶד וַֽיְשַׁלְּחֶהָ וַתֵּלֶךְ וַתֵּתַע בְּמִדְבַּר בְּאֵר שָֽׁבַע׃", "15": "וַיִּכְלוּ הַמַּיִם מִן־הַחֵמֶת וַתַּשְׁלֵךְ אֶת־הַיֶּלֶד תַּחַת אַחַד הַשִּׂיחִֽם׃", "16": "וַתֵּלֶךְ וַתֵּשֶׁב לָהּ מִנֶּגֶד הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת כִּי אָֽמְרָה אַל־אֶרְאֶה בְּמוֹת הַיָּלֶד וַתֵּשֶׁב מִנֶּגֶד וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּֽבְךְּ׃", "17": "וַיִּשְׁמַע אֱלֹהִים אֶת־קוֹל הַנַּעַר וַיִּקְרָא מַלְאַךְ אֱלֹהִים ׀ אֶל־הָגָר מִן־הַשָּׁמַיִם וַיֹּאמֶר לָהּ מַה־לָּךְ הָגָר אַל־תִּירְאִי כִּֽי־שָׁמַע אֱלֹהִים אֶל־קוֹל הַנַּעַר בַּאֲשֶׁר הוּא־שָֽׁם׃", "18": "קוּמִי שְׂאִי אֶת־הַנַּעַר וְהַחֲזִיקִי אֶת־יָדֵךְ בּוֹ כִּֽי־לְגוֹי גָּדוֹל אֲשִׂימֶֽנּוּ׃", "19": "וַיִּפְקַח אֱלֹהִים אֶת־עֵינֶיהָ וַתֵּרֶא בְּאֵר מָיִם וַתֵּלֶךְ וַתְּמַלֵּא אֶת־הַחֵמֶת מַיִם וַתַּשְׁקְ אֶת־הַנָּֽעַר׃", "20": "וַיְהִי אֱלֹהִים אֶת־הַנַּעַר וַיִּגְדָּל וַיֵּשֶׁב בַּמִּדְבָּר וַיְהִי רֹבֶה קַשָּֽׁת׃", "21": "וַיֵּשֶׁב בְּמִדְבַּר פָּארָן וַתִּֽקַּֽח־לוֹ אִמּוֹ אִשָּׁה מֵאֶרֶץ מִצְרָֽיִם׃", "22": "וַֽיְהִי בָּעֵת הַהִוא וַיֹּאמֶר אֲבִימֶלֶךְ וּפִיכֹל שַׂר־צְבָאוֹ אֶל־אַבְרָהָם לֵאמֹר אֱלֹהִים עִמְּךָ בְּכֹל אֲשֶׁר־אַתָּה עֹשֶֽׂה׃", "23": "וְעַתָּה הִשָּׁבְעָה לִּי בֵֽאלֹהִים הֵנָּה אִם־תִּשְׁקֹר לִי וּלְנִינִי וּלְנֶכְדִּי כַּחֶסֶד אֲשֶׁר־עָשִׂיתִי עִמְּךָ תַּעֲשֶׂה עִמָּדִי וְעִם־הָאָרֶץ אֲשֶׁר־גַּרְתָּה בָּֽהּ׃", "24": "וַיֹּאמֶר אַבְרָהָם אָנֹכִי אִשָּׁבֵֽעַ׃", "25": "וְהוֹכִחַ אַבְרָהָם אֶת־אֲבִימֶלֶךְ עַל־אֹדוֹת בְּאֵר הַמַּיִם אֲשֶׁר גָּזְלוּ עַבְדֵי אֲבִימֶֽלֶךְ׃", "26": "וַיֹּאמֶר אֲבִימֶלֶךְ לֹא יָדַעְתִּי מִי עָשָׂה אֶת־הַדָּבָר הַזֶּה וְגַם־אַתָּה לֹא־הִגַּדְתָּ לִּי וְגַם אָנֹכִי לֹא שָׁמַעְתִּי בִּלְתִּי הַיּֽוֹם׃", "27": "וַיִּקַּח אַבְרָהָם צֹאן וּבָקָר וַיִּתֵּן לַאֲבִימֶלֶךְ וַיִּכְרְתוּ שְׁנֵיהֶם בְּרִֽית׃", "28": "וַיַּצֵּב אַבְרָהָם אֶת־שֶׁבַע כִּבְשֹׂת הַצֹּאן לְבַדְּהֶֽן׃", "29": "וַיֹּאמֶר אֲבִימֶלֶךְ אֶל־אַבְרָהָם מָה הֵנָּה שֶׁבַע כְּבָשֹׂת הָאֵלֶּה אֲשֶׁר הִצַּבְתָּ לְבַדָּֽנָה׃", "30": "וַיֹּאמֶר כִּי אֶת־שֶׁבַע כְּבָשֹׂת תִּקַּח מִיָּדִי בַּעֲבוּר תִּֽהְיֶה־לִּי לְעֵדָה כִּי חָפַרְתִּי אֶת־הַבְּאֵר הַזֹּֽאת׃", "31": "עַל־כֵּן קָרָא לַמָּקוֹם הַהוּא בְּאֵר שָׁבַע כִּי שָׁם נִשְׁבְּעוּ שְׁנֵיהֶֽם׃", "32": "וַיִּכְרְתוּ בְרִית בִּבְאֵר שָׁבַע וַיָּקָם אֲבִימֶלֶךְ וּפִיכֹל שַׂר־צְבָאוֹ וַיָּשֻׁבוּ אֶל־אֶרֶץ פְּלִשְׁתִּֽים׃", "33": "וַיִּטַּע אֶשֶׁל בִּבְאֵר שָׁבַע וַיִּקְרָא־שָׁם בְּשֵׁם יְהוָה אֵל עוֹלָֽם׃", "34": "וַיָּגָר אַבְרָהָם בְּאֶרֶץ פְּלִשְׁתִּים יָמִים רַבִּֽים׃"}, "lang": "hbo"}, "22": {"verses": {"1": "After these things, God tested Abraham. He called to him, “Abraham!” and he replied, “Here I am!”\n", "2": "He said, “Take your son, your beloved Isaac, and go to the land of Moriah. Sacrifice him there as a burnt offering on one of the mountains I will name for you.”\n", "3": "Abraham rose early the next day, saddled his donkey, and took with him two of his young men and his son Isaac. He gathered the wood for the burnt offering and started out to go to the place God had told him about.\n", "4": "On the third day Abraham lifted his eyes and saw the place from afar.\n", "5": "He said to his young men, “Stay here with the donkey, while I and the boy go on ahead. We will worship there and return to you.”\n", "6": "Abraham took the wood for the offering and placed it on Isaac, his son. He carried the fire and the knife in his own hand, and the two of them walked together.\n", "7": "Isaac spoke to Abraham his father and said, “Father?” He replied, “Here I am, my son.” Isaac said, “The fire and the wood are here, but where is the lamb for the offering?”\n", "8": "Abraham said, “God will see to the lamb for the offering, my son.” And the two of them walked on together.\n", "9": "They arrived at the place God had told him about. There Abraham built an altar, arranged the wood, and bound his son Isaac and placed him on the altar, on top of the wood.\n", "10": "Abraham reached out and took the knife to slaughter his son.\n", "11": "An angel of the LORD called to him from heaven and said, “Abraham! Abraham!” He answered, “Here I am!”\n", "12": "He said, “Do not lay your hand on the boy or do anything to him, for now I know that you fear God and have not withheld your beloved son from me.”\n", "13": "Abraham lifted his eyes and saw a ram caught in the thicket, its horns entangled. He went and took the ram and offered it as a burnt offering in place of his son.\n", "14": "Abraham named the place *The LORD Will See*, as it is said to this day, “On the mountain of the LORD it shall be seen.”\n", "15": "The angel of the LORD called out to Abraham a second time from heaven.\n", "16": "He said, “By myself I swear, declares the LORD, that because you have done this thing and have not withheld your beloved son from me,\n", "17": "I will surely bless you and greatly multiply your descendants like the stars in the sky and like the sand on the seashore. Your descendants will possess the gates of their enemies.\n", "18": "And through your descendants all the nations of the earth will be blessed, because you have obeyed my voice.”\n", "19": "Abraham returned to his young men, and they rose and went together to Beer Sheba. Abraham lived at Beer Sheba.\n", "20": "After these events, it was reported to Abraham, “Look, Milcah too has borne children to your brother Nahor.”\n", "21": "His firstborn was Uz, his brother Buz, and Kemuel the father of Aram.\n", "22": "And Kesed, Hazo, Pildash, Jidlaph, and Bethuel.\n", "23": "And Bethuel became the father of Rebekah. These eight Milcah bore to Abraham’s brother Nahor.\n", "24": "His concubine, whose name was Reumah, also bore children: Tebah, Gaham, Tahash, and Maacah.\n"}, "notes": "Notes\n- v. 14: The name *The LORD Will See* (יהוה יראה) is a play on the Hebrew for “the LORD sees” and “the LORD will see.” The rendering reflects both meanings.\n- v. 15: The angel’s second call is marked to emphasize its solemnity and the weight of the oath that follows.\n- v. 16: “By myself I swear, declares the LORD” reflects the Hebrew *בִּי נִשְׁבַּעְתִּי נְאֻם־יְהוָה* and captures the divine solemnity of the oath.\n- v. 20–24: These verses list descendants of Nahor through Milcah and Reumah. The structure and renderings follow the Hebrew carefully, distinguishing between the two mothers and their offspring.", "src": {"1": "וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם וַיֹּאמֶר אֵלָיו אַבְרָהָם וַיֹּאמֶר הִנֵּֽנִי׃", "2": "וַיֹּאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִֽידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶרֶץ הַמֹּרִיָּה וְהַעֲלֵהוּ שָׁם לְעֹלָה עַל אַחַד הֶֽהָרִים אֲשֶׁר אֹמַר אֵלֶֽיךָ׃", "3": "וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַֽיַּחֲבֹשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּקָם וַיֵּלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָֽמַר־לוֹ הָאֱלֹהִֽים׃", "4": "בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹֽק׃", "5": "וַיֹּאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִֽם־הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד־כֹּה וְנִֽשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶֽם׃", "6": "וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַֽמַּאֲכֶלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּֽו׃", "7": "וַיֹּאמֶר יִצְחָק אֶל־אַבְרָהָם אָבִיו וַיֹּאמֶר אָבִי וַיֹּאמֶר הִנֶּנִּֽי בְנִי וַיֹּאמֶר הִנֵּה הָאֵשׁ וְהָעֵצִים וְאַיֵּה הַשֶּׂה לְעֹלָֽה׃", "8": "וַיֹּאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּֽו׃", "9": "וַיָּבֹאוּ אֶֽל־הַמָּקוֹם אֲשֶׁר אָֽמַר־לוֹ הָאֱלֹהִים וַיִּבֶן שָׁם אַבְרָהָם אֶת־הַמִּזְבֵּחַ וַֽיַּעֲרֹךְ אֶת־הָעֵצִים וַֽיַּעֲקֹד אֶת־יִצְחָק בְּנוֹ וַיָּשֶׂם אֹתוֹ עַל־הַמִּזְבֵּחַ מִמַּעַל לָעֵצִֽים׃", "10": "וַיִּשְׁלַח אַבְרָהָם אֶת־יָדוֹ וַיִּקַּח אֶת־הַֽמַּאֲכֶלֶת לִשְׁחֹט אֶת־בְּנֽוֹ׃", "11": "וַיִּקְרָא אֵלָיו מַלְאַךְ יְהוָה מִן־הַשָּׁמַיִם וַיֹּאמֶר אַבְרָהָם ׀ אַבְרָהָם וַיֹּאמֶר הִנֵּֽנִי׃", "12": "וַיֹּאמֶר אַל־תִּשְׁלַח יָֽדְךָ אֶל־הַנַּעַר וְאַל־תַּעַשׂ לוֹ מְאוּמָּה כִּי ׀ עַתָּה יָדַעְתִּי כִּֽי־יְרֵא אֱלֹהִים אַתָּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּֽנִּי׃", "13": "וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַיִל וַיַּעֲלֵהוּ לְעֹלָה תַּחַת בְּנֽוֹ׃", "14": "וַיִּקְרָא אַבְרָהָם שֵֽׁם־הַמָּקוֹם הַהוּא יְהוָה ׀ יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְהוָה יֵרָאֶֽה׃", "15": "וַיִּקְרָא מַלְאַךְ יְהוָה אֶל־אַבְרָהָם שֵׁנִית מִן־הַשָּׁמָֽיִם׃", "16": "וַיֹּאמֶר בִּי נִשְׁבַּעְתִּי נְאֻם־יְהוָה כִּי יַעַן אֲשֶׁר עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה וְלֹא חָשַׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידֶֽךָ׃", "17": "כִּֽי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶֽת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָֽיו׃", "18": "וְהִתְבָּרֲכוּ בְזַרְעֲךָ כֹּל גּוֹיֵי הָאָרֶץ עֵקֶב אֲשֶׁר שָׁמַעְתָּ בְּקֹלִֽי׃", "19": "וַיָּשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻמוּ וַיֵּלְכוּ יַחְדָּו אֶל־בְּאֵר שָׁבַע וַיֵּשֶׁב אַבְרָהָם בִּבְאֵר שָֽׁבַע׃", "20": "וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיֻּגַּד לְאַבְרָהָם לֵאמֹר הִנֵּה יָלְדָה מִלְכָּה גַם־הִוא בָּנִים לְנָחוֹר אָחִֽיךָ׃", "21": "אֶת־עוּץ בְּכֹרוֹ וְאֶת־בּוּז אָחִיו וְאֶת־קְמוּאֵל אֲבִי אֲרָֽם׃", "22": "וְאֶת־כֶּשֶׂד וְאֶת־חֲזוֹ וְאֶת־פִּלְדָּשׁ וְאֶת־יִדְלָף וְאֵת בְּתוּאֵֽל׃", "23": "וּבְתוּאֵל יָלַד אֶת־רִבְקָה שְׁמֹנָה אֵלֶּה יָלְדָה מִלְכָּה לְנָחוֹר אֲחִי אַבְרָהָֽם׃", "24": "וּפִֽילַגְשׁוֹ וּשְׁמָהּ רְאוּמָה וַתֵּלֶד גַּם־הִוא אֶת־טֶבַח וְאֶת־גַּחַם וְאֶת־תַּחַשׁ וְאֶֽת־מַעֲכָֽה׃"}, "lang": "hbo"}, "23": {"verses": {"1": "Sarah lived a hundred years and twenty years and seven years. These were the years of Sarah’s life.", "2": "Sarah died in Kiriath Arba, that is, Hebron, in the land of Canaan. Abraham came to mourn for Sarah and to weep over her.", "3": "Abraham stood up from the face of his dead and spoke to the Hittites, saying,", "4": "“I am a stranger and a resident among you. Give me a burial place among you, so that I may bury my dead before me.”", "5": "The Hittites answered Abraham, saying to him,", "6": "“Listen, my lord. You are a noble of God among us. Choose the best of our burial places and bury your dead. No one among us will withhold it from you. You may bury your dead.”", "7": "Abraham stood up and bowed to the people of the land, the Hittites.", "8": "He said to them, “If it pleases you to bury my dead before me, listen to me and go to Ephron the son of Zohar.”", "9": "Let him give me the cave of Machpelah, which is his, in the edge of his field. He shall give it to me for the full price, and I will take it among you as a burial place.”", "10": "Ephron was sitting among the Hittites. Ephron the Hittite answered Abraham in the presence of the Hittites and all the men at the gate of his city, saying,", "11": "“No, my lord. Listen to me. I give you the field and the cave in it. I give it to you in the presence of the sons of my people. Bury your dead.”", "12": "Abraham bowed to the people of the land.", "13": "He said to Ephron in the presence of the people of the land, “But if you please, hear me. I will give you the silver for the field. Take it from me, and I will bury my dead there.”", "14": "Ephron answered Abraham, saying,", "15": "“My lord, listen to me. Four hundred shekels of silver between you and me. What is that? Bury your dead.”", "16": "Abraham listened to Ephron, and Abraham weighed out to Ephron the silver that he had spoken in the presence of the sons of Heth—four hundred shekels of silver, current among the merchants.", "17": "The field of Ephron, which was in Machpelah, in front of Mamre, the field and the cave in it, and all the trees in the field, wherever its boundary was around,", "18": "became Abraham’s possession in the presence of the sons of Heth, all the men who came to the gate of his city.", "19": "After this, Abraham buried Sarah his wife in the cave of the field of Machpelah, which is before Mamre, that is, Hebron, in the land of Canaan.", "20": "The field and the cave in it were acquired by Abraham for a burial place from the Hittites."}, "notes": "Notes  \n- v. 1: The Hebrew uses \"years of Sarah’s life\" twice to emphasize the full span of her life.  \n- v. 4: The term \"resident\" (תּוֹשָׁב) may imply a sense of long-term settlement rather than temporary sojourn.  \n- v. 6: The phrase “noble of God” (נְשִׂיא אֱלֹהִים) is a poetic title for someone of high spiritual or moral authority.  \n- v. 9: \"Current among the merchants\" (עֹבֵר לַסֹּחֵר) refers to the standard weight or valuation in trade.", "src": {"1": "וַיִּהְיוּ חַיֵּי שָׂרָה מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים שְׁנֵי חַיֵּי שָׂרָֽה׃", "2": "וַתָּמָת שָׂרָה בְּקִרְיַת אַרְבַּע הִוא חֶבְרוֹן בְּאֶרֶץ כְּנָעַן וַיָּבֹא אַבְרָהָם לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָֽהּ׃", "3": "וַיָּקָם אַבְרָהָם מֵעַל פְּנֵי מֵתוֹ וַיְדַבֵּר אֶל־בְּנֵי־חֵת לֵאמֹֽר׃", "4": "גֵּר־וְתוֹשָׁב אָנֹכִי עִמָּכֶם תְּנוּ לִי אֲחֻזַּת־קֶבֶר עִמָּכֶם וְאֶקְבְּרָה מֵתִי מִלְּפָנָֽי׃", "5": "וַיַּעֲנוּ בְנֵי־חֵת אֶת־אַבְרָהָם לֵאמֹר לֽוֹ׃", "6": "שְׁמָעֵנוּ ׀ אֲדֹנִי נְשִׂיא אֱלֹהִים אַתָּה בְּתוֹכֵנוּ בְּמִבְחַר קְבָרֵינוּ קְבֹר אֶת־מֵתֶךָ אִישׁ מִמֶּנּוּ אֶת־קִבְרוֹ לֹֽא־יִכְלֶה מִמְּךָ מִקְּבֹר מֵתֶֽךָ׃", "7": "וַיָּקָם אַבְרָהָם וַיִּשְׁתַּחוּ לְעַם־הָאָרֶץ לִבְנֵי־חֵֽת׃", "8": "וַיְדַבֵּר אִתָּם לֵאמֹר אִם־יֵשׁ אֶֽת־נַפְשְׁכֶם לִקְבֹּר אֶת־מֵתִי מִלְּפָנַי שְׁמָעוּנִי וּפִגְעוּ־לִי בְּעֶפְרוֹן בֶּן־צֹֽחַר׃", "9": "וְיִתֶּן־לִי אֶת־מְעָרַת הַמַּכְפֵּלָה אֲשֶׁר־לוֹ אֲשֶׁר בִּקְצֵה שָׂדֵהוּ בְּכֶסֶף מָלֵא יִתְּנֶנָּה לִי בְּתוֹכְכֶם לַאֲחֻזַּת־קָֽבֶר׃", "10": "וְעֶפְרוֹן יֹשֵׁב בְּתוֹךְ בְּנֵי־חֵת וַיַּעַן עֶפְרוֹן הַחִתִּי אֶת־אַב
