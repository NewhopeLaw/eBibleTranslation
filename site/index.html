<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBible Translation</title>
<style>
:root { --bg:#faf8f4; --fg:#22201c; --muted:#7a736a; --accent:#7c5cbf;
        --card:#ffffff; --border:#e4ded4; --hl:#f3e8b8; --fs:18px; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#181614; --fg:#e8e4dd; --muted:#948d82; --accent:#a98ee6;
          --card:#221f1c; --border:#37322c; --hl:#4a4020; }
}
* { box-sizing:border-box; margin:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--fg);
  font:var(--fs)/1.72 Georgia, "Times New Roman", serif; }
header { position:sticky; top:0; background:var(--bg); z-index:5;
  border-bottom:1px solid var(--border); padding:.6rem .9rem;
  display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
header .brand { font-size:15px; font-style:italic; color:var(--muted);
  margin-right:auto; white-space:nowrap; }
input, select, button.fs { font:14px system-ui, sans-serif; padding:.45rem .6rem;
  border:1px solid var(--border); border-radius:8px;
  background:var(--card); color:var(--fg); }
input:focus { outline:2px solid var(--accent); border-color:transparent; }
#ref { width:11rem; } #q { width:13rem; }
button.fs { cursor:pointer; width:2.2rem; }
button.fs:hover { border-color:var(--accent); }
select#bookSel { max-width:11rem; display:none; }
main { max-width:42rem; margin:0 auto; padding:1.4rem 1.2rem 5rem; }
.layout { display:flex; }
nav#books { width:200px; flex:none; padding:1rem .6rem; font:14px system-ui,sans-serif;
  border-right:1px solid var(--border); height:calc(100vh - 58px);
  overflow-y:auto; position:sticky; top:58px; }
nav#books a { display:block; padding:.15rem .55rem; color:var(--fg);
  text-decoration:none; border-radius:6px; }
nav#books a:hover { background:var(--card); }
nav#books a.on { background:var(--accent); color:#fff; }
nav#books .t { margin:.7rem 0 .25rem; font-weight:600; color:var(--muted);
  font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
nav#books a.missing { color:var(--muted); opacity:.4; pointer-events:none; }
.chnav { font:14px system-ui,sans-serif; margin:.9rem 0 1.6rem;
  display:flex; flex-wrap:wrap; gap:.3rem; }
.chnav a { padding:.22rem .6rem; border:1px solid var(--border);
  border-radius:7px; text-decoration:none; color:var(--fg); }
.chnav a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
h2 { font-size:1.65em; font-weight:normal; margin:.3rem 0 .4rem; }
h2 .lang { font:13px system-ui,sans-serif; color:var(--muted); margin-left:.6rem; vertical-align:middle; }
sup.v { color:var(--accent); font:600 .58em system-ui,sans-serif;
  margin:0 .18em 0 .05em; user-select:none; vertical-align:.55em; }
p.vv { margin:0 0 1.05em; text-align:justify; hyphens:auto; }
.poetry { margin:0 0 1.05em 1.3em; text-indent:-1.3em; white-space:pre-wrap; }
.notes { margin-top:2.4rem; padding:1rem 1.2rem; background:var(--card);
  border:1px solid var(--border); border-radius:10px;
  font:14px/1.6 system-ui,sans-serif; color:var(--muted); }
.notes b { color:var(--fg); }
.pn { display:flex; justify-content:space-between; margin-top:2.6rem;
  font:15px system-ui,sans-serif; }
.pn a { color:var(--accent); text-decoration:none; padding:.5rem .9rem;
  border:1px solid var(--border); border-radius:9px; }
.pn a:hover { border-color:var(--accent); }
.pn .off { visibility:hidden; }
#results { font:15px/1.5 system-ui,sans-serif; }
#results .hit { background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:.7rem .9rem; margin:.6rem 0; cursor:pointer; }
#results .hit:hover { border-color:var(--accent); }
#results .ref { color:var(--accent); font-weight:600; font-size:13px; }
mark { background:var(--hl); color:inherit; border-radius:3px; padding:0 .1em; }
.flash { animation:flash 2.5s; }
@keyframes flash { 0%,55% { background:var(--hl); } 100% { background:transparent; } }
.empty { color:var(--muted); font:15px system-ui,sans-serif; margin-top:2rem; }
main.wide { max-width:66rem; }
.tabs { display:flex; gap:.3rem; font:14px system-ui,sans-serif; margin:-.8rem 0 1.3rem; }
.tabs a { padding:.25rem .75rem; border:1px solid var(--border); border-radius:999px;
  cursor:pointer; color:var(--muted); user-select:none; }
.tabs a:hover { border-color:var(--accent); }
.tabs a.on { background:var(--card); color:var(--fg); border-color:var(--accent); }
.orig { font-family:"SBL Hebrew","Ezra SIL","Taamey Frank CLM","Times New Roman",serif;
  line-height:1.95; }
.orig.greek { font-family:"Gentium Plus","SBL Greek","Palatino Linotype","Times New Roman",serif; }
.lt { font:600 10px system-ui,sans-serif; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; margin:0 .3em; vertical-align:.5em; user-select:none; }
.orig[dir=rtl] { text-align:right; }
.orig sup.v { vertical-align:.7em; }
p.ov { margin:0 0 .6em; }
.par { display:grid; grid-template-columns:1fr 1fr; gap:0 1.6rem; align-items:start; }
.par > div { padding:.45rem 0; border-bottom:1px solid var(--border); }
.par .e { white-space:pre-wrap; }
@media (max-width:760px){
  .par { grid-template-columns:1fr; }
  .par .o { border-bottom:0; padding-bottom:.1rem; }
}
@media (max-width:760px){
  nav#books { display:none }
  select#bookSel { display:block }
  header .brand { display:none }
  #q { width:9rem } #ref { width:8rem }
}
</style>
</head>
<body>
<header>
  <span class="brand">eBible — from the Hebrew, Aramaic &amp; Greek</span>
  <select id="bookSel"></select>
  <input id="ref" placeholder="Go to: Genesis 2:7">
  <input id="q" placeholder="Search the text…">
  <button class="fs" id="fsMinus" title="Smaller text">A−</button>
  <button class="fs" id="fsPlus" title="Larger text">A+</button>
</header>
<div class="layout">
<nav id="books"></nav>
<main id="main"></main>
</div>
<script>
const DATA = {"Genesis": {"1": {"verses": {"1": "When God set about creating the heavens and the earth,", "2": "the earth was wild and waste, and darkness covered the face of the deep. A wind from God was moving over the surface of the waters.", "3": "God said, Let there be light, and there was light.", "4": "God saw the light; it was good. God separated the light from the darkness.", "5": "God called the light Day, and the darkness Night. There was evening, and there was morning, the first day.", "6": "God said, Let there be a vault between the waters, to separate water from water.", "7": "God made the vault and separated the waters beneath the vault from the waters above the vault. It happened as God had said.", "8": "God called the vault Heaven. There was evening, and there was morning, the second day.", "9": "God said, Let the waters beneath the heavens gather to one place, and let dry ground appear. It happened as God had said.", "10": "God called the dry ground Earth, and the gathered waters He called Seas. God saw it was good.", "11": "God said, Let the Earth bring forth vegetation, plants yielding seed, trees bearing fruit with seed in it, according to their kinds, on the Earth. It happened as God had said.", "12": "The Earth brought forth vegetation, plants yielding seed according to their kinds, and trees bearing fruit with seed in it according to their kinds. God saw it was good.", "13": "There was evening, and there was morning, the third day.", "14": "God said, Let there be lights in the vault of Heaven to separate day from night, and to mark seasons, days, and years.", "15": "Let the lights be in the vault of Heaven to give light on Earth. It happened as God had said.", "16": "God made the two great lights, the greater light to rule the day, and the lesser light to rule the night, and the stars.", "17": "God placed them in the vault of Heaven to give light on Earth.", "18": "To rule over day and night and to separate light from darkness. God saw it was good.", "19": "There was evening, and there was morning, the fourth day.", "20": "God said, Let the waters swarm with creatures that have life, and let birds fly above the Earth across the vault of Heaven.", "21": "God made the great sea creatures and every living creature that moves, which the waters swarmed with, according to their kinds, and every winged bird according to its kind. God saw it was good.", "22": "God blessed them, saying, Be fruitful, multiply, fill the waters in the seas, and let the birds multiply on Earth.", "23": "There was evening, and there was morning, the fifth day.", "24": "God said, Let the Earth bring forth living creatures according to their kinds: cattle and creeping things and beasts of the Earth, each according to its kind. It happened as God had said.", "25": "God made the beasts of the Earth according to their kinds, the cattle according to their kinds, and every creeping thing of the ground according to its kind. God saw it was good.", "26": "God said, Let us make humankind in Our image, according to Our likeness, and let them have dominion over the fish of the sea, the birds of the sky, the cattle, and over all the Earth, and over every creeping thing that creeps on the Earth.", "27": "God created humankind in His image. In the image of God He created them; male and female He created them.", "28": "God blessed them and said to them, Be fruitful, multiply, fill the Earth, and subdue it. Have dominion over the fish of the sea, the birds of the sky, and every living thing that moves on the Earth.", "29": "God said, Look, I have given you every plant bearing seed, which is on the surface of all the Earth, and every tree with fruit bearing seed; it will be for your food.", "30": "And to every beast of the Earth, to every bird of the sky, and to every creature that moves on the Earth, in which is the breath of life, I have given every green plant for food. It happened as God had said.", "31": "God saw everything He had made, and indeed it was very good. There was evening, and there was morning, the sixth day.\n"}, "notes": "Notes\n- v. 1: \"When God set about creating\" follows the dependent-clause reading of Genesis 1:1.\n- v. 27: \"the human\" used for ha-adam until the narrative clearly names Adam.\n- v. 31: \"the sixth day\" aligns with the Hebrew ordinal system.", "src": {"1": "בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָֽרֶץ׃", "2": "וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל־פְּנֵי הַמָּֽיִם׃", "3": "וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַֽיְהִי־אֽוֹר׃", "4": "וַיַּרְא אֱלֹהִים אֶת־הָאוֹר כִּי־טוֹב וַיַּבְדֵּל אֱלֹהִים בֵּין הָאוֹר וּבֵין הַחֹֽשֶׁךְ׃", "5": "וַיִּקְרָא אֱלֹהִים ׀ לָאוֹר יוֹם וְלַחֹשֶׁךְ קָרָא לָיְלָה וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם אֶחָֽד׃", "6": "וַיֹּאמֶר אֱלֹהִים יְהִי רָקִיעַ בְּתוֹךְ הַמָּיִם וִיהִי מַבְדִּיל בֵּין מַיִם לָמָֽיִם׃", "7": "וַיַּעַשׂ אֱלֹהִים אֶת־הָרָקִיעַ וַיַּבְדֵּל בֵּין הַמַּיִם אֲשֶׁר מִתַּחַת לָרָקִיעַ וּבֵין הַמַּיִם אֲשֶׁר מֵעַל לָרָקִיעַ וַֽיְהִי־כֵֽן׃", "8": "וַיִּקְרָא אֱלֹהִים לָֽרָקִיעַ שָׁמָיִם וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם שֵׁנִֽי׃", "9": "וַיֹּאמֶר אֱלֹהִים יִקָּווּ הַמַּיִם מִתַּחַת הַשָּׁמַיִם אֶל־מָקוֹם אֶחָד וְתֵרָאֶה הַיַּבָּשָׁה וַֽיְהִי־כֵֽן׃", "10": "וַיִּקְרָא אֱלֹהִים ׀ לַיַּבָּשָׁה אֶרֶץ וּלְמִקְוֵה הַמַּיִם קָרָא יַמִּים וַיַּרְא אֱלֹהִים כִּי־טֽוֹב׃", "11": "וַיֹּאמֶר אֱלֹהִים תַּֽדְשֵׁא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע עֵץ פְּרִי עֹשֶׂה פְּרִי לְמִינוֹ אֲשֶׁר זַרְעוֹ־בוֹ עַל־הָאָרֶץ וַֽיְהִי־כֵֽן׃", "12": "וַתּוֹצֵא הָאָרֶץ דֶּשֶׁא עֵשֶׂב מַזְרִיעַ זֶרַע לְמִינֵהוּ וְעֵץ עֹֽשֶׂה־פְּרִי אֲשֶׁר זַרְעוֹ־בוֹ לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טֽוֹב׃", "13": "וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם שְׁלִישִֽׁי׃", "14": "וַיֹּאמֶר אֱלֹהִים יְהִי מְאֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים וּלְיָמִים וְשָׁנִֽים׃", "15": "וְהָיוּ לִמְאוֹרֹת בִּרְקִיעַ הַשָּׁמַיִם לְהָאִיר עַל־הָאָרֶץ וַֽיְהִי־כֵֽן׃", "16": "וַיַּעַשׂ אֱלֹהִים אֶת־שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים אֶת־הַמָּאוֹר הַגָּדֹל לְמֶמְשֶׁלֶת הַיּוֹם וְאֶת־הַמָּאוֹר הַקָּטֹן לְמֶמְשֶׁלֶת הַלַּיְלָה וְאֵת הַכּוֹכָבִֽים׃", "17": "וַיִּתֵּן אֹתָם אֱלֹהִים בִּרְקִיעַ הַשָּׁמָיִם לְהָאִיר עַל־הָאָֽרֶץ׃", "18": "וְלִמְשֹׁל בַּיּוֹם וּבַלַּיְלָה וּֽלֲהַבְדִּיל בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ וַיַּרְא אֱלֹהִים כִּי־טֽוֹב׃", "19": "וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם רְבִיעִֽי׃", "20": "וַיֹּאמֶר אֱלֹהִים יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ נֶפֶשׁ חַיָּה וְעוֹף יְעוֹפֵף עַל־הָאָרֶץ עַל־פְּנֵי רְקִיעַ הַשָּׁמָֽיִם׃", "21": "וַיִּבְרָא אֱלֹהִים אֶת־הַתַּנִּינִם הַגְּדֹלִים וְאֵת כָּל־נֶפֶשׁ הַֽחַיָּה ׀ הָֽרֹמֶשֶׂת אֲשֶׁר שָׁרְצוּ הַמַּיִם לְמִֽינֵהֶם וְאֵת כָּל־עוֹף כָּנָף לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טֽוֹב׃", "22": "וַיְבָרֶךְ אֹתָם אֱלֹהִים לֵאמֹר פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הַמַּיִם בַּיַּמִּים וְהָעוֹף יִרֶב בָּאָֽרֶץ׃", "23": "וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם חֲמִישִֽׁי׃", "24": "וַיֹּאמֶר אֱלֹהִים תּוֹצֵא הָאָרֶץ נֶפֶשׁ חַיָּה לְמִינָהּ בְּהֵמָה וָרֶמֶשׂ וְחַֽיְתוֹ־אֶרֶץ לְמִינָהּ וַֽיְהִי־כֵֽן׃", "25": "וַיַּעַשׂ אֱלֹהִים אֶת־חַיַּת הָאָרֶץ לְמִינָהּ וְאֶת־הַבְּהֵמָה לְמִינָהּ וְאֵת כָּל־רֶמֶשׂ הָֽאֲדָמָה לְמִינֵהוּ וַיַּרְא אֱלֹהִים כִּי־טֽוֹב׃", "26": "וַיֹּאמֶר אֱלֹהִים נַֽעֲשֶׂה אָדָם בְּצַלְמֵנוּ כִּדְמוּתֵנוּ וְיִרְדּוּ בִדְגַת הַיָּם וּבְעוֹף הַשָּׁמַיִם וּבַבְּהֵמָה וּבְכָל־הָאָרֶץ וּבְכָל־הָרֶמֶשׂ הָֽרֹמֵשׂ עַל־הָאָֽרֶץ׃", "27": "וַיִּבְרָא אֱלֹהִים ׀ אֶת־הָֽאָדָם בְּצַלְמוֹ בְּצֶלֶם אֱלֹהִים בָּרָא אֹתוֹ זָכָר וּנְקֵבָה בָּרָא אֹתָֽם׃", "28": "וַיְבָרֶךְ אֹתָם אֱלֹהִים וַיֹּאמֶר לָהֶם אֱלֹהִים פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הָאָרֶץ וְכִבְשֻׁהָ וּרְדוּ בִּדְגַת הַיָּם וּבְעוֹף הַשָּׁמַיִם וּבְכָל־חַיָּה הָֽרֹמֶשֶׂת עַל־הָאָֽרֶץ׃", "29": "וַיֹּאמֶר אֱלֹהִים הִנֵּה נָתַתִּי לָכֶם אֶת־כָּל־עֵשֶׂב ׀ זֹרֵעַ זֶרַע אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ וְאֶת־כָּל־הָעֵץ אֲשֶׁר־בּוֹ פְרִי־עֵץ זֹרֵעַ זָרַע לָכֶם יִֽהְיֶה לְאָכְלָֽה׃", "30": "וּֽלְכָל־חַיַּת הָאָרֶץ וּלְכָל־עוֹף הַשָּׁמַיִם וּלְכֹל ׀ רוֹמֵשׂ עַל־הָאָרֶץ אֲשֶׁר־בּוֹ נֶפֶשׁ חַיָּה אֶת־כָּל־יֶרֶק עֵשֶׂב לְאָכְלָה וַֽיְהִי־כֵֽן׃", "31": "וַיַּרְא אֱלֹהִים אֶת־כָּל־אֲשֶׁר עָשָׂה וְהִנֵּה־טוֹב מְאֹד וַֽיְהִי־עֶרֶב וַֽיְהִי־בֹקֶר יוֹם הַשִּׁשִּֽׁי׃"}, "lang": "hbo"}, "2": {"verses": {"1": "The heavens and the earth and all their host were completed.", "2": "On the seventh day God completed His work that He had done, and He rested on the seventh day from all His work that He had done.", "3": "God blessed the seventh day and made it holy, because on it He rested from all His work that God had created to make.", "4": "These are the generations of the heavens and the earth when they were created, on the day that the LORD God made earth and heavens.", "5": "Now no shrub of the field was yet in the earth, and no plant of the field had yet sprouted, for the LORD God had not caused it to rain on the earth, and there was no human to till the soil.", "6": "But a mist rose from the earth and watered the whole face of the ground.", "7": "Then the LORD God formed the human from dust from the ground, and breathed into his nostrils the breath of life, and the human became a living being.", "8": "The LORD God planted a garden in Eden, to the east, and placed there the human He had formed.", "9": "The LORD God caused to grow from the ground every tree pleasant to look at and good for food, and the tree of life in the middle of the garden, and the tree of the knowledge of good and evil.", "10": "A river flowed out of Eden to water the garden, and from there it divided into four heads.", "11": "The name of the first is Pishon, which flows around the whole land of Havilah, where there is gold.", "12": "The gold of that land is good; there is also bdellium and onyx stone.", "13": "The name of the second river is Gihon, which flows around the whole land of Cush.", "14": "The name of the third river is Tigris, which flows in front of Assyria, and the fourth river is the Euphrates.", "15": "The LORD God took the human and placed him in the garden of Eden, to till it and to keep it.", "16": "The LORD God gave a command to the human, saying, From every tree of the garden you may eat freely.", "17": "But from the tree of the knowledge of good and evil you shall not eat, for in the day that you eat from it, you will surely die.", "18": "The LORD God said, It is not good for the human to be alone; I will make for him a helper suitable for him.", "19": "So the LORD God formed from the ground every wild animal of the field and every bird of the heavens, and brought them to the human to see what he would call them. And whatever the human called each living creature, that became its name.", "20": "The human gave names to all the cattle, and to the birds of the heavens, and to every wild animal of the field, but for the human no helper suitable for him was found.", "21": "So the LORD God caused a deep sleep to fall upon the human, and he slept; then He took one of his ribs and closed up the flesh in its place.", "22": "The LORD God built the rib that He had taken from the human into a woman, and brought her to the human.", "23": "The human said, This at last is bone of my bones and flesh of my flesh; this one shall be called Woman, for from Man was this one taken.", "24": "Therefore a man shall leave his father and his mother and shall cleave to his wife, and they shall become one flesh.", "25": "The two of them were both naked, the human and his wife, and they were not ashamed.\n"}, "notes": "Notes\n- v. 7: \"nephesh chayyah\" is translated as \"a living being\" to reflect the context of creation and the breath of life.\n- v. 9: \"tree of the knowledge of good and evil\" reflects the Hebrew phrase \"etz hada'at tov va'ra.\"\n- v. 15: \"to till it and to keep it\" renders \"la'avod otah ul'shomer otah\" with active verbs.\n- v. 24: \"bone of my bones and flesh of my flesh\" preserves the poetic parallelism of the Hebrew.", "src": {"1": "וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָֽם׃", "2": "וַיְכַל אֱלֹהִים בַּיּוֹם הַשְּׁבִיעִי מְלַאכְתּוֹ אֲשֶׁר עָשָׂה וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי מִכָּל־מְלַאכְתּוֹ אֲשֶׁר עָשָֽׂה׃", "3": "וַיְבָרֶךְ אֱלֹהִים אֶת־יוֹם הַשְּׁבִיעִי וַיְקַדֵּשׁ אֹתוֹ כִּי בוֹ שָׁבַת מִכָּל־מְלַאכְתּוֹ אֲשֶׁר־בָּרָא אֱלֹהִים לַעֲשֽׂוֹת׃", "4": "אֵלֶּה תוֹלְדוֹת הַשָּׁמַיִם וְהָאָרֶץ בְּהִבָּֽרְאָם בְּיוֹם עֲשׂוֹת יְהוָה אֱלֹהִים אֶרֶץ וְשָׁמָֽיִם׃", "5": "וְכֹל ׀ שִׂיחַ הַשָּׂדֶה טֶרֶם יִֽהְיֶה בָאָרֶץ וְכָל־עֵשֶׂב הַשָּׂדֶה טֶרֶם יִצְמָח כִּי לֹא הִמְטִיר יְהוָה אֱלֹהִים עַל־הָאָרֶץ וְאָדָם אַיִן לַֽעֲבֹד אֶת־הָֽאֲדָמָֽה׃", "6": "וְאֵד יַֽעֲלֶה מִן־הָאָרֶץ וְהִשְׁקָה אֶֽת־כָּל־פְּנֵֽי־הָֽאֲדָמָֽה׃", "7": "וַיִּיצֶר יְהוָה אֱלֹהִים אֶת־הָֽאָדָם עָפָר מִן־הָאֲדָמָה וַיִּפַּח בְּאַפָּיו נִשְׁמַת חַיִּים וַֽיְהִי הָֽאָדָם לְנֶפֶשׁ חַיָּֽה׃", "8": "וַיִּטַּע יְהוָה אֱלֹהִים גַּן־בְעֵדֶן מִקֶּדֶם וַיָּשֶׂם שָׁם אֶת־הָֽאָדָם אֲשֶׁר יָצָֽר׃", "9": "וַיַּצְמַח יְהוָה אֱלֹהִים מִן־הָאֲדָמָה כָּל־עֵץ נֶחְמָד לְמַרְאֶה וְטוֹב לְמַאֲכָל וְעֵץ הַֽחַיִּים בְּתוֹךְ הַגָּן וְעֵץ הַדַּעַת טוֹב וָרָֽע׃", "10": "וְנָהָרּ יֹצֵא מֵעֵדֶן לְהַשְׁקוֹת אֶת־הַגָּן וּמִשָּׁם יִפָּרֵד וְהָיָה לְאַרְבָּעָה רָאשִֽׁים׃", "11": "שֵׁם הָֽאֶחָד פִּישׁוֹן הוּא הַסֹּבֵב אֵת כָּל־אֶרֶץ הַֽחֲוִילָה אֲשֶׁר־שָׁם הַזָּהָֽב׃", "12": "וּֽזֲהַב הָאָרֶץ הַהִוא טוֹב שָׁם הַבְּדֹלַח וְאֶבֶן הַשֹּֽׁהַם׃", "13": "וְשֵֽׁם־הַנָּהָר הַשֵּׁנִי גִּיחוֹן הוּא הַסּוֹבֵב אֵת כָּל־אֶרֶץ כּֽוּשׁ׃", "14": "וְשֵׁם הַנָּהָר הַשְּׁלִישִׁי חִדֶּקֶל הוּא הַֽהֹלֵךְ קִדְמַת אַשּׁוּר וְהַנָּהָר הָֽרְבִיעִי הוּא פְרָֽת׃", "15": "וַיִּקַּח יְהוָה אֱלֹהִים אֶת־הָֽאָדָם וַיַּנִּחֵהוּ בְגַן־עֵדֶן לְעָבְדָהּ וּלְשָׁמְרָֽהּ׃", "16": "וַיְצַו יְהוָה אֱלֹהִים עַל־הָֽאָדָם לֵאמֹר מִכֹּל עֵֽץ־הַגָּן אָכֹל תֹּאכֵֽל׃", "17": "וּמֵעֵץ הַדַּעַת טוֹב וָרָע לֹא תֹאכַל מִמֶּנּוּ כִּי בְּיוֹם אֲכָלְךָ מִמֶּנּוּ מוֹת תָּמֽוּת׃", "18": "וַיֹּאמֶר יְהוָה אֱלֹהִים לֹא־טוֹב הֱיוֹת הָֽאָדָם לְבַדּוֹ אֶֽעֱשֶׂהּ־לּוֹ עֵזֶר כְּנֶגְדּֽוֹ׃", "19": "וַיִּצֶר יְהוָה אֱלֹהִים מִן־הָֽאֲדָמָה כָּל־חַיַּת הַשָּׂדֶה וְאֵת כָּל־עוֹף הַשָּׁמַיִם וַיָּבֵא אֶל־הָאָדָם לִרְאוֹת מַה־יִּקְרָא־לוֹ וְכֹל אֲשֶׁר יִקְרָא־לוֹ הָֽאָדָם נֶפֶשׁ חַיָּה הוּא שְׁמֽוֹ׃", "20": "וַיִּקְרָא הָֽאָדָם שֵׁמוֹת לְכָל־הַבְּהֵמָה וּלְעוֹף הַשָּׁמַיִם וּלְכֹל חַיַּת הַשָּׂדֶה וּלְאָדָם לֹֽא־מָצָא עֵזֶר כְּנֶגְדּֽוֹ׃", "21": "וַיַּפֵּל יְהוָה אֱלֹהִים ׀ תַּרְדֵּמָה עַל־הָאָדָם וַיִּישָׁן וַיִּקַּח אַחַת מִצַּלְעֹתָיו וַיִּסְגֹּר בָּשָׂר תַּחְתֶּֽנָּה׃", "22": "וַיִּבֶן יְהוָה אֱלֹהִים ׀ אֶֽת־הַצֵּלָע אֲשֶׁר־לָקַח מִן־הָֽאָדָם לְאִשָּׁה וַיְבִאֶהָ אֶל־הָֽאָדָֽם׃", "23": "וַיֹּאמֶר הָֽאָדָם זֹאת הַפַּעַם עֶצֶם מֵֽעֲצָמַי וּבָשָׂר מִבְּשָׂרִי לְזֹאת יִקָּרֵא אִשָּׁה כִּי מֵאִישׁ לֻֽקֳחָה־זֹּֽאת׃", "24": "עַל־כֵּן יַֽעֲזָב־אִישׁ אֶת־אָבִיו וְאֶת־אִמּוֹ וְדָבַק בְּאִשְׁתּוֹ וְהָיוּ לְבָשָׂר אֶחָֽד׃", "25": "וַיִּֽהְיוּ שְׁנֵיהֶם עֲרוּמִּים הָֽאָדָם וְאִשְׁתּוֹ וְלֹא יִתְבֹּשָֽׁשׁוּ׃"}, "lang": "hbo"}, "3": {"verses": {"1": "The serpent was more shrewd than any wild animal of the field that the LORD God had made. He said to the woman, \"Indeed, has God said, 'You shall not eat from any tree of the garden'?\"", "2": "The woman said to the serpent, \"We may eat of the fruit of the trees of the garden.\"", "3": "\"But from the fruit of the tree that is in the middle of the garden, God said, 'You shall not eat from it, nor shall you touch it, lest you die.'\"", "4": "The serpent said to the woman, \"You will not surely die.\"", "5": "\"For God knows that in the day you eat from it, your eyes will be opened and you will be like God, knowing good and evil.\"", "6": "The woman saw that the tree was good for food, and that it was a delight to the eyes, and that the tree was to be desired to make one wise. She took of its fruit and ate, and gave also to her husband with her, and he ate.", "7": "The eyes of both of them were opened, and they knew that they were naked. They sewed fig leaves together and made themselves coverings.", "8": "They heard the sound of the LORD God walking in the garden at the time of the day breeze, and the man and his wife hid themselves from the presence of the LORD God among the trees of the garden.", "9": "The LORD God called to the man and said to him, \"Where are you?\"", "10": "He said, \"I heard the sound of You in the garden, and I was afraid because I was naked, so I hid.\"", "11": "God said, \"Who told you that you were naked? Have you eaten from the tree that I commanded you not to eat from?\"", "12": "The man said, \"The woman whom You gave to be with me, she gave me from the tree, and I ate.\"", "13": "The LORD God said to the woman, \"What is this you have done?\" The woman said, \"The serpent beguiled me, and I ate.\"", "14": "The LORD God said to the serpent, \"Because you have done this, cursed are you among all the livestock and among all the wild animals of the field; on your belly you will go, and dust you will eat all the days of your life.\"", "15": "\"I will put enmity between you and the woman, and between your offspring and her offspring; he will strike your head, and you will strike his heel.\"", "16": "To the woman He said, \"I will multiply your pain in childbirth; in pain you will bring forth children. Your desire will be for your husband, and he will rule over you.\"", "17": "To Adam He said, \"Because you listened to the voice of your wife and ate from the tree of which I commanded you, 'You shall not eat from it,' cursed is the ground because of you. In toil you will eat of it all the days of your life.\"", "18": "\"Thorns and thistles it will grow for you, and you will eat the herb of the field.\"", "19": "\"By the sweat of your face you will eat bread, until you return to the ground, for from it you were taken. For you are dust, and to dust you will return.\"", "20": "The man named his wife Eve, because she was the mother of all living.", "21": "The LORD God made garments of skin for Adam and for his wife, and clothed them.", "22": "The LORD God said, \"Behold, the man has become like one of Us, knowing good and evil. Now, lest he reach out his hand and take also from the tree of life and eat, and live forever.\"", "23": "The LORD God sent him out from the garden of Eden to till the ground from which he was taken.", "24": "He drove out the man, and placed at the east of the garden of Eden the cherubim and a flaming sword which turned every way to guard the way to the tree of life.\n"}, "notes": "Notes  \n- v. 1: The word שָׂדֶֽה (sadeh) is translated as \"field,\" not \"countryside\" or \"country,\" for consistency with the narrative context.  \n- v. 5: The phrase \"like God, knowing good and evil\" is a direct rendering of כֵּֽאלֹהִים יֹדְעֵי טוֹב וָרָֽע.  \n- v. 15: The phrase \"he will strike your head, and you will strike his heel\" captures the poetic justice of the curse and the hope of redemption.  \n- v. 22: The plural \"Us\" reflects the divine plural in the Hebrew text.  \n- v. 24: \"Flaming sword which turned every way\" is a literal translation of לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת.", "src": {"1": "וְהַנָּחָשׁ הָיָה עָרוּם מִכֹּל חַיַּת הַשָּׂדֶה אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים וַיֹּאמֶר אֶל־הָאִשָּׁה אַף כִּֽי־אָמַר אֱלֹהִים לֹא תֹֽאכְלוּ מִכֹּל עֵץ הַגָּֽן׃", "2": "וַתֹּאמֶר הָֽאִשָּׁה אֶל־הַנָּחָשׁ מִפְּרִי עֵֽץ־הַגָּן נֹאכֵֽל׃", "3": "וּמִפְּרִי הָעֵץ אֲשֶׁר בְּתוֹךְ־הַגָּן אָמַר אֱלֹהִים לֹא תֹֽאכְלוּ מִמֶּנּוּ וְלֹא תִגְּעוּ בּוֹ פֶּן־תְּמֻתֽוּן׃", "4": "וַיֹּאמֶר הַנָּחָשׁ אֶל־הָֽאִשָּׁה לֹֽא־מוֹת תְּמֻתֽוּן׃", "5": "כִּי יֹדֵעַ אֱלֹהִים כִּי בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ וְנִפְקְחוּ עֵֽינֵיכֶם וִהְיִיתֶם כֵּֽאלֹהִים יֹדְעֵי טוֹב וָרָֽע׃", "6": "וַתֵּרֶא הָֽאִשָּׁה כִּי טוֹב הָעֵץ לְמַאֲכָל וְכִי תַֽאֲוָה־הוּא לָעֵינַיִם וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל וַתִּקַּח מִפִּרְיוֹ וַתֹּאכַל וַתִּתֵּן גַּם־לְאִישָׁהּ עִמָּהּ וַיֹּאכַֽל׃", "7": "וַתִּפָּקַחְנָה עֵינֵי שְׁנֵיהֶם וַיֵּדְעוּ כִּי עֵֽירֻמִּם הֵם וַֽיִּתְפְּרוּ עֲלֵה תְאֵנָה וַיַּעֲשׂוּ לָהֶם חֲגֹרֹֽת׃", "8": "וַֽיִּשְׁמְעוּ אֶת־קוֹל יְהוָה אֱלֹהִים מִתְהַלֵּךְ בַּגָּן לְרוּחַ הַיּוֹם וַיִּתְחַבֵּא הָֽאָדָם וְאִשְׁתּוֹ מִפְּנֵי יְהוָה אֱלֹהִים בְּתוֹךְ עֵץ הַגָּֽן׃", "9": "וַיִּקְרָא יְהוָה אֱלֹהִים אֶל־הָֽאָדָם וַיֹּאמֶר לוֹ אַיֶּֽכָּה׃", "10": "וַיֹּאמֶר אֶת־קֹלְךָ שָׁמַעְתִּי בַּגָּן וָאִירָא כִּֽי־עֵירֹם אָנֹכִי וָאֵחָבֵֽא׃", "11": "וַיֹּאמֶר מִי הִגִּיד לְךָ כִּי עֵירֹם אָתָּה הֲמִן־הָעֵץ אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל־מִמֶּנּוּ אָכָֽלְתָּ׃", "12": "וַיֹּאמֶר הָֽאָדָם הָֽאִשָּׁה אֲשֶׁר נָתַתָּה עִמָּדִי הִוא נָֽתְנָה־לִּי מִן־הָעֵץ וָאֹכֵֽל׃", "13": "וַיֹּאמֶר יְהוָה אֱלֹהִים לָאִשָּׁה מַה־זֹּאת עָשִׂית וַתֹּאמֶר הָֽאִשָּׁה הַנָּחָשׁ הִשִּׁיאַנִי וָאֹכֵֽל׃", "14": "וַיֹּאמֶר יְהֹוָה אֱלֹהִים ׀ אֶֽל־הַנָּחָשׁ כִּי עָשִׂיתָ זֹּאת אָרוּר אַתָּה מִכָּל־הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה עַל־גְּחֹנְךָ תֵלֵךְ וְעָפָר תֹּאכַל כָּל־יְמֵי חַיֶּֽיךָ׃", "15": "וְאֵיבָה ׀ אָשִׁית בֵּֽינְךָ וּבֵין הָֽאִשָּׁה וּבֵין זַרְעֲךָ וּבֵין זַרְעָהּ הוּא יְשׁוּפְךָ רֹאשׁ וְאַתָּה תְּשׁוּפֶנּוּ עָקֵֽב׃", "16": "אֶֽל־הָאִשָּׁה אָמַר הַרְבָּה אַרְבֶּה עִצְּבוֹנֵךְ וְהֵֽרֹנֵךְ בְּעֶצֶב תֵּֽלְדִי בָנִים וְאֶל־אִישֵׁךְ תְּשׁוּקָתֵךְ וְהוּא יִמְשָׁל־בָּֽךְ׃", "17": "וּלְאָדָם אָמַר כִּֽי־שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ וַתֹּאכַל מִן־הָעֵץ אֲשֶׁר צִוִּיתִיךָ לֵאמֹר לֹא תֹאכַל מִמֶּנּוּ אֲרוּרָה הָֽאֲדָמָה בַּֽעֲבוּרֶךָ בְּעִצָּבוֹן תֹּֽאכֲלֶנָּה כֹּל יְמֵי חַיֶּֽיךָ׃", "18": "וְקוֹץ וְדַרְדַּר תַּצְמִיחַֽ לָךְ וְאָכַלְתָּ אֶת־עֵשֶׂב הַשָּׂדֶֽה׃", "19": "בְּזֵעַת אַפֶּיךָ תֹּאכַל לֶחֶם עַד שֽׁוּבְךָ אֶל־הָאֲדָמָה כִּי מִמֶּנָּה לֻקָּחְתָּ כִּֽי־עָפָר אַתָּה וְאֶל־עָפָר תָּשֽׁוּב׃", "20": "וַיִּקְרָא הָֽאָדָם שֵׁם אִשְׁתּוֹ חַוָּה כִּי הִוא הָֽיְתָה אֵם כָּל־חָֽי׃", "21": "וַיַּעַשׂ יְהוָה אֱלֹהִים לְאָדָם וּלְאִשְׁתּוֹ כָּתְנוֹת עוֹר וַיַּלְבִּשֵֽׁם׃", "22": "וַיֹּאמֶר ׀ יְהוָה אֱלֹהִים הֵן הָֽאָדָם הָיָה כְּאַחַד מִמֶּנּוּ לָדַעַת טוֹב וָרָע וְעַתָּה ׀ פֶּן־יִשְׁלַח יָדוֹ וְלָקַח גַּם מֵעֵץ הַֽחַיִּים וְאָכַל וָחַי לְעֹלָֽם׃", "23": "וַֽיְשַׁלְּחֵהוּ יְהוָה אֱלֹהִים מִגַּן־עֵדֶן לַֽעֲבֹד אֶת־הָאֲדָמָה אֲשֶׁר לֻקַּח מִשָּֽׁם׃", "24": "וַיְגָרֶשׁ אֶת־הָֽאָדָם וַיַּשְׁכֵּן מִקֶּדֶם לְגַן־עֵדֶן אֶת־הַכְּרֻבִים וְאֵת לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת לִשְׁמֹר אֶת־דֶּרֶךְ עֵץ הַֽחַיִּֽים׃"}, "lang": "hbo"}, "4": {"verses": {"1": "The human knew his wife Eve, and she became pregnant and gave birth to Cain. She said, \"I have gotten a man with the help of the LORD.\"\n", "2": "She gave birth again to his brother Abel. Abel became a shepherd of flocks, and Cain became a tiller of the ground.\n", "3": "After some time had passed, Cain brought an offering to the LORD from the fruit of the ground.\n", "4": "Abel also brought an offering, from the firstborn of his flock and from their fat portions. The LORD looked with favor on Abel and his offering.\n", "5": "But he did not look with favor on Cain and his offering. Cain was very angry, and his face fell.\n", "6": "The LORD said to Cain, \"Why are you angry, and why has your face fallen?\n", "7": "If you do well, will you not be accepted? And if you do not do well, sin lies in wait at the door; its desire is for you, but you must master it.\"\n", "8": "Cain spoke to his brother Abel while they were in the field. Then Cain rose up against his brother Abel and killed him.\n", "9": "The LORD said to Cain, \"Where is your brother Abel?\" He said, \"I do not know. Am I my brother's guardian?\"\n", "10": "The LORD said, \"What have you done? The voice of your brother's blood is crying out to me from the ground.\n", "11": "And now you are cursed from the ground, which has opened its mouth to receive your brother's blood from your hand.\n", "12": "When you work the ground, it will no longer yield to you its strength. You will be a restless wanderer on the earth.\"\n", "13": "Cain said to the LORD, \"My punishment is too great to bear.\n", "14": "Today you have driven me away from the presence of the ground, and I will be hidden from your face. I will be a restless wanderer on the earth, and whoever finds me will kill me.\"\n", "15": "The LORD said to him, \"Then whoever kills Cain, vengeance will be taken from him sevenfold.\" And the LORD set a mark on Cain, so that no one finding him would kill him.\n", "16": "So Cain went out from the presence of the LORD and lived in the land of Nod, east of Eden.\n", "17": "Cain knew his wife, and she became pregnant and gave birth to Enoch. He built a city and named the city after his son Enoch.\n", "18": "Enoch fathered Irad, and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.\n", "19": "Lamech took two wives. The name of the first was Adah, and the name of the second was Zillah.\n", "20": "Adah gave birth to Jabal, who was the ancestor of those who dwell in tents and raise livestock.\n", "21": "His brother's name was Jubal, who was the ancestor of all who play the lyre and the flute.\n", "22": "Zillah also gave birth to Tubal-Cain, the forger of every tool of bronze and iron. The sister of Tubal-Cain was Naamah.\n", "23": "Lamech said to his wives, Adah and Zillah, \"Hear my voice, wives of Lamech, listen to what I say. I have killed a man for wounding me, and a boy for striking me.\n", "24": "For if Cain is avenged sevenfold, then Lamech seventy-sevenfold.\"\n", "25": "Adam knew his wife again, and she gave birth to a son and named him Seth, saying, \"God has given me another seed in place of Abel, for Cain killed him.\"\n", "26": "To Seth also was born a son, and he named him Enosh. At that time people began to call upon the name of the LORD.\n"}, "notes": "Notes\n- v. 7: \"sin lies in wait at the door\" — the Hebrew uses a metaphor of a crouching animal, \"chattat rovet,\" which is rendered as \"sin lies in wait at the door.\"\n- v. 23: \"I have killed a man for wounding me, and a boy for striking me\" — the Hebrew uses poetic parallelism to emphasize the escalation from wounding to death.\n- v. 26: \"people began to call upon the name of the LORD\" — the phrase \"to call upon the name of YHWH\" is a standard biblical idiom for worship or invoking divine presence.", "src": {"1": "וְהָאָדָם יָדַע אֶת־חַוָּה אִשְׁתּוֹ וַתַּהַר וַתֵּלֶד אֶת־קַיִן וַתֹּאמֶר קָנִיתִי אִישׁ אֶת־יְהוָֽה׃", "2": "וַתֹּסֶף לָלֶדֶת אֶת־אָחִיו אֶת־הָבֶל וַֽיְהִי־הֶבֶל רֹעֵה צֹאן וְקַיִן הָיָה עֹבֵד אֲדָמָֽה׃", "3": "וַֽיְהִי מִקֵּץ יָמִים וַיָּבֵא קַיִן מִפְּרִי הָֽאֲדָמָה מִנְחָה לַֽיהוָֽה׃", "4": "וְהֶבֶל הֵבִיא גַם־הוּא מִבְּכֹרוֹת צֹאנוֹ וּמֵֽחֶלְבֵהֶן וַיִּשַׁע יְהוָה אֶל־הֶבֶל וְאֶל־מִנְחָתֽוֹ׃", "5": "וְאֶל־קַיִן וְאֶל־מִנְחָתוֹ לֹא שָׁעָה וַיִּחַר לְקַיִן מְאֹד וַֽיִּפְּלוּ פָּנָֽיו׃", "6": "וַיֹּאמֶר יְהוָה אֶל־קָיִן לָמָּה חָרָה לָךְ וְלָמָּה נָפְלוּ פָנֶֽיךָ׃", "7": "הֲלוֹא אִם־תֵּיטִיב שְׂאֵת וְאִם לֹא תֵיטִיב לַפֶּתַח חַטָּאת רֹבֵץ וְאֵלֶיךָ תְּשׁוּקָתוֹ וְאַתָּה תִּמְשָׁל־בּֽוֹ׃", "8": "וַיֹּאמֶר קַיִן אֶל־הֶבֶל אָחִיו וַֽיְהִי בִּהְיוֹתָם בַּשָּׂדֶה וַיָּקָם קַיִן אֶל־הֶבֶל אָחִיו וַיַּהַרְגֵֽהוּ׃", "9": "וַיֹּאמֶר יְהוָה אֶל־קַיִן אֵי הֶבֶל אָחִיךָ וַיֹּאמֶר לֹא יָדַעְתִּי הֲשֹׁמֵר אָחִי אָנֹֽכִי׃", "10": "וַיֹּאמֶר מֶה עָשִׂיתָ קוֹל דְּמֵי אָחִיךָ צֹעֲקִים אֵלַי מִן־הָֽאֲדָמָֽה׃", "11": "וְעַתָּה אָרוּר אָתָּה מִן־הָֽאֲדָמָה אֲשֶׁר פָּצְתָה אֶת־פִּיהָ לָקַחַת אֶת־דְּמֵי אָחִיךָ מִיָּדֶֽךָ׃", "12": "כִּי תַֽעֲבֹד אֶת־הָאֲדָמָה לֹֽא־תֹסֵף תֵּת־כֹּחָהּ לָךְ נָע וָנָד תִּֽהְיֶה בָאָֽרֶץ׃", "13": "וַיֹּאמֶר קַיִן אֶל־יְהוָה גָּדוֹל עֲוֺנִי מִנְּשֹֽׂא׃", "14": "הֵן גֵּרַשְׁתָּ אֹתִי הַיּוֹם מֵעַל פְּנֵי הָֽאֲדָמָה וּמִפָּנֶיךָ אֶסָּתֵר וְהָיִיתִי נָע וָנָד בָּאָרֶץ וְהָיָה כָל־מֹצְאִי יַֽהַרְגֵֽנִי׃", "15": "וַיֹּאמֶר לוֹ יְהוָה לָכֵן כָּל־הֹרֵג קַיִן שִׁבְעָתַיִם יֻקָּם וַיָּשֶׂם יְהוָה לְקַיִן אוֹת לְבִלְתִּי הַכּוֹת־אֹתוֹ כָּל־מֹצְאֽוֹ׃", "16": "וַיֵּצֵא קַיִן מִלִּפְנֵי יְהוָה וַיֵּשֶׁב בְּאֶֽרֶץ־נוֹד קִדְמַת־עֵֽדֶן׃", "17": "וַיֵּדַע קַיִן אֶת־אִשְׁתּוֹ וַתַּהַר וַתֵּלֶד אֶת־חֲנוֹךְ וַֽיְהִי בֹּנֶה עִיר וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ חֲנֽוֹךְ׃", "18": "וַיִּוָּלֵד לַֽחֲנוֹךְ אֶת־עִירָד וְעִירָד יָלַד אֶת־מְחֽוּיָאֵל וּמְחִיּיָאֵל יָלַד אֶת־מְתוּשָׁאֵל וּמְתוּשָׁאֵל יָלַד אֶת־לָֽמֶךְ׃", "19": "וַיִּֽקַּֽח־לוֹ לֶמֶךְ שְׁתֵּי נָשִׁים שֵׁם הָֽאַחַת עָדָה וְשֵׁם הַשֵּׁנִית צִלָּֽה׃", "20": "וַתֵּלֶד עָדָה אֶת־יָבָל הוּא הָיָה אֲבִי יֹשֵׁב אֹהֶל וּמִקְנֶֽה׃", "21": "וְשֵׁם אָחִיו יוּבָל הוּא הָיָה אֲבִי כָּל־תֹּפֵשׂ כִּנּוֹר וְעוּגָֽב׃", "22": "וְצִלָּה גַם־הִוא יָֽלְדָה אֶת־תּוּבַל קַיִן לֹטֵשׁ כָּל־חֹרֵשׁ נְחֹשֶׁת וּבַרְזֶל וַֽאֲחוֹת תּֽוּבַל־קַיִן נַֽעֲמָֽה׃", "23": "וַיֹּאמֶר לֶמֶךְ לְנָשָׁיו עָדָה וְצִלָּה שְׁמַעַן קוֹלִי נְשֵׁי לֶמֶךְ הַאְזֵנָּה אִמְרָתִי כִּי אִישׁ הָרַגְתִּי לְפִצְעִי וְיֶלֶד לְחַבֻּרָתִֽי׃", "24": "כִּי שִׁבְעָתַיִם יֻקַּם־קָיִן וְלֶמֶךְ שִׁבְעִים וְשִׁבְעָֽה׃", "25": "וַיֵּדַע אָדָם עוֹד אֶת־אִשְׁתּוֹ וַתֵּלֶד בֵּן וַתִּקְרָא אֶת־שְׁמוֹ שֵׁת כִּי שָֽׁת־לִי אֱלֹהִים זֶרַע אַחֵר תַּחַת הֶבֶל כִּי הֲרָגוֹ קָֽיִן׃", "26": "וּלְשֵׁת גַּם־הוּא יֻלַּד־בֵּן וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ אָז הוּחַל לִקְרֹא בְּשֵׁם יְהוָֽה׃"}, "lang": "hbo"}, "5": {"verses": {"1": "This is the account of Adam’s descendants. When God created Adam, he made him in God’s likeness.\n", "2": "He created him male and female, blessed them, and called their name Adam on the day they were created.\n", "3": "Adam lived 130 years and fathered a son in his own likeness, in his own image. He named him Seth.\n", "4": "After fathering Seth, Adam lived 800 years and fathered other sons and daughters.\n", "5": "All the days that Adam lived totaled 930 years, and he died.\n", "6": "Seth lived 105 years and fathered Enosh.\n", "7": "After fathering Enosh, Seth lived 807 years and fathered other sons and daughters.\n", "8": "All the days that Seth lived totaled 912 years, and he died.\n", "9": "Enosh lived 90 years and fathered Cainan.\n", "10": "After fathering Cainan, Enosh lived 815 years and fathered other sons and daughters.\n", "11": "All the days that Enosh lived totaled 905 years, and he died.\n", "12": "Cainan lived 70 years and fathered Mahalalel.\n", "13": "After fathering Mahalalel, Cainan lived 840 years and fathered other sons and daughters.\n", "14": "All the days that Cainan lived totaled 910 years, and he died.\n", "15": "Mahalalel lived 65 years and fathered Jared.\n", "16": "After fathering Jared, Mahalalel lived 830 years and fathered other sons and daughters.\n", "17": "All the days that Mahalalel lived totaled 895 years, and he died.\n", "18": "Jared lived 162 years and fathered Enoch.\n", "19": "After fathering Enoch, Jared lived 800 years and fathered other sons and daughters.\n", "20": "All the days that Jared lived totaled 962 years, and he died.\n", "21": "Enoch lived 65 years and fathered Methuselah.\n", "22": "After fathering Methuselah, Enoch walked with God for 300 years and fathered other sons and daughters.\n", "23": "All the days that Enoch lived totaled 365 years.\n", "24": "Enoch walked with God, and he was not, for God had taken him.\n", "25": "Methuselah lived 187 years and fathered Lamech.\n", "26": "After fathering Lamech, Methuselah lived 782 years and fathered other sons and daughters.\n", "27": "All the days that Methuselah lived totaled 969 years, and he died.\n", "28": "Lamech lived 182 years and fathered a son.\n", "29": "He named him Noah, saying, “This one will bring us relief from our labor and from the toil of our hands from the ground that the LORD has cursed.”\n", "30": "After fathering Noah, Lamech lived 595 years and fathered other sons and daughters.\n", "31": "All the days that Lamech lived totaled 777 years, and he died.\n", "32": "Noah was 500 years old when he fathered Shem, Ham, and Japheth.\n"}, "notes": "Notes\n- v. 1: \"the account of Adam’s descendants\" — The Hebrew is \"sefer toledot,\" literally \"book of generations,\" but here it functions as an introduction to a genealogical or narrative section.\n- v. 24: \"he was not\" — The Hebrew is \"ve’einenu,\" literally \"and he was not,\" referring to Enoch’s mysterious disappearance. The phrase \"for God had taken him\" is an interpretive gloss.\n- v. 29: \"relief from our labor\" — The Hebrew term \"machamenu\" is translated here as \"relief,\" but could also carry a more emotional tone, such as \"comfort\" or \"consolation.\"", "src": {"1": "זֶה סֵפֶר תּוֹלְדֹת אָדָם בְּיוֹם בְּרֹא אֱלֹהִים אָדָם בִּדְמוּת אֱלֹהִים עָשָׂה אֹתֽוֹ׃", "2": "זָכָר וּנְקֵבָה בְּרָאָם וַיְבָרֶךְ אֹתָם וַיִּקְרָא אֶת־שְׁמָם אָדָם בְּיוֹם הִבָּֽרְאָֽם׃", "3": "וַֽיְחִי אָדָם שְׁלֹשִׁים וּמְאַת שָׁנָה וַיּוֹלֶד בִּדְמוּתוֹ כְּצַלְמוֹ וַיִּקְרָא אֶת־שְׁמוֹ שֵֽׁת׃", "4": "וַיִּֽהְיוּ יְמֵי־אָדָם אַֽחֲרֵי הוֹלִידוֹ אֶת־שֵׁת שְׁמֹנֶה מֵאֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "5": "וַיִּֽהְיוּ כָּל־יְמֵי אָדָם אֲשֶׁר־חַי תְּשַׁע מֵאוֹת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וַיָּמֹֽת׃", "6": "וַֽיְחִי־שֵׁת חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה וַיּוֹלֶד אֶת־אֱנֽוֹשׁ׃", "7": "וַֽיְחִי־שֵׁת אַֽחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "8": "וַיִּֽהְיוּ כָּל־יְמֵי־שֵׁת שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "9": "וַֽיְחִי אֱנוֹשׁ תִּשְׁעִים שָׁנָה וַיּוֹלֶד אֶת־קֵינָֽן׃", "10": "וַֽיְחִי אֱנוֹשׁ אַֽחֲרֵי הוֹלִידוֹ אֶת־קֵינָן חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "11": "וַיִּֽהְיוּ כָּל־יְמֵי אֱנוֹשׁ חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "12": "וַֽיְחִי קֵינָן שִׁבְעִים שָׁנָה וַיּוֹלֶד אֶת־מַֽהֲלַלְאֵֽל׃", "13": "וַיְחִי קֵינָן אַחֲרֵי הוֹלִידוֹ אֶת־מַֽהֲלַלְאֵל אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "14": "וַיִּֽהְיוּ כָּל־יְמֵי קֵינָן עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "15": "וַֽיְחִי מַֽהֲלַלְאֵל חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה וַיּוֹלֶד אֶת־יָֽרֶד׃", "16": "וַֽיְחִי מַֽהֲלַלְאֵל אַֽחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "17": "וַיִּהְיוּ כָּל־יְמֵי מַהֲלַלְאֵל חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "18": "וַֽיְחִי־יֶרֶד שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה וַיּוֹלֶד אֶת־חֲנֽוֹךְ׃", "19": "וַֽיְחִי־יֶרֶד אַֽחֲרֵי הוֹלִידוֹ אֶת־חֲנוֹךְ שְׁמֹנֶה מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "20": "וַיִּֽהְיוּ כָּל־יְמֵי־יֶרֶד שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "21": "וַֽיְחִי חֲנוֹךְ חָמֵשׁ וְשִׁשִּׁים שָׁנָה וַיּוֹלֶד אֶת־מְתוּשָֽׁלַח׃", "22": "וַיִּתְהַלֵּךְ חֲנוֹךְ אֶת־הָֽאֱלֹהִים אַֽחֲרֵי הוֹלִידוֹ אֶת־מְתוּשֶׁלַח שְׁלֹשׁ מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "23": "וַיְהִי כָּל־יְמֵי חֲנוֹךְ חָמֵשׁ וְשִׁשִּׁים שָׁנָה וּשְׁלֹשׁ מֵאוֹת שָׁנָֽה׃", "24": "וַיִּתְהַלֵּךְ חֲנוֹךְ אֶת־הָֽאֱלֹהִים וְאֵינֶנּוּ כִּֽי־לָקַח אֹתוֹ אֱלֹהִֽים׃", "25": "וַיְחִי מְתוּשֶׁלַח שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה וַיּוֹלֶד אֶת־לָֽמֶךְ׃", "26": "וַֽיְחִי מְתוּשֶׁלַח אַֽחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "27": "וַיִּהְיוּ כָּל־יְמֵי מְתוּשֶׁלַח תֵּשַׁע וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "28": "וַֽיְחִי־לֶמֶךְ שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה וַיּוֹלֶד בֵּֽן׃", "29": "וַיִּקְרָא אֶת־שְׁמוֹ נֹחַ לֵאמֹר זֶה יְנַחֲמֵנוּ מִֽמַּעֲשֵׂנוּ וּמֵעִצְּבוֹן יָדֵינוּ מִן־הָאֲדָמָה אֲשֶׁר אֵֽרְרָהּ יְהוָֽה׃", "30": "וַֽיְחִי־לֶמֶךְ אַֽחֲרֵי הוֹלִידוֹ אֶת־נֹחַ חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "31": "וַֽיְהִי כָּל־יְמֵי־לֶמֶךְ שֶׁבַע וְשִׁבְעִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה וַיָּמֹֽת׃", "32": "וַֽיְהִי־נֹחַ בֶּן־חֲמֵשׁ מֵאוֹת שָׁנָה וַיּוֹלֶד נֹחַ אֶת־שֵׁם אֶת־חָם וְאֶת־יָֽפֶת׃"}, "lang": "hbo"}, "6": {"verses": {"1": "When the human began to multiply on the surface of the earth and daughters were born to them,\n", "2": "the sons of the gods saw the daughters of the human, that they were beautiful, and they took for themselves wives from all whom they chose.\n", "3": "The LORD said, “My spirit will not remain in the human forever, since he is flesh, and his days will be 120 years.”\n", "4": "The Nephilim were in the earth in those days and after that, when the sons of the gods came to the daughters of the human and they bore children to them. These were the mighty ones, the men of renown.\n", "5": "The LORD saw that the wickedness of the human was great on the earth, and that every thought of their minds was only evil all the time.\n", "6": "The LORD regretted having made the human on the earth, and it grieved him to his heart.\n", "7": "The LORD said, “I will blot out the human I have made from the face of the earth, from human to beast to creeping thing and to birds of the sky, for I regret that I made them.”\n", "8": "But Noah found favor in the eyes of the LORD.\n", "9": "These are the generations of Noah. Noah was a righteous man, blameless in his generations. Noah walked with God.\n", "10": "Noah fathered three sons: Shem, Ham, and Japheth.\n", "11": "The earth had become corrupt before God, and the earth was filled with violence.\n", "12": "God saw the earth and behold, it was corrupt, for all flesh had corrupted its way on the earth.\n", "13": "God said to Noah, “The end of all flesh has come before me, for the earth is filled with violence because of them. I am about to destroy them from the earth.”\n", "14": "Make yourself an ark of gopher wood. You shall make the ark with rooms, and you shall cover it inside and out with pitch.\n", "15": "This is how you must make it: three hundred cubits long, fifty cubits wide, and thirty cubits high.\n", "16": "You shall make a window for the ark and finish it to a cubit from above. You shall place the door of the ark on its side. You shall make lower, second, and third decks.\n", "17": "And I am bringing a flood of waters upon the earth to destroy all flesh in which there is the breath of life from beneath the heavens. Everything on the earth will perish.\n", "18": "But I will establish my covenant with you, and you will enter the ark—you, your sons, your wife, and your sons’ wives with you.\n", "19": "From every living thing, from every flesh, you shall bring two of each into the ark to keep them alive with you—male and female they shall be.\n", "20": "From the birds, according to their kind, and from the beasts, according to their kind, and from all crawling things on the earth, according to their kind—two of each will come to you to keep them alive.\n", "21": "And you, take for yourself every kind of food that is eaten, and gather it to yourself. It will be food for you and for them.”\n", "22": "Noah did everything as God had commanded him. He did it.\n"}, "notes": "Notes\n- v. 2: \"sons of the gods\" — a difficult phrase; some interpret this as divine beings or angelic figures, others as rulers or descendants of Seth. The Hebrew is \"benei elohim,\" literally \"sons of gods.\"\n- v. 4: \"Nephilim\" — the meaning of the Hebrew is debated. Here rendered as a proper noun, referring to a race of giants or legendary figures.\n- v. 11: \"had become corrupt\" — the verb \"shachah\" can mean \"corrupt\" or \"ruined,\" often used in moral or cosmic contexts.\n- v. 17: \"I am bringing a flood of waters\" — the Hebrew is \"mabbul,\" often rendered as \"flood,\" but can imply a comprehensive or judgmental deluge.", "src": {"1": "וַֽיְהִי כִּֽי־הֵחֵל הָֽאָדָם לָרֹב עַל־פְּנֵי הָֽאֲדָמָה וּבָנוֹת יֻלְּדוּ לָהֶֽם׃", "2": "וַיִּרְאוּ בְנֵי־הָֽאֱלֹהִים אֶת־בְּנוֹת הָֽאָדָם כִּי טֹבֹת הֵנָּה וַיִּקְחוּ לָהֶם נָשִׁים מִכֹּל אֲשֶׁר בָּחָֽרוּ׃", "3": "וַיֹּאמֶר יְהוָה לֹֽא־יָדוֹן רוּחִי בָֽאָדָם לְעֹלָם בְּשַׁגַּם הוּא בָשָׂר וְהָיוּ יָמָיו מֵאָה וְעֶשְׂרִים שָׁנָֽה׃", "4": "הַנְּפִלִים הָיוּ בָאָרֶץ בַּיָּמִים הָהֵם וְגַם אַֽחֲרֵי־כֵן אֲשֶׁר יָבֹאוּ בְּנֵי הָֽאֱלֹהִים אֶל־בְּנוֹת הָֽאָדָם וְיָלְדוּ לָהֶם הֵמָּה הַגִּבֹּרִים אֲשֶׁר מֵעוֹלָם אַנְשֵׁי הַשֵּֽׁם׃", "5": "וַיַּרְא יְהוָה כִּי רַבָּה רָעַת הָאָדָם בָּאָרֶץ וְכָל־יֵצֶר מַחְשְׁבֹת לִבּוֹ רַק רַע כָּל־הַיּֽוֹם׃", "6": "וַיִּנָּחֶם יְהוָה כִּֽי־עָשָׂה אֶת־הָֽאָדָם בָּאָרֶץ וַיִּתְעַצֵּב אֶל־לִבּֽוֹ׃", "7": "וַיֹּאמֶר יְהוָה אֶמְחֶה אֶת־הָאָדָם אֲשֶׁר־בָּרָאתִי מֵעַל פְּנֵי הָֽאֲדָמָה מֵֽאָדָם עַד־בְּהֵמָה עַד־רֶמֶשׂ וְעַד־עוֹף הַשָּׁמָיִם כִּי נִחַמְתִּי כִּי עֲשִׂיתִֽם׃", "8": "וְנֹחַ מָצָא חֵן בְּעֵינֵי יְהוָֽה׃", "9": "אֵלֶּה תּוֹלְדֹת נֹחַ נֹחַ אִישׁ צַדִּיק תָּמִים הָיָה בְּדֹֽרֹתָיו אֶת־הָֽאֱלֹהִים הִֽתְהַלֶּךְ־נֹֽחַ׃", "10": "וַיּוֹלֶד נֹחַ שְׁלֹשָׁה בָנִים אֶת־שֵׁם אֶת־חָם וְאֶת־יָֽפֶת׃", "11": "וַתִּשָּׁחֵת הָאָרֶץ לִפְנֵי הָֽאֱלֹהִים וַתִּמָּלֵא הָאָרֶץ חָמָֽס׃", "12": "וַיַּרְא אֱלֹהִים אֶת־הָאָרֶץ וְהִנֵּה נִשְׁחָתָה כִּֽי־הִשְׁחִית כָּל־בָּשָׂר אֶת־דַּרְכּוֹ עַל־הָאָֽרֶץ׃", "13": "וַיֹּאמֶר אֱלֹהִים לְנֹחַ קֵץ כָּל־בָּשָׂר בָּא לְפָנַי כִּֽי־מָלְאָה הָאָרֶץ חָמָס מִפְּנֵיהֶם וְהִנְנִי מַשְׁחִיתָם אֶת־הָאָֽרֶץ׃", "14": "עֲשֵׂה לְךָ תֵּבַת עֲצֵי־גֹפֶר קִנִּים תַּֽעֲשֶׂה אֶת־הַתֵּבָה וְכָֽפַרְתָּ אֹתָהּ מִבַּיִת וּמִחוּץ בַּכֹּֽפֶר׃", "15": "וְזֶה אֲשֶׁר תַּֽעֲשֶׂה אֹתָהּ שְׁלֹשׁ מֵאוֹת אַמָּה אֹרֶךְ הַתֵּבָה חֲמִשִּׁים אַמָּה רָחְבָּהּ וּשְׁלֹשִׁים אַמָּה קוֹמָתָֽהּ׃", "16": "צֹהַר ׀ תַּֽעֲשֶׂה לַתֵּבָה וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה וּפֶתַח הַתֵּבָה בְּצִדָּהּ תָּשִׂים תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים תַּֽעֲשֶֽׂהָ׃", "17": "וַאֲנִי הִנְנִי מֵבִיא אֶת־הַמַּבּוּל מַיִם עַל־הָאָרֶץ לְשַׁחֵת כָּל־בָּשָׂר אֲשֶׁר־בּוֹ רוּחַ חַיִּים מִתַּחַת הַשָּׁמָיִם כֹּל אֲשֶׁר־בָּאָרֶץ יִגְוָֽע׃", "18": "וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתָּךְ וּבָאתָ אֶל־הַתֵּבָה אַתָּה וּבָנֶיךָ וְאִשְׁתְּךָ וּנְשֵֽׁי־בָנֶיךָ אִתָּֽךְ׃", "19": "וּמִכָּל־הָחַי מִֽכָּל־בָּשָׂר שְׁנַיִם מִכֹּל תָּבִיא אֶל־הַתֵּבָה לְהַחֲיֹת אִתָּךְ זָכָר וּנְקֵבָה יִֽהְיֽוּ׃", "20": "מֵהָעוֹף לְמִינֵהוּ וּמִן־הַבְּהֵמָה לְמִינָהּ מִכֹּל רֶמֶשׂ הָֽאֲדָמָה לְמִינֵהוּ שְׁנַיִם מִכֹּל יָבֹאוּ אֵלֶיךָ לְהַֽחֲיֽוֹת׃", "21": "וְאַתָּה קַח־לְךָ מִכָּל־מַֽאֲכָל אֲשֶׁר יֵֽאָכֵל וְאָסַפְתָּ אֵלֶיךָ וְהָיָה לְךָ וְלָהֶם לְאָכְלָֽה׃", "22": "וַיַּעַשׂ נֹחַ כְּכֹל אֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים כֵּן עָשָֽׂה׃"}, "lang": "hbo"}, "7": {"verses": {"1": "The LORD said to Noah, “You and your entire household come into the ark, for I have seen you as righteous before me in this generation.\n", "2": "From every clean beast you are to take for yourself seven pairs, male and female, and from the beast that is not clean you are to take two, male and female.\n", "3": "Likewise, from the birds of the sky—seven pairs, male and female, to keep alive a living seed on the surface of the whole earth.\n", "4": "For in seven more days I will rain on the earth for forty days and forty nights, and I will blot out every living thing I have made from the face of the ground.”\n", "5": "Noah did as the LORD had commanded him.\n", "6": "Noah was six hundred years old when the floodwaters came upon the earth.\n", "7": "Noah and his sons and his wife and his sons’ wives with him went into the ark because of the waters of the flood.\n", "8": "From the clean beast and the unclean beast, and from the birds and all that crawls on the ground,\n", "9": "two by two they came to Noah into the ark, male and female, as God had commanded Noah.\n", "10": "And it came to pass in the seventh day that the floodwaters were upon the earth.\n", "11": "In the six hundredth year of Noah’s life, in the second month, on the seventeenth day of the month—on that day all the fountains of the great deep burst forth, and the floodgates of the heavens were opened.\n", "12": "The rain was upon the earth for forty days and forty nights.\n", "13": "On that very day Noah and Shem and Ham and Japheth, Noah’s sons, and Noah’s wife and the three wives of his sons with them entered the ark,\n", "14": "they and every living creature by its kind, and all the beasts by their kind, and all the crawling things that crawl on the earth by their kind, and every bird by its kind, every winged bird.\n", "15": "They entered the ark with Noah, two by two of every kind of flesh in which there was breath of life.\n", "16": "Those entering were male and female of every kind of flesh, as God had commanded him. And the LORD shut him in.\n", "17": "The flood was upon the earth for forty days, and the waters increased and lifted up the ark and it rose above the earth.\n", "18": "The waters increased greatly, very greatly upon the earth, and the ark floated on the surface of the waters.\n", "19": "The waters increased so greatly that all the high mountains under the entire sky were covered.\n", "20": "The waters rose fifteen cubits over the mountains and covered them.\n", "21": "Every living thing that moved on the surface of the earth—birds, beasts, creeping things, and all the creatures that swarm on the earth, and every human being—\n", "22": "everything in whose nose was the breath of life, of all that was on dry land, perished.\n", "23": "He wiped out every living thing that was on the face of the earth—human and beast and creeping thing and birds of the sky—and they were blotted out from the earth. Only Noah was left, and those who were with him in the ark.\n", "24": "The waters prevailed on the earth for one hundred and fifty days.\n"}, "notes": "Notes\n- v. 20: \"fifteen cubits\" is a literal translation of \"חמשׁ עשרה אמה\", which is 15 cubits. This is a specific measurement, though some interpretations may equate it with \"fifteen feet\" or similar, depending on the cubit length assumed.\n- v. 21: \"everything in whose nose was the breath of life\" translates \"כֹּל אֲשֶׁר נִשְׁמַת־רוּחַ חַיִּים בְּאַפָּיו\" literally. The phrase \"in whose nose\" reflects the Hebrew idiom, not a literal anatomical location.\n- v. 24: \"one hundred and fifty days\" is a direct translation of \"חמשׁים וּמְאַת יוֹם\". Some manuscripts or traditions may render the number differently, but the text here is clear.", "src": {"1": "וַיֹּאמֶר יְהוָה לְנֹחַ בֹּֽא־אַתָּה וְכָל־בֵּיתְךָ אֶל־הַתֵּבָה כִּֽי־אֹתְךָ רָאִיתִי צַדִּיק לְפָנַי בַּדּוֹר הַזֶּֽה׃", "2": "מִכֹּל ׀ הַבְּהֵמָה הַטְּהוֹרָה תִּֽקַּח־לְךָ שִׁבְעָה שִׁבְעָה אִישׁ וְאִשְׁתּוֹ וּמִן־הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא שְׁנַיִם אִישׁ וְאִשְׁתּֽוֹ׃", "3": "גַּם מֵעוֹף הַשָּׁמַיִם שִׁבְעָה שִׁבְעָה זָכָר וּנְקֵבָה לְחַיּוֹת זֶרַע עַל־פְּנֵי כָל־הָאָֽרֶץ׃", "4": "כִּי לְיָמִים עוֹד שִׁבְעָה אָֽנֹכִי מַמְטִיר עַל־הָאָרֶץ אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה וּמָחִיתִי אֶֽת־כָּל־הַיְקוּם אֲשֶׁר עָשִׂיתִי מֵעַל פְּנֵי הָֽאֲדָמָֽה׃", "5": "וַיַּעַשׂ נֹחַ כְּכֹל אֲשֶׁר־צִוָּהוּ יְהוָֽה׃", "6": "וְנֹחַ בֶּן־שֵׁשׁ מֵאוֹת שָׁנָה וְהַמַּבּוּל הָיָה מַיִם עַל־הָאָֽרֶץ׃", "7": "וַיָּבֹא נֹחַ וּבָנָיו וְאִשְׁתּוֹ וּנְשֵֽׁי־בָנָיו אִתּוֹ אֶל־הַתֵּבָה מִפְּנֵי מֵי הַמַּבּֽוּל׃", "8": "מִן־הַבְּהֵמָה הַטְּהוֹרָה וּמִן־הַבְּהֵמָה אֲשֶׁר אֵינֶנָּה טְהֹרָה וּמִן־הָעוֹף וְכֹל אֲשֶׁר־רֹמֵשׂ עַל־הָֽאֲדָמָֽה׃", "9": "שְׁנַיִם שְׁנַיִם בָּאוּ אֶל־נֹחַ אֶל־הַתֵּבָה זָכָר וּנְקֵבָה כַּֽאֲשֶׁר צִוָּה אֱלֹהִים אֶת־נֹֽחַ׃", "10": "וַֽיְהִי לְשִׁבְעַת הַיָּמִים וּמֵי הַמַּבּוּל הָיוּ עַל־הָאָֽרֶץ׃", "11": "בִּשְׁנַת שֵׁשׁ־מֵאוֹת שָׁנָה לְחַיֵּי־נֹחַ בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָֽה־עָשָׂר יוֹם לַחֹדֶשׁ בַּיּוֹם הַזֶּה נִבְקְעוּ כָּֽל־מַעְיְנֹת תְּהוֹם רַבָּה וַאֲרֻבֹּת הַשָּׁמַיִם נִפְתָּֽחוּ׃", "12": "וַֽיְהִי הַגֶּשֶׁם עַל־הָאָרֶץ אַרְבָּעִים יוֹם וְאַרְבָּעִים לָֽיְלָה׃", "13": "בְּעֶצֶם הַיּוֹם הַזֶּה בָּא נֹחַ וְשֵׁם־וְחָם וָיֶפֶת בְּנֵי־נֹחַ וְאֵשֶׁת נֹחַ וּשְׁלֹשֶׁת נְשֵֽׁי־בָנָיו אִתָּם אֶל־הַתֵּבָֽה׃", "14": "הֵמָּה וְכָל־הַֽחַיָּה לְמִינָהּ וְכָל־הַבְּהֵמָה לְמִינָהּ וְכָל־הָרֶמֶשׂ הָרֹמֵשׂ עַל־הָאָרֶץ לְמִינֵהוּ וְכָל־הָעוֹף לְמִינֵהוּ כֹּל צִפּוֹר כָּל־כָּנָֽף׃", "15": "וַיָּבֹאוּ אֶל־נֹחַ אֶל־הַתֵּבָה שְׁנַיִם שְׁנַיִם מִכָּל־הַבָּשָׂר אֲשֶׁר־בּוֹ רוּחַ חַיִּֽים׃", "16": "וְהַבָּאִים זָכָר וּנְקֵבָה מִכָּל־בָּשָׂר בָּאוּ כַּֽאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים וַיִּסְגֹּר יְהוָה בַּֽעֲדֽוֹ׃", "17": "וַֽיְהִי הַמַּבּוּל אַרְבָּעִים יוֹם עַל־הָאָרֶץ וַיִּרְבּוּ הַמַּיִם וַיִּשְׂאוּ אֶת־הַתֵּבָה וַתָּרָם מֵעַל הָאָֽרֶץ׃", "18": "וַיִּגְבְּרוּ הַמַּיִם וַיִּרְבּוּ מְאֹד עַל־הָאָרֶץ וַתֵּלֶךְ הַתֵּבָה עַל־פְּנֵי הַמָּֽיִם׃", "19": "וְהַמַּיִם גָּֽבְרוּ מְאֹד מְאֹד עַל־הָאָרֶץ וַיְכֻסּוּ כָּל־הֶֽהָרִים הַגְּבֹהִים אֲשֶׁר־תַּחַת כָּל־הַשָּׁמָֽיִם׃", "20": "חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה גָּבְרוּ הַמָּיִם וַיְכֻסּוּ הֶהָרִֽים׃", "21": "וַיִּגְוַע כָּל־בָּשָׂר ׀ הָרֹמֵשׂ עַל־הָאָרֶץ בָּעוֹף וּבַבְּהֵמָה וּבַחַיָּה וּבְכָל־הַשֶּׁרֶץ הַשֹּׁרֵץ עַל־הָאָרֶץ וְכֹל הָאָדָֽם׃", "22": "כֹּל אֲשֶׁר נִשְׁמַת־רוּחַ חַיִּים בְּאַפָּיו מִכֹּל אֲשֶׁר בֶּחָֽרָבָה מֵֽתוּ׃", "23": "וַיִּמַח אֶֽת־כָּל־הַיְקוּם ׀ אֲשֶׁר ׀ עַל־פְּנֵי הָֽאֲדָמָה מֵאָדָם עַד־בְּהֵמָה עַד־רֶמֶשׂ וְעַד־עוֹף הַשָּׁמַיִם וַיִּמָּחוּ מִן־הָאָרֶץ וַיִשָּׁאֶר אַךְ־נֹחַ וַֽאֲשֶׁר אִתּוֹ בַּתֵּבָֽה׃", "24": "וַיִּגְבְּרוּ הַמַּיִם עַל־הָאָרֶץ חֲמִשִּׁים וּמְאַת יֽוֹם׃"}, "lang": "hbo"}, "8": {"verses": {"1": "God remembered Noah and all the living creatures and every beast that were with him in the ark. God caused a wind to pass over the earth, and the waters subsided.\n", "2": "The fountains of the deep were sealed, and the floodgates of the heavens were closed. The rain ceased from the sky.\n", "3": "The waters receded gradually from the earth, going back and forth, until the end of one hundred and fifty days.\n", "4": "The ark came to rest in the seventh month, on the seventeenth day of the month, on the mountains of Ararat.\n", "5": "The waters continued to decrease until the tenth month. On the first day of the tenth month the tops of the mountains became visible.\n", "6": "It came to pass at the end of forty days that Noah opened the window of the ark he had made.\n", "7": "He sent out the raven, which went back and forth until the waters had dried up from the earth.\n", "8": "Then he sent out the dove from himself to see if the waters had receded from the surface of the land.\n", "9": "But the dove found no resting place for the sole of its foot, so it returned to him into the ark, for water was still on the surface of all the earth. Noah stretched out his hand, took the dove, and brought it back to him into the ark.\n", "10": "He waited another seven days, and again sent out the dove from the ark.\n", "11": "The dove came back to him in the evening, and there was an olive leaf torn off in its beak. Then Noah knew that the waters had receded from the earth.\n", "12": "He waited another seven days, and again sent out the dove. This time it did not return to him anymore.\n", "13": "In the six hundredth and first year, in the first month, on the first day of the month, the waters had dried up from the earth. Noah removed the covering of the ark and looked, and saw that the surface of the land had dried up.\n", "14": "In the second month, on the twenty-seventh day of the month, the land had dried.\n", "15": "Then God spoke to Noah, saying:\n", "16": "“Come out of the ark—you, your wife, your sons, and your sons’ wives with you.\n", "17": "Every living creature that is with you, every flesh of bird, beast, and all creeping things that crawl on the earth, let them come out with you, and they shall multiply and fill the earth.”\n", "18": "So Noah came out, along with his sons and his wife, and his sons’ wives with him.\n", "19": "Every living creature, every creeping thing, and every bird—all that moved on the earth—came out from the ark in their families.\n", "20": "Noah built an altar to the LORD, and took from all the clean cattle and from all the clean birds, and offered burnt offerings on the altar.\n", "21": "The LORD smelled the pleasing aroma, and in his heart he said, “I will never again curse the ground because of humanity, for the inclination of the human heart is evil from youth. I will never again strike down every living thing as I have done.”\n", "22": "While the earth remains, seedtime and harvest, cold and heat, summer and winter, day and night will not cease.\n"}, "notes": "Notes\n- v. 1: \"Remembered\" is a poetic anthropomorphism for acting with covenantal faithfulness.\n- v. 21: \"In his heart he said\" reflects the narrative voice describing God's internal resolve; this is not a direct quote.\n- v. 22: \"While the earth remains\" reflects the Hebrew phrase le-olam ad, often used to express a perpetual covenant.", "src": {"1": "וַיִּזְכֹּר אֱלֹהִים אֶת־נֹחַ וְאֵת כָּל־הַֽחַיָּה וְאֶת־כָּל־הַבְּהֵמָה אֲשֶׁר אִתּוֹ בַּתֵּבָה וַיַּעֲבֵר אֱלֹהִים רוּחַ עַל־הָאָרֶץ וַיָּשֹׁכּוּ הַמָּֽיִם׃", "2": "וַיִּסָּֽכְרוּ מַעְיְנֹת תְּהוֹם וַֽאֲרֻבֹּת הַשָּׁמָיִם וַיִּכָּלֵא הַגֶּשֶׁם מִן־הַשָּׁמָֽיִם׃", "3": "וַיָּשֻׁבוּ הַמַּיִם מֵעַל הָאָרֶץ הָלוֹךְ וָשׁוֹב וַיַּחְסְרוּ הַמַּיִם מִקְצֵה חֲמִשִּׁים וּמְאַת יֽוֹם׃", "4": "וַתָּנַח הַתֵּבָה בַּחֹדֶשׁ הַשְּׁבִיעִי בְּשִׁבְעָה־עָשָׂר יוֹם לַחֹדֶשׁ עַל הָרֵי אֲרָרָֽט׃", "5": "וְהַמַּיִם הָיוּ הָלוֹךְ וְחָסוֹר עַד הַחֹדֶשׁ הָֽעֲשִׂירִי בָּֽעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ נִרְאוּ רָאשֵׁי הֶֽהָרִֽים׃", "6": "וַֽיְהִי מִקֵּץ אַרְבָּעִים יוֹם וַיִּפְתַּח נֹחַ אֶת־חַלּוֹן הַתֵּבָה אֲשֶׁר עָשָֽׂה׃", "7": "וַיְשַׁלַּח אֶת־הָֽעֹרֵב וַיֵּצֵא יָצוֹא וָשׁוֹב עַד־יְבֹשֶׁת הַמַּיִם מֵעַל הָאָֽרֶץ׃", "8": "וַיְשַׁלַּח אֶת־הַיּוֹנָה מֵאִתּוֹ לִרְאוֹת הֲקַלּוּ הַמַּיִם מֵעַל פְּנֵי הָֽאֲדָמָֽה׃", "9": "וְלֹֽא־מָצְאָה הַיּוֹנָה מָנוֹחַ לְכַף־רַגְלָהּ וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה כִּי־מַיִם עַל־פְּנֵי כָל־הָאָרֶץ וַיִּשְׁלַח יָדוֹ וַיִּקָּחֶהָ וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָֽה׃", "10": "וַיָּחֶל עוֹד שִׁבְעַת יָמִים אֲחֵרִים וַיֹּסֶף שַׁלַּח אֶת־הַיּוֹנָה מִן־הַתֵּבָֽה׃", "11": "וַתָּבֹא אֵלָיו הַיּוֹנָה לְעֵת עֶרֶב וְהִנֵּה עֲלֵה־זַיִת טָרָף בְּפִיהָ וַיֵּדַע נֹחַ כִּי־קַלּוּ הַמַּיִם מֵעַל הָאָֽרֶץ׃", "12": "וַיִּיָּחֶל עוֹד שִׁבְעַת יָמִים אֲחֵרִים וַיְשַׁלַּח אֶת־הַיּוֹנָה וְלֹֽא־יָסְפָה שׁוּב־אֵלָיו עֽוֹד׃", "13": "וַֽיְהִי בְּאַחַת וְשֵׁשׁ־מֵאוֹת שָׁנָה בָּֽרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ חָֽרְבוּ הַמַּיִם מֵעַל הָאָרֶץ וַיָּסַר נֹחַ אֶת־מִכְסֵה הַתֵּבָה וַיַּרְא וְהִנֵּה חָֽרְבוּ פְּנֵי הָֽאֲדָמָֽה׃", "14": "וּבַחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ יָבְשָׁה הָאָֽרֶץ׃", "15": "וַיְדַבֵּר אֱלֹהִים אֶל־נֹחַ לֵאמֹֽר׃", "16": "צֵא מִן־הַתֵּבָה אַתָּה וְאִשְׁתְּךָ וּבָנֶיךָ וּנְשֵֽׁי־בָנֶיךָ אִתָּֽךְ׃", "17": "כָּל־הַחַיָּה אֲשֶֽׁר־אִתְּךָ מִכָּל־בָּשָׂר בָּעוֹף וּבַבְּהֵמָה וּבְכָל־הָרֶמֶשׂ הָרֹמֵשׂ עַל־הָאָרֶץ הַיְצֵא אִתָּךְ וְשָֽׁרְצוּ בָאָרֶץ וּפָרוּ וְרָבוּ עַל־הָאָֽרֶץ׃", "18": "וַיֵּצֵא־נֹחַ וּבָנָיו וְאִשְׁתּוֹ וּנְשֵֽׁי־בָנָיו אִתּֽוֹ׃", "19": "כָּל־הַֽחַיָּה כָּל־הָרֶמֶשׂ וְכָל־הָעוֹף כֹּל רוֹמֵשׂ עַל־הָאָרֶץ לְמִשְׁפְּחֹתֵיהֶם יָצְאוּ מִן־הַתֵּבָֽה׃", "20": "וַיִּבֶן נֹחַ מִזְבֵּחַ לַֽיהוָה וַיִּקַּח מִכֹּל ׀ הַבְּהֵמָה הַטְּהוֹרָה וּמִכֹּל הָעוֹף הַטָּהֹר וַיַּעַל עֹלֹת בַּמִּזְבֵּֽחַ׃", "21": "וַיָּרַח יְהוָה אֶת־רֵיחַ הַנִּיחֹחַ וַיֹּאמֶר יְהוָה אֶל־לִבּוֹ לֹֽא־אֹסִף לְקַלֵּל עוֹד אֶת־הָֽאֲדָמָה בַּעֲבוּר הָֽאָדָם כִּי יֵצֶר לֵב הָאָדָם רַע מִנְּעֻרָיו וְלֹֽא־אֹסִף עוֹד לְהַכּוֹת אֶת־כָּל־חַי כַּֽאֲשֶׁר עָשִֽׂיתִי׃", "22": "עֹד כָּל־יְמֵי הָאָרֶץ זֶרַע וְקָצִיר וְקֹר וָחֹם וְקַיִץ וָחֹרֶף וְיוֹם וָלַיְלָה לֹא יִשְׁבֹּֽתוּ׃"}, "lang": "hbo"}, "9": {"verses": {"1": "God blessed Noah and his sons, saying to them, “Be fertile, multiply, and fill the earth.\n", "2": "The fear of you and the dread of you will be upon every living beast of the earth, and upon every bird of the sky, upon everything that moves along the ground, and upon all the fish of the sea; they are given into your hand.\n", "3": "Every creature that moves and lives shall be yours for food, as I gave you the green plants.\n", "4": "But you must not eat flesh with its life—its blood—in it.\n", "5": "For your own lives, your blood I will demand an accounting. From the hand of every beast I will demand it, and from the hand of humans, from the hand of each man’s brother, I will demand the life of a human.\n", "6": "Whoever sheds the blood of a human, by a human shall their blood be shed, for in the image of God, God made the human.\n", "7": "And you, be fertile, multiply, and fill the earth, and dominate it.\n", "8": "Then God spoke to Noah and to his sons with him, saying:\n", "9": "“I am establishing my covenant with you and with your descendants after you,\n", "10": "and with every living creature that is with you: the birds, the domestic animals, and every wild beast that is with you, all that came out of the ark, all creatures on the earth.\n", "11": "I will establish my covenant with you, and never again will all flesh be cut off by the waters of the flood, and there will never again be a flood to destroy the earth.”\n", "12": "God said, “This is the sign of the covenant I am making between me and you and every living creature with you, for all generations to come:\n", "13": "I have placed my bow in the clouds, and it shall be a sign of the covenant between me and the earth.\n", "14": "When I bring clouds over the earth, and the bow appears in the clouds,\n", "15": "I will remember the covenant I made between me and you and every living creature of all flesh, and the waters shall never again become a flood to destroy every living creature.\n", "16": "The bow shall be in the clouds, and I will see it to remember the eternal covenant between God and every living creature of all flesh on the earth.”\n", "17": "God said to Noah, “This is the sign of the covenant I have established between me and every living creature on the earth.”\n", "18": "The sons of Noah who went out from the ark were Shem, Ham, and Japheth. Ham was the father of Canaan.\n", "19": "These three were the sons of Noah, and from them the whole earth was dispersed.\n", "20": "Noah, a man of the soil, planted a vineyard.\n", "21": "He drank of the wine, became drunk, and lay uncovered in his tent.\n", "22": "Ham, the father of Canaan, saw the nakedness of his father and told his two brothers outside.\n", "23": "But Shem and Japheth took a garment and laid it on both their shoulders, and walked in reverse to cover their father’s nakedness. Their faces were turned backward, and they did not see their father’s nakedness.\n", "24": "When Noah awoke from his wine, he learned what his youngest son had done to him.\n", "25": "He said, “Cursed be Canaan; a slave of slaves he shall be to his brothers.”\n", "26": "He said, “Blessed be the Lord, the God of Shem, and let Canaan be a slave to them.”\n", "27": "“May God enlarge Japheth, and may he dwell in the tents of Shem; and let Canaan be a slave to them.”\n", "28": "Noah lived for 350 years after the flood.\n", "29": "The total length of Noah’s life was 950 years, and he died.\n"}, "notes": "Notes\n- v. 4: The phrase \"in its life\" (בְּנַפְשׁוֹ) reflects the Hebrew's use of \"nephesh\" for \"life\" rather than \"soul.\"\n- v. 27: \"Japheth\" is a proper name, and the poetic structure of v. 27 is preserved, with the repetition of \"Canaan be a slave to them.\"\n- v. 28–29: The phrase \"lived for\" (וַֽיְחִי) is used to distinguish the time after the flood from the full length of his life.", "src": {"1": "וַיְבָרֶךְ אֱלֹהִים אֶת־נֹחַ וְאֶת־בָּנָיו וַיֹּאמֶר לָהֶם פְּרוּ וּרְבוּ וּמִלְאוּ אֶת־הָאָֽרֶץ׃", "2": "וּמוֹרַאֲכֶם וְחִתְּכֶם יִֽהְיֶה עַל כָּל־חַיַּת הָאָרֶץ וְעַל כָּל־עוֹף הַשָּׁמָיִם בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָֽאֲדָמָה וּֽבְכָל־דְּגֵי הַיָּם בְּיֶדְכֶם נִתָּֽנוּ׃", "3": "כָּל־רֶמֶשׂ אֲשֶׁר הוּא־חַי לָכֶם יִהְיֶה לְאָכְלָה כְּיֶרֶק עֵשֶׂב נָתַתִּי לָכֶם אֶת־כֹּֽל׃", "4": "אַךְ־בָּשָׂר בְּנַפְשׁוֹ דָמוֹ לֹא תֹאכֵֽלוּ׃", "5": "וְאַךְ אֶת־דִּמְכֶם לְנַפְשֹֽׁתֵיכֶם אֶדְרֹשׁ מִיַּד כָּל־חַיָּה אֶדְרְשֶׁנּוּ וּמִיַּד הָֽאָדָם מִיַּד אִישׁ אָחִיו אֶדְרֹשׁ אֶת־נֶפֶשׁ הָֽאָדָֽם׃", "6": "שֹׁפֵךְ דַּם הָֽאָדָם בָּֽאָדָם דָּמוֹ יִשָּׁפֵךְ כִּי בְּצֶלֶם אֱלֹהִים עָשָׂה אֶת־הָאָדָֽם׃", "7": "וְאַתֶּם פְּרוּ וּרְבוּ שִׁרְצוּ בָאָרֶץ וּרְבוּ־בָֽהּ׃", "8": "וַיֹּאמֶר אֱלֹהִים אֶל־נֹחַ וְאֶל־בָּנָיו אִתּוֹ לֵאמֹֽר׃", "9": "וַאֲנִי הִנְנִי מֵקִים אֶת־בְּרִיתִי אִתְּכֶם וְאֶֽת־זַרְעֲכֶם אַֽחֲרֵיכֶֽם׃", "10": "וְאֵת כָּל־נֶפֶשׁ הַֽחַיָּה אֲשֶׁר אִתְּכֶם בָּעוֹף בַּבְּהֵמָה וּֽבְכָל־חַיַּת הָאָרֶץ אִתְּכֶם מִכֹּל יֹצְאֵי הַתֵּבָה לְכֹל חַיַּת הָאָֽרֶץ׃", "11": "וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתְּכֶם וְלֹֽא־יִכָּרֵת כָּל־בָּשָׂר עוֹד מִמֵּי הַמַּבּוּל וְלֹֽא־יִהְיֶה עוֹד מַבּוּל לְשַׁחֵת הָאָֽרֶץ׃", "12": "וַיֹּאמֶר אֱלֹהִים זֹאת אֽוֹת־הַבְּרִית אֲשֶׁר־אֲנִי נֹתֵן בֵּינִי וּבֵינֵיכֶם וּבֵין כָּל־נֶפֶשׁ חַיָּה אֲשֶׁר אִתְּכֶם לְדֹרֹת עוֹלָֽם׃", "13": "אֶת־קַשְׁתִּי נָתַתִּי בֶּֽעָנָן וְהָֽיְתָה לְאוֹת בְּרִית בֵּינִי וּבֵין הָאָֽרֶץ׃", "14": "וְהָיָה בְּעַֽנְנִי עָנָן עַל־הָאָרֶץ וְנִרְאֲתָה הַקֶּשֶׁת בֶּעָנָֽן׃", "15": "וְזָכַרְתִּי אֶת־בְּרִיתִי אֲשֶׁר בֵּינִי וּבֵינֵיכֶם וּבֵין כָּל־נֶפֶשׁ חַיָּה בְּכָל־בָּשָׂר וְלֹֽא־יִֽהְיֶה עוֹד הַמַּיִם לְמַבּוּל לְשַׁחֵת כָּל־בָּשָֽׂר׃", "16": "וְהָיְתָה הַקֶּשֶׁת בֶּֽעָנָן וּרְאִיתִיהָ לִזְכֹּר בְּרִית עוֹלָם בֵּין אֱלֹהִים וּבֵין כָּל־נֶפֶשׁ חַיָּה בְּכָל־בָּשָׂר אֲשֶׁר עַל־הָאָֽרֶץ׃", "17": "וַיֹּאמֶר אֱלֹהִים אֶל־נֹחַ זֹאת אֽוֹת־הַבְּרִית אֲשֶׁר הֲקִמֹתִי בֵּינִי וּבֵין כָּל־בָּשָׂר אֲשֶׁר עַל־הָאָֽרֶץ׃", "18": "וַיִּֽהְיוּ בְנֵי־נֹחַ הַיֹּֽצְאִים מִן־הַתֵּבָה שֵׁם וְחָם וָיָפֶת וְחָם הוּא אֲבִי כְנָֽעַן׃", "19": "שְׁלֹשָׁה אֵלֶּה בְּנֵי־נֹחַ וּמֵאֵלֶּה נָֽפְצָה כָל־הָאָֽרֶץ׃", "20": "וַיָּחֶל נֹחַ אִישׁ הָֽאֲדָמָה וַיִּטַּע כָּֽרֶם׃", "21": "וַיֵּשְׁתְּ מִן־הַיַּיִן וַיִּשְׁכָּר וַיִּתְגַּל בְּתוֹךְ אָהֳלֹֽה׃", "22": "וַיַּרְא חָם אֲבִי כְנַעַן אֵת עֶרְוַת אָבִיו וַיַּגֵּד לִשְׁנֵֽי־אֶחָיו בַּחֽוּץ׃", "23": "וַיִּקַּח שֵׁם וָיֶפֶת אֶת־הַשִּׂמְלָה וַיָּשִׂימוּ עַל־שְׁכֶם שְׁנֵיהֶם וַיֵּֽלְכוּ אֲחֹרַנִּית וַיְכַסּוּ אֵת עֶרְוַת אֲבִיהֶם וּפְנֵיהֶם אֲחֹרַנִּית וְעֶרְוַת אֲבִיהֶם לֹא רָאֽוּ׃", "24": "וַיִּיקֶץ נֹחַ מִיֵּינוֹ וַיֵּדַע אֵת אֲשֶׁר־עָשָׂה־לוֹ בְּנוֹ הַקָּטָֽן׃", "25": "וַיֹּאמֶר אָרוּר כְּנָעַן עֶבֶד עֲבָדִים יִֽהְיֶה לְאֶחָֽיו׃", "26": "וַיֹּאמֶר בָּרוּךְ יְהֹוָה אֱלֹהֵי שֵׁם וִיהִי כְנַעַן עֶבֶד לָֽמוֹ׃", "27": "יַפְתְּ אֱלֹהִים לְיֶפֶת וְיִשְׁכֹּן בְּאָֽהֳלֵי־שֵׁם וִיהִי כְנַעַן עֶבֶד לָֽמוֹ׃", "28": "וַֽיְחִי־נֹחַ אַחַר הַמַּבּוּל שְׁלֹשׁ מֵאוֹת שָׁנָה וַֽחֲמִשִּׁים שָׁנָֽה׃", "29": "וַיִּֽהְיוּ כָּל־יְמֵי־נֹחַ תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה וַיָּמֹֽת׃"}, "lang": "hbo"}, "10": {"verses": {"1": "These are the descendants of the sons of Noah: Shem, Ham, and Japheth. They each had sons after the flood.\n", "2": "The sons of Japheth were Gomer, Magog, Madai, Javan, Tubal, Meshech, and Tiras.\n", "3": "The sons of Gomer were Ashkenaz, Riphath, and Togarmah.\n", "4": "The sons of Javan were Elishah, Tarshish, Kittim, and Dodanim.\n", "5": "From these the island-dwelling nations separated, each to their own lands, by their language, in their families, by their nations.\n", "6": "The sons of Ham were Cush, Egypt, Put, and Canaan.\n", "7": "The sons of Cush were Seba, Havilah, Sabtah, Raamah, and Sabteca. The sons of Raamah were Sheba and Dedan.\n", "8": "Cush fathered Nimrod, who became a mighty man on the earth.\n", "9": "He was a mighty hunter before the LORD. That is why it is said, “Like Nimrod, a mighty hunter before the LORD.”\n", "10": "The beginning of his kingdom was Babel, Erech, Accad, and Calneh, in the land of Shinar.\n", "11": "From that land, Assyria went out and built Nineveh, Rehoboth-Ir, and Calah.\n", "12": "And Resen, between Nineveh and Calah—that is the great city.\n", "13": "The sons of Egypt were Ludim, Anamim, Lehabim, Naphthuhim,\n", "14": "Pathrusim, Casluhim (from whom the Philistines came), and Caphtorim.\n", "15": "Canaan fathered Sidon his firstborn, and Heth,\n", "16": "and the Jebusites, the Amorites, and the Girgashites,\n", "17": "the Hivites, the Arkites, and the Sinites,\n", "18": "the Arvadites, the Zemarites, and the Hamathites. Later, the clans of the Canaanites dispersed.\n", "19": "The boundary of the Canaanites extended from Sidon as far as Gerar, to Gaza, as far as Sodom and Gomorrah, Admah and Zeboiim, as far as Lasha.\n", "20": "These are the sons of Ham, by their families, by their languages, in their lands, by their nations.\n", "21": "Shem, too, had sons born to him, and he became the father of all the sons of Eber, the older brother of Japheth.\n", "22": "The sons of Shem were Elam, Asshur, Arpachshad, Lud, and Aram.\n", "23": "The sons of Aram were Uz, Hul, Gether, and Mash.\n", "24": "Arpachshad fathered Shelah, and Shelah fathered Eber.\n", "25": "To Eber were born two sons. The name of one was Peleg, for in his time the earth was divided. His brother’s name was Joktan.\n", "26": "Joktan fathered Almodad, Sheleph, Hazarmaveth, Jerah,\n", "27": "Hadoram, Uzal, Diklah,\n", "28": "Obal, Abimael, and Sheba,\n", "29": "Ofir, Havilah, and Jobab. All these were the sons of Joktan.\n", "30": "Their settlements extended from Mesha as far as Sephar, the mountain east of the desert.\n", "31": "These are the sons of Shem, by their families, by their languages, in their lands, by their nations.\n", "32": "These are the families of the sons of Noah, by their generations, by their nations. From these the nations dispersed on the earth after the flood.\n"}, "notes": "Notes\n- v. 5: \"island-dwelling nations\" reflects \"אִיֵּי הַגּוֹיִם\" (islands of the nations), referring to seafaring or coastal peoples.\n- v. 9: \"before the LORD\" is likely metaphorical, referring to being recognized or feared by people rather than a divine favor.\n- v. 15: \"Canaan fathered Sidon his firstborn\" — \"firstborn\" is added for clarity, though Hebrew does not use the word for \"firstborn\" (בְּכֹר) here; it is implied.\n- v. 25: \"Peleg\" is interpreted as meaning \"division,\" and the phrase \"in his time the earth was divided\" reflects the naming rationale in context.\n- v. 30: \"mountain east of the desert\" is a contextual rendering of \"הַקֶּֽדֶם\" (the East), referring to the general region east of the Arabian desert.", "src": {"1": "וְאֵלֶּה תּוֹלְדֹת בְּנֵי־נֹחַ שֵׁם חָם וָיָפֶת וַיִּוָּלְדוּ לָהֶם בָּנִים אַחַר הַמַּבּֽוּל׃", "2": "בְּנֵי יֶפֶת גֹּמֶר וּמָגוֹג וּמָדַי וְיָוָן וְתֻבָל וּמֶשֶׁךְ וְתִירָֽס׃", "3": "וּבְנֵי גֹּמֶר אַשְׁכֲּנַז וְרִיפַת וְתֹגַרְמָֽה׃", "4": "וּבְנֵי יָוָן אֱלִישָׁה וְתַרְשִׁישׁ כִּתִּים וְדֹדָנִֽים׃", "5": "מֵאֵלֶּה נִפְרְדוּ אִיֵּי הַגּוֹיִם בְּאַרְצֹתָם אִישׁ לִלְשֹׁנוֹ לְמִשְׁפְּחֹתָם בְּגוֹיֵהֶֽם׃", "6": "וּבְנֵי חָם כּוּשׁ וּמִצְרַיִם וּפוּט וּכְנָֽעַן׃", "7": "וּבְנֵי כוּשׁ סְבָא וַֽחֲוִילָה וְסַבְתָּה וְרַעְמָה וְסַבְתְּכָא וּבְנֵי רַעְמָה שְׁבָא וּדְדָֽן׃", "8": "וְכוּשׁ יָלַד אֶת־נִמְרֹד הוּא הֵחֵל לִֽהְיוֹת גִּבֹּר בָּאָֽרֶץ׃", "9": "הֽוּא־הָיָה גִבֹּֽר־צַיִד לִפְנֵי יְהוָה עַל־כֵּן יֵֽאָמַר כְּנִמְרֹד גִּבּוֹר צַיִד לִפְנֵי יְהוָֽה׃", "10": "וַתְּהִי רֵאשִׁית מַמְלַכְתּוֹ בָּבֶל וְאֶרֶךְ וְאַכַּד וְכַלְנֵה בְּאֶרֶץ שִׁנְעָֽר׃", "11": "מִן־הָאָרֶץ הַהִוא יָצָא אַשּׁוּר וַיִּבֶן אֶת־נִינְוֵה וְאֶת־רְחֹבֹת עִיר וְאֶת־כָּֽלַח׃", "12": "וְֽאֶת־רֶסֶן בֵּין נִֽינְוֵה וּבֵין כָּלַח הִוא הָעִיר הַגְּדֹלָֽה׃", "13": "וּמִצְרַיִם יָלַד אֶת־לוּדִים וְאֶת־עֲנָמִים וְאֶת־לְהָבִים וְאֶת־נַפְתֻּחִֽים׃", "14": "וְֽאֶת־פַּתְרֻסִים וְאֶת־כַּסְלֻחִים אֲשֶׁר יָצְאוּ מִשָּׁם פְּלִשְׁתִּים וְאֶת־כַּפְתֹּרִֽים׃", "15": "וּכְנַעַן יָלַד אֶת־צִידֹן בְּכֹרוֹ וְאֶת־חֵֽת׃", "16": "וְאֶת־הַיְבוּסִי וְאֶת־הָאֱמֹרִי וְאֵת הַגִּרְגָּשִֽׁי׃", "17": "וְאֶת־הַֽחִוִּי וְאֶת־הַֽעַרְקִי וְאֶת־הַסִּינִֽי׃", "18": "וְאֶת־הָֽאַרְוָדִי וְאֶת־הַצְּמָרִי וְאֶת־הַֽחֲמָתִי וְאַחַר נָפֹצוּ מִשְׁפְּחוֹת הַֽכְּנַעֲנִֽי׃", "19": "וַֽיְהִי גְּבוּל הַֽכְּנַעֲנִי מִצִּידֹן בֹּאֲכָה גְרָרָה עַד־עַזָּה בֹּאֲכָה סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם עַד־לָֽשַׁע׃", "20": "אֵלֶּה בְנֵי־חָם לְמִשְׁפְּחֹתָם לִלְשֹֽׁנֹתָם בְּאַרְצֹתָם בְּגוֹיֵהֶֽם׃", "21": "וּלְשֵׁם יֻלַּד גַּם־הוּא אֲבִי כָּל־בְּנֵי־עֵבֶר אֲחִי יֶפֶת הַגָּדֽוֹל׃", "22": "בְּנֵי שֵׁם עֵילָם וְאַשּׁוּר וְאַרְפַּכְשַׁד וְלוּד וַֽאֲרָֽם׃", "23": "וּבְנֵי אֲרָם עוּץ וְחוּל וְגֶתֶר וָמַֽשׁ׃", "24": "וְאַרְפַּכְשַׁד יָלַד אֶת־שָׁלַח וְשֶׁלַח יָלַד אֶת־עֵֽבֶר׃", "25": "וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים שֵׁם הָֽאֶחָד פֶּלֶג כִּי בְיָמָיו נִפְלְגָה הָאָרֶץ וְשֵׁם אָחִיו יָקְטָֽן׃", "26": "וְיָקְטָן יָלַד אֶת־אַלְמוֹדָד וְאֶת־שָׁלֶף וְאֶת־חֲצַרְמָוֶת וְאֶת־יָֽרַח׃", "27": "וְאֶת־הֲדוֹרָם וְאֶת־אוּזָל וְאֶת־דִּקְלָֽה׃", "28": "וְאֶת־עוֹבָל וְאֶת־אֲבִֽימָאֵל וְאֶת־שְׁבָֽא׃", "29": "וְאֶת־אוֹפִר וְאֶת־חֲוִילָה וְאֶת־יוֹבָב כָּל־אֵלֶּה בְּנֵי יָקְטָֽן׃", "30": "וַֽיְהִי מוֹשָׁבָם מִמֵּשָׁא בֹּאֲכָה סְפָרָה הַר הַקֶּֽדֶם׃", "31": "אֵלֶּה בְנֵי־שֵׁם לְמִשְׁפְּחֹתָם לִלְשֹׁנֹתָם בְּאַרְצֹתָם לְגוֹיֵהֶֽם׃", "32": "אֵלֶּה מִשְׁפְּחֹת בְּנֵי־נֹחַ לְתוֹלְדֹתָם בְּגוֹיֵהֶם וּמֵאֵלֶּה נִפְרְדוּ הַגּוֹיִם בָּאָרֶץ אַחַר הַמַּבּֽוּל׃"}, "lang": "hbo"}, "11": {"verses": {"1": "Now the whole earth had one language and the same words.\n", "2": "As they traveled eastward, they found a plain in the land of Shinar and settled there.\n", "3": "They said to one another, \"Come, let us make bricks and burn them thoroughly.\" The brick became their stone and the clay their mortar.\n", "4": "They said, \"Come, let us build a city and a tower with its top in the heavens, and let us make a name for ourselves, lest we be scattered over the face of the whole earth.\"\n", "5": "The LORD came down to see the city and the tower that the people of the earth had built.\n", "6": "And the LORD said, \"Indeed, they are one people and they all have one language, and this is only the beginning of what they will do. Now nothing they propose to do will be impossible for them.\n", "7": "Come, let us go down and confuse their language, so that they cannot understand one another's speech.\"\n", "8": "So the LORD scattered them from there over the face of the whole earth, and they ceased to build the city.\n", "9": "Therefore the name of it was called Babel, because there the LORD confused the language of the whole earth, and from there the LORD scattered them over the face of the whole earth.\n", "10": "These are the generations of Shem. Shem was a hundred years old when he fathered Arpachshad two years after the flood.\n", "11": "Shem lived after fathering Arpachshad five hundred years and had other sons and daughters.\n", "12": "Arpachshad lived thirty-five years and fathered Shelah.\n", "13": "Arpachshad lived after fathering Shelah four hundred and three years and had other sons and daughters.\n", "14": "Shelah lived thirty years and fathered Eber.\n", "15": "Shelah lived after fathering Eber four hundred and three years and had other sons and daughters.\n", "16": "Eber lived thirty-four years and fathered Peleg.\n", "17": "Eber lived after fathering Peleg four hundred and thirty years and had other sons and daughters.\n", "18": "Peleg lived thirty years and fathered Reu.\n", "19": "Peleg lived after fathering Reu two hundred and nine years and had other sons and daughters.\n", "20": "Reu lived thirty-two years and fathered Serug.\n", "21": "Reu lived after fathering Serug two hundred and seven years and had other sons and daughters.\n", "22": "Serug lived thirty years and fathered Nahor.\n", "23": "Serug lived after fathering Nahor two hundred years and had other sons and daughters.\n", "24": "Nahor lived twenty-nine years and fathered Terah.\n", "25": "Nahor lived after fathering Terah nineteen years and one hundred years and had other sons and daughters.\n", "26": "Terah lived seventy years and fathered Abram, Nahor, and Haran.\n", "27": "These are the generations of Terah. Terah fathered Abram, Nahor, and Haran. Haran fathered Lot.\n", "28": "Haran died in the presence of his father Terah in the land of his birth, in Ur of the Chaldeans.\n", "29": "Abram and Nahor took wives. The name of Abram’s wife was Sarai, and the name of Nahor’s wife was Milcah, daughter of Haran, the father of Milcah and also the father of Iscah.\n", "30": "Sarai was barren; she had no child.\n", "31": "Terah took Abram his son, and Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they went out together from Ur of the Chaldeans to go to the land of Canaan. They arrived at Haran and settled there.\n", "32": "The years of Terah were two hundred and five years, and Terah died in Haran.\n"}, "notes": "Notes\n- v. 9: \"Babel\" is a transliteration of the Hebrew word בָּבֶל, which plays on the verb בָּלַל (to confuse/mingle), as noted in the text. The name is explained as a reference to the confusion of language.\n- v. 31: \"Ur of the Chaldeans\" is a direct translation of אוּר כַּשְׂדִּים, with \"Chaldeans\" used to correspond to the historical term.", "src": {"1": "וַֽיְהִי כָל־הָאָרֶץ שָׂפָה אֶחָת וּדְבָרִים אֲחָדִֽים׃", "2": "וַֽיְהִי בְּנָסְעָם מִקֶּדֶם וַֽיִּמְצְאוּ בִקְעָה בְּאֶרֶץ שִׁנְעָר וַיֵּשְׁבוּ שָֽׁם׃", "3": "וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ הָבָה נִלְבְּנָה לְבֵנִים וְנִשְׂרְפָה לִשְׂרֵפָה וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן וְהַחֵמָר הָיָה לָהֶם לַחֹֽמֶר׃", "4": "וַיֹּאמְרוּ הָבָה ׀ נִבְנֶה־לָּנוּ עִיר וּמִגְדָּל וְרֹאשׁוֹ בַשָּׁמַיִם וְנַֽעֲשֶׂה־לָּנוּ שֵׁם פֶּן־נָפוּץ עַל־פְּנֵי כָל־הָאָֽרֶץ׃", "5": "וַיֵּרֶד יְהוָה לִרְאֹת אֶת־הָעִיר וְאֶת־הַמִּגְדָּל אֲשֶׁר בָּנוּ בְּנֵי הָאָדָֽם׃", "6": "וַיֹּאמֶר יְהוָה הֵן עַם אֶחָד וְשָׂפָה אַחַת לְכֻלָּם וְזֶה הַחִלָּם לַעֲשׂוֹת וְעַתָּה לֹֽא־יִבָּצֵר מֵהֶם כֹּל אֲשֶׁר יָזְמוּ לַֽעֲשֽׂוֹת׃", "7": "הָבָה נֵֽרְדָה וְנָבְלָה שָׁם שְׂפָתָם אֲשֶׁר לֹא יִשְׁמְעוּ אִישׁ שְׂפַת רֵעֵֽהוּ׃", "8": "וַיָּפֶץ יְהוָה אֹתָם מִשָּׁם עַל־פְּנֵי כָל־הָאָרֶץ וַֽיַּחְדְּלוּ לִבְנֹת הָעִֽיר׃", "9": "עַל־כֵּן קָרָא שְׁמָהּ בָּבֶל כִּי־שָׁם בָּלַל יְהוָה שְׂפַת כָּל־הָאָרֶץ וּמִשָּׁם הֱפִיצָם יְהוָה עַל־פְּנֵי כָּל־הָאָֽרֶץ׃", "10": "אֵלֶּה תּוֹלְדֹת שֵׁם שֵׁם בֶּן־מְאַת שָׁנָה וַיּוֹלֶד אֶת־אַרְפַּכְשָׁד שְׁנָתַיִם אַחַר הַמַּבּֽוּל׃", "11": "וַֽיְחִי־שֵׁם אַֽחֲרֵי הוֹלִידוֹ אֶת־אַרְפַּכְשָׁד חֲמֵשׁ מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "12": "וְאַרְפַּכְשַׁד חַי חָמֵשׁ וּשְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־שָֽׁלַח׃", "13": "וַֽיְחִי אַרְפַּכְשַׁד אַֽחֲרֵי הוֹלִידוֹ אֶת־שֶׁלַח שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "14": "וְשֶׁלַח חַי שְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־עֵֽבֶר׃", "15": "וַֽיְחִי־שֶׁלַח אַחֲרֵי הוֹלִידוֹ אֶת־עֵבֶר שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "16": "וַֽיְחִי־עֵבֶר אַרְבַּע וּשְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־פָּֽלֶג׃", "17": "וַֽיְחִי־עֵבֶר אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "18": "וַֽיְחִי־פֶלֶג שְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־רְעֽוּ׃", "19": "וַֽיְחִי־פֶלֶג אַחֲרֵי הוֹלִידוֹ אֶת־רְעוּ תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "20": "וַיְחִי רְעוּ שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־שְׂרֽוּג׃", "21": "וַיְחִי רְעוּ אַחֲרֵי הוֹלִידוֹ אֶת־שְׂרוּג שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "22": "וַיְחִי שְׂרוּג שְׁלֹשִׁים שָׁנָה וַיּוֹלֶד אֶת־נָחֽוֹר׃", "23": "וַיְחִי שְׂרוּג אַחֲרֵי הוֹלִידוֹ אֶת־נָחוֹר מָאתַיִם שָׁנָה וַיּוֹלֶד בָּנִים וּבָנֽוֹת׃", "24": "וַיְחִי נָחוֹר תֵּשַׁע וְעֶשְׂרִים שָׁנָה וַיּו
