<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBible Translation</title>
<style>
:root { --bg:#faf8f4; --fg:#22201c; --muted:#7a736a; --accent:#7c5cbf;
        --card:#ffffff; --border:#e4ded4; --hl:#f3e8b8; --fs:18px; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#181614; --fg:#e8e4dd; --muted:#948d82; --accent:#a98ee6;
          --card:#221f1c; --border:#37322c; --hl:#4a4020; }
}
* { box-sizing:border-box; margin:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--fg);
  font:var(--fs)/1.72 Georgia, "Times New Roman", serif; }
header { position:sticky; top:0; background:var(--bg); z-index:5;
  border-bottom:1px solid var(--border); padding:.6rem .9rem;
  display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
header .brand { font-size:15px; font-style:italic; color:var(--muted);
  margin-right:auto; white-space:nowrap; }
input, select, button.fs { font:14px system-ui, sans-serif; padding:.45rem .6rem;
  border:1px solid var(--border); border-radius:8px;
  background:var(--card); color:var(--fg); }
input:focus { outline:2px solid var(--accent); border-color:transparent; }
#ref { width:11rem; } #q { width:13rem; }
button.fs { cursor:pointer; width:2.2rem; }
button.fs:hover { border-color:var(--accent); }
select#bookSel { max-width:11rem; display:none; }
main { max-width:42rem; margin:0 auto; padding:1.4rem 1.2rem 5rem; }
.layout { display:flex; }
nav#books { width:200px; flex:none; padding:1rem .6rem; font:14px system-ui,sans-serif;
  border-right:1px solid var(--border); height:calc(100vh - 58px);
  overflow-y:auto; position:sticky; top:58px; }
nav#books a { display:block; padding:.15rem .55rem; color:var(--fg);
  text-decoration:none; border-radius:6px; }
nav#books a:hover { background:var(--card); }
nav#books a.on { background:var(--accent); color:#fff; }
nav#books .t { margin:.7rem 0 .25rem; font-weight:600; color:var(--muted);
  font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
nav#books a.missing { color:var(--muted); opacity:.4; pointer-events:none; }
.chnav { font:14px system-ui,sans-serif; margin:.9rem 0 1.6rem;
  display:flex; flex-wrap:wrap; gap:.3rem; }
.chnav a { padding:.22rem .6rem; border:1px solid var(--border);
  border-radius:7px; text-decoration:none; color:var(--fg); }
.chnav a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
h2 { font-size:1.65em; font-weight:normal; margin:.3rem 0 .4rem; }
sup.v { color:var(--accent); font:600 .58em system-ui,sans-serif;
  margin:0 .18em 0 .05em; user-select:none; vertical-align:.55em; }
p.vv { margin:0 0 1.05em; text-align:justify; hyphens:auto; }
.poetry { margin:0 0 1.05em 1.3em; text-indent:-1.3em; white-space:pre-wrap; }
.notes { margin-top:2.4rem; padding:1rem 1.2rem; background:var(--card);
  border:1px solid var(--border); border-radius:10px;
  font:14px/1.6 system-ui,sans-serif; color:var(--muted); }
.notes b { color:var(--fg); }
.pn { display:flex; justify-content:space-between; margin-top:2.6rem;
  font:15px system-ui,sans-serif; }
.pn a { color:var(--accent); text-decoration:none; padding:.5rem .9rem;
  border:1px solid var(--border); border-radius:9px; }
.pn a:hover { border-color:var(--accent); }
.pn .off { visibility:hidden; }
#results { font:15px/1.5 system-ui,sans-serif; }
#results .hit { background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:.7rem .9rem; margin:.6rem 0; cursor:pointer; }
#results .hit:hover { border-color:var(--accent); }
#results .ref { color:var(--accent); font-weight:600; font-size:13px; }
mark { background:var(--hl); color:inherit; border-radius:3px; padding:0 .1em; }
.flash { animation:flash 2.5s; }
@keyframes flash { 0%,55% { background:var(--hl); } 100% { background:transparent; } }
.empty { color:var(--muted); font:15px system-ui,sans-serif; margin-top:2rem; }
@media (max-width:760px){
  nav#books { display:none }
  select#bookSel { display:block }
  header .brand { display:none }
  #q { width:9rem } #ref { width:8rem }
}
</style>
</head>
<body>
<header>
  <span class="brand">eBible — from the Hebrew, Aramaic &amp; Greek</span>
  <select id="bookSel"></select>
  <input id="ref" placeholder="Go to: Genesis 2:7">
  <input id="q" placeholder="Search the text…">
  <button class="fs" id="fsMinus" title="Smaller text">A−</button>
  <button class="fs" id="fsPlus" title="Larger text">A+</button>
</header>
<div class="layout">
<nav id="books"></nav>
<main id="main"></main>
</div>
<script>
const DATA = {"Genesis": {"1": {"verses": {"1": "When God set about creating the heavens and the earth,", "2": "the earth was wild and waste, and darkness covered the face of the deep. A wind from God was moving over the surface of the waters.", "3": "God said, Let there be light, and there was light.", "4": "God saw the light; it was good. God separated the light from the darkness.", "5": "God called the light Day, and the darkness Night. There was evening, and there was morning, the first day.", "6": "God said, Let there be a vault between the waters, to separate water from water.", "7": "God made the vault and separated the waters beneath the vault from the waters above the vault. It happened as God had said.", "8": "God called the vault Heaven. There was evening, and there was morning, the second day.", "9": "God said, Let the waters beneath the heavens gather to one place, and let dry ground appear. It happened as God had said.", "10": "God called the dry ground Earth, and the gathered waters He called Seas. God saw it was good.", "11": "God said, Let the Earth bring forth vegetation, plants yielding seed, trees bearing fruit with seed in it, according to their kinds, on the Earth. It happened as God had said.", "12": "The Earth brought forth vegetation, plants yielding seed according to their kinds, and trees bearing fruit with seed in it according to their kinds. God saw it was good.", "13": "There was evening, and there was morning, the third day.", "14": "God said, Let there be lights in the vault of Heaven to separate day from night, and to mark seasons, days, and years.", "15": "Let the lights be in the vault of Heaven to give light on Earth. It happened as God had said.", "16": "God made the two great lights, the greater light to rule the day, and the lesser light to rule the night, and the stars.", "17": "God placed them in the vault of Heaven to give light on Earth.", "18": "To rule over day and night and to separate light from darkness. God saw it was good.", "19": "There was evening, and there was morning, the fourth day.", "20": "God said, Let the waters swarm with creatures that have life, and let birds fly above the Earth across the vault of Heaven.", "21": "God made the great sea creatures and every living creature that moves, which the waters swarmed with, according to their kinds, and every winged bird according to its kind. God saw it was good.", "22": "God blessed them, saying, Be fruitful, multiply, fill the waters in the seas, and let the birds multiply on Earth.", "23": "There was evening, and there was morning, the fifth day.", "24": "God said, Let the Earth bring forth living creatures according to their kinds: cattle and creeping things and beasts of the Earth, each according to its kind. It happened as God had said.", "25": "God made the beasts of the Earth according to their kinds, the cattle according to their kinds, and every creeping thing of the ground according to its kind. God saw it was good.", "26": "God said, Let us make humankind in Our image, according to Our likeness, and let them have dominion over the fish of the sea, the birds of the sky, the cattle, and over all the Earth, and over every creeping thing that creeps on the Earth.", "27": "God created humankind in His image. In the image of God He created them; male and female He created them.", "28": "God blessed them and said to them, Be fruitful, multiply, fill the Earth, and subdue it. Have dominion over the fish of the sea, the birds of the sky, and every living thing that moves on the Earth.", "29": "God said, Look, I have given you every plant bearing seed, which is on the surface of all the Earth, and every tree with fruit bearing seed; it will be for your food.", "30": "And to every beast of the Earth, to every bird of the sky, and to every creature that moves on the Earth, in which is the breath of life, I have given every green plant for food. It happened as God had said.", "31": "God saw everything He had made, and indeed it was very good. There was evening, and there was morning, the sixth day.\n"}, "notes": "Notes\n- v. 1: \"When God set about creating\" follows the dependent-clause reading of Genesis 1:1.\n- v. 27: \"the human\" used for ha-adam until the narrative clearly names Adam.\n- v. 31: \"the sixth day\" aligns with the Hebrew ordinal system."}, "2": {"verses": {"1": "The heavens and the earth and all their host were completed.", "2": "On the seventh day God completed His work that He had done, and He rested on the seventh day from all His work that He had done.", "3": "God blessed the seventh day and made it holy, because on it He rested from all His work that God had created to make.", "4": "These are the generations of the heavens and the earth when they were created, on the day that the LORD God made earth and heavens.", "5": "Now no shrub of the field was yet in the earth, and no plant of the field had yet sprouted, for the LORD God had not caused it to rain on the earth, and there was no human to till the soil.", "6": "But a mist rose from the earth and watered the whole face of the ground.", "7": "Then the LORD God formed the human from dust from the ground, and breathed into his nostrils the breath of life, and the human became a living being.", "8": "The LORD God planted a garden in Eden, to the east, and placed there the human He had formed.", "9": "The LORD God caused to grow from the ground every tree pleasant to look at and good for food, and the tree of life in the middle of the garden, and the tree of the knowledge of good and evil.", "10": "A river flowed out of Eden to water the garden, and from there it divided into four heads.", "11": "The name of the first is Pishon, which flows around the whole land of Havilah, where there is gold.", "12": "The gold of that land is good; there is also bdellium and onyx stone.", "13": "The name of the second river is Gihon, which flows around the whole land of Cush.", "14": "The name of the third river is Tigris, which flows in front of Assyria, and the fourth river is the Euphrates.", "15": "The LORD God took the human and placed him in the garden of Eden, to till it and to keep it.", "16": "The LORD God gave a command to the human, saying, From every tree of the garden you may eat freely.", "17": "But from the tree of the knowledge of good and evil you shall not eat, for in the day that you eat from it, you will surely die.", "18": "The LORD God said, It is not good for the human to be alone; I will make for him a helper suitable for him.", "19": "So the LORD God formed from the ground every wild animal of the field and every bird of the heavens, and brought them to the human to see what he would call them. And whatever the human called each living creature, that became its name.", "20": "The human gave names to all the cattle, and to the birds of the heavens, and to every wild animal of the field, but for the human no helper suitable for him was found.", "21": "So the LORD God caused a deep sleep to fall upon the human, and he slept; then He took one of his ribs and closed up the flesh in its place.", "22": "The LORD God built the rib that He had taken from the human into a woman, and brought her to the human.", "23": "The human said, This at last is bone of my bones and flesh of my flesh; this one shall be called Woman, for from Man was this one taken.", "24": "Therefore a man shall leave his father and his mother and shall cleave to his wife, and they shall become one flesh.", "25": "The two of them were both naked, the human and his wife, and they were not ashamed.\n"}, "notes": "Notes\n- v. 7: \"nephesh chayyah\" is translated as \"a living being\" to reflect the context of creation and the breath of life.\n- v. 9: \"tree of the knowledge of good and evil\" reflects the Hebrew phrase \"etz hada'at tov va'ra.\"\n- v. 15: \"to till it and to keep it\" renders \"la'avod otah ul'shomer otah\" with active verbs.\n- v. 24: \"bone of my bones and flesh of my flesh\" preserves the poetic parallelism of the Hebrew."}, "3": {"verses": {"1": "The serpent was more shrewd than any wild animal of the field that the LORD God had made. He said to the woman, \"Indeed, has God said, 'You shall not eat from any tree of the garden'?\"", "2": "The woman said to the serpent, \"We may eat of the fruit of the trees of the garden.\"", "3": "\"But from the fruit of the tree that is in the middle of the garden, God said, 'You shall not eat from it, nor shall you touch it, lest you die.'\"", "4": "The serpent said to the woman, \"You will not surely die.\"", "5": "\"For God knows that in the day you eat from it, your eyes will be opened and you will be like God, knowing good and evil.\"", "6": "The woman saw that the tree was good for food, and that it was a delight to the eyes, and that the tree was to be desired to make one wise. She took of its fruit and ate, and gave also to her husband with her, and he ate.", "7": "The eyes of both of them were opened, and they knew that they were naked. They sewed fig leaves together and made themselves coverings.", "8": "They heard the sound of the LORD God walking in the garden at the time of the day breeze, and the man and his wife hid themselves from the presence of the LORD God among the trees of the garden.", "9": "The LORD God called to the man and said to him, \"Where are you?\"", "10": "He said, \"I heard the sound of You in the garden, and I was afraid because I was naked, so I hid.\"", "11": "God said, \"Who told you that you were naked? Have you eaten from the tree that I commanded you not to eat from?\"", "12": "The man said, \"The woman whom You gave to be with me, she gave me from the tree, and I ate.\"", "13": "The LORD God said to the woman, \"What is this you have done?\" The woman said, \"The serpent beguiled me, and I ate.\"", "14": "The LORD God said to the serpent, \"Because you have done this, cursed are you among all the livestock and among all the wild animals of the field; on your belly you will go, and dust you will eat all the days of your life.\"", "15": "\"I will put enmity between you and the woman, and between your offspring and her offspring; he will strike your head, and you will strike his heel.\"", "16": "To the woman He said, \"I will multiply your pain in childbirth; in pain you will bring forth children. Your desire will be for your husband, and he will rule over you.\"", "17": "To Adam He said, \"Because you listened to the voice of your wife and ate from the tree of which I commanded you, 'You shall not eat from it,' cursed is the ground because of you. In toil you will eat of it all the days of your life.\"", "18": "\"Thorns and thistles it will grow for you, and you will eat the herb of the field.\"", "19": "\"By the sweat of your face you will eat bread, until you return to the ground, for from it you were taken. For you are dust, and to dust you will return.\"", "20": "The man named his wife Eve, because she was the mother of all living.", "21": "The LORD God made garments of skin for Adam and for his wife, and clothed them.", "22": "The LORD God said, \"Behold, the man has become like one of Us, knowing good and evil. Now, lest he reach out his hand and take also from the tree of life and eat, and live forever.\"", "23": "The LORD God sent him out from the garden of Eden to till the ground from which he was taken.", "24": "He drove out the man, and placed at the east of the garden of Eden the cherubim and a flaming sword which turned every way to guard the way to the tree of life.\n"}, "notes": "Notes  \n- v. 1: The word שָׂדֶֽה (sadeh) is translated as \"field,\" not \"countryside\" or \"country,\" for consistency with the narrative context.  \n- v. 5: The phrase \"like God, knowing good and evil\" is a direct rendering of כֵּֽאלֹהִים יֹדְעֵי טוֹב וָרָֽע.  \n- v. 15: The phrase \"he will strike your head, and you will strike his heel\" captures the poetic justice of the curse and the hope of redemption.  \n- v. 22: The plural \"Us\" reflects the divine plural in the Hebrew text.  \n- v. 24: \"Flaming sword which turned every way\" is a literal translation of לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת."}, "4": {"verses": {"1": "The human knew his wife Eve, and she became pregnant and gave birth to Cain. She said, \"I have gotten a man with the help of the LORD.\"\n", "2": "She gave birth again to his brother Abel. Abel became a shepherd of flocks, and Cain became a tiller of the ground.\n", "3": "After some time had passed, Cain brought an offering to the LORD from the fruit of the ground.\n", "4": "Abel also brought an offering, from the firstborn of his flock and from their fat portions. The LORD looked with favor on Abel and his offering.\n", "5": "But he did not look with favor on Cain and his offering. Cain was very angry, and his face fell.\n", "6": "The LORD said to Cain, \"Why are you angry, and why has your face fallen?\n", "7": "If you do well, will you not be accepted? And if you do not do well, sin lies in wait at the door; its desire is for you, but you must master it.\"\n", "8": "Cain spoke to his brother Abel while they were in the field. Then Cain rose up against his brother Abel and killed him.\n", "9": "The LORD said to Cain, \"Where is your brother Abel?\" He said, \"I do not know. Am I my brother's guardian?\"\n", "10": "The LORD said, \"What have you done? The voice of your brother's blood is crying out to me from the ground.\n", "11": "And now you are cursed from the ground, which has opened its mouth to receive your brother's blood from your hand.\n", "12": "When you work the ground, it will no longer yield to you its strength. You will be a restless wanderer on the earth.\"\n", "13": "Cain said to the LORD, \"My punishment is too great to bear.\n", "14": "Today you have driven me away from the presence of the ground, and I will be hidden from your face. I will be a restless wanderer on the earth, and whoever finds me will kill me.\"\n", "15": "The LORD said to him, \"Then whoever kills Cain, vengeance will be taken from him sevenfold.\" And the LORD set a mark on Cain, so that no one finding him would kill him.\n", "16": "So Cain went out from the presence of the LORD and lived in the land of Nod, east of Eden.\n", "17": "Cain knew his wife, and she became pregnant and gave birth to Enoch. He built a city and named the city after his son Enoch.\n", "18": "Enoch fathered Irad, and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.\n", "19": "Lamech took two wives. The name of the first was Adah, and the name of the second was Zillah.\n", "20": "Adah gave birth to Jabal, who was the ancestor of those who dwell in tents and raise livestock.\n", "21": "His brother's name was Jubal, who was the ancestor of all who play the lyre and the flute.\n", "22": "Zillah also gave birth to Tubal-Cain, the forger of every tool of bronze and iron. The sister of Tubal-Cain was Naamah.\n", "23": "Lamech said to his wives, Adah and Zillah, \"Hear my voice, wives of Lamech, listen to what I say. I have killed a man for wounding me, and a boy for striking me.\n", "24": "For if Cain is avenged sevenfold, then Lamech seventy-sevenfold.\"\n", "25": "Adam knew his wife again, and she gave birth to a son and named him Seth, saying, \"God has given me another seed in place of Abel, for Cain killed him.\"\n", "26": "To Seth also was born a son, and he named him Enosh. At that time people began to call upon the name of the LORD.\n"}, "notes": "Notes\n- v. 7: \"sin lies in wait at the door\" — the Hebrew uses a metaphor of a crouching animal, \"chattat rovet,\" which is rendered as \"sin lies in wait at the door.\"\n- v. 23: \"I have killed a man for wounding me, and a boy for striking me\" — the Hebrew uses poetic parallelism to emphasize the escalation from wounding to death.\n- v. 26: \"people began to call upon the name of the LORD\" — the phrase \"to call upon the name of YHWH\" is a standard biblical idiom for worship or invoking divine presence."}, "5": {"verses": {"1": "This is the account of Adam’s descendants. When God created Adam, he made him in God’s likeness.\n", "2": "He created him male and female, blessed them, and called their name Adam on the day they were created.\n", "3": "Adam lived 130 years and fathered a son in his own likeness, in his own image. He named him Seth.\n", "4": "After fathering Seth, Adam lived 800 years and fathered other sons and daughters.\n", "5": "All the days that Adam lived totaled 930 years, and he died.\n", "6": "Seth lived 105 years and fathered Enosh.\n", "7": "After fathering Enosh, Seth lived 807 years and fathered other sons and daughters.\n", "8": "All the days that Seth lived totaled 912 years, and he died.\n", "9": "Enosh lived 90 years and fathered Cainan.\n", "10": "After fathering Cainan, Enosh lived 815 years and fathered other sons and daughters.\n", "11": "All the days that Enosh lived totaled 905 years, and he died.\n", "12": "Cainan lived 70 years and fathered Mahalalel.\n", "13": "After fathering Mahalalel, Cainan lived 840 years and fathered other sons and daughters.\n", "14": "All the days that Cainan lived totaled 910 years, and he died.\n", "15": "Mahalalel lived 65 years and fathered Jared.\n", "16": "After fathering Jared, Mahalalel lived 830 years and fathered other sons and daughters.\n", "17": "All the days that Mahalalel lived totaled 895 years, and he died.\n", "18": "Jared lived 162 years and fathered Enoch.\n", "19": "After fathering Enoch, Jared lived 800 years and fathered other sons and daughters.\n", "20": "All the days that Jared lived totaled 962 years, and he died.\n", "21": "Enoch lived 65 years and fathered Methuselah.\n", "22": "After fathering Methuselah, Enoch walked with God for 300 years and fathered other sons and daughters.\n", "23": "All the days that Enoch lived totaled 365 years.\n", "24": "Enoch walked with God, and he was not, for God had taken him.\n", "25": "Methuselah lived 187 years and fathered Lamech.\n", "26": "After fathering Lamech, Methuselah lived 782 years and fathered other sons and daughters.\n", "27": "All the days that Methuselah lived totaled 969 years, and he died.\n", "28": "Lamech lived 182 years and fathered a son.\n", "29": "He named him Noah, saying, “This one will bring us relief from our labor and from the toil of our hands from the ground that the LORD has cursed.”\n", "30": "After fathering Noah, Lamech lived 595 years and fathered other sons and daughters.\n", "31": "All the days that Lamech lived totaled 777 years, and he died.\n", "32": "Noah was 500 years old when he fathered Shem, Ham, and Japheth.\n"}, "notes": "Notes\n- v. 1: \"the account of Adam’s descendants\" — The Hebrew is \"sefer toledot,\" literally \"book of generations,\" but here it functions as an introduction to a genealogical or narrative section.\n- v. 24: \"he was not\" — The Hebrew is \"ve’einenu,\" literally \"and he was not,\" referring to Enoch’s mysterious disappearance. The phrase \"for God had taken him\" is an interpretive gloss.\n- v. 29: \"relief from our labor\" — The Hebrew term \"machamenu\" is translated here as \"relief,\" but could also carry a more emotional tone, such as \"comfort\" or \"consolation.\""}, "6": {"verses": {"1": "When the human began to multiply on the surface of the earth and daughters were born to them,\n", "2": "the sons of the gods saw the daughters of the human, that they were beautiful, and they took for themselves wives from all whom they chose.\n", "3": "The LORD said, “My spirit will not remain in the human forever, since he is flesh, and his days will be 120 years.”\n", "4": "The Nephilim were in the earth in those days and after that, when the sons of the gods came to the daughters of the human and they bore children to them. These were the mighty ones, the men of renown.\n", "5": "The LORD saw that the wickedness of the human was great on the earth, and that every thought of their minds was only evil all the time.\n", "6": "The LORD regretted having made the human on the earth, and it grieved him to his heart.\n", "7": "The LORD said, “I will blot out the human I have made from the face of the earth, from human to beast to creeping thing and to birds of the sky, for I regret that I made them.”\n", "8": "But Noah found favor in the eyes of the LORD.\n", "9": "These are the generations of Noah. Noah was a righteous man, blameless in his generations. Noah walked with God.\n", "10": "Noah fathered three sons: Shem, Ham, and Japheth.\n", "11": "The earth had become corrupt before God, and the earth was filled with violence.\n", "12": "God saw the earth and behold, it was corrupt, for all flesh had corrupted its way on the earth.\n", "13": "God said to Noah, “The end of all flesh has come before me, for the earth is filled with violence because of them. I am about to destroy them from the earth.”\n", "14": "Make yourself an ark of gopher wood. You shall make the ark with rooms, and you shall cover it inside and out with pitch.\n", "15": "This is how you must make it: three hundred cubits long, fifty cubits wide, and thirty cubits high.\n", "16": "You shall make a window for the ark and finish it to a cubit from above. You shall place the door of the ark on its side. You shall make lower, second, and third decks.\n", "17": "And I am bringing a flood of waters upon the earth to destroy all flesh in which there is the breath of life from beneath the heavens. Everything on the earth will perish.\n", "18": "But I will establish my covenant with you, and you will enter the ark—you, your sons, your wife, and your sons’ wives with you.\n", "19": "From every living thing, from every flesh, you shall bring two of each into the ark to keep them alive with you—male and female they shall be.\n", "20": "From the birds, according to their kind, and from the beasts, according to their kind, and from all crawling things on the earth, according to their kind—two of each will come to you to keep them alive.\n", "21": "And you, take for yourself every kind of food that is eaten, and gather it to yourself. It will be food for you and for them.”\n", "22": "Noah did everything as God had commanded him. He did it.\n"}, "notes": "Notes\n- v. 2: \"sons of the gods\" — a difficult phrase; some interpret this as divine beings or angelic figures, others as rulers or descendants of Seth. The Hebrew is \"benei elohim,\" literally \"sons of gods.\"\n- v. 4: \"Nephilim\" — the meaning of the Hebrew is debated. Here rendered as a proper noun, referring to a race of giants or legendary figures.\n- v. 11: \"had become corrupt\" — the verb \"shachah\" can mean \"corrupt\" or \"ruined,\" often used in moral or cosmic contexts.\n- v. 17: \"I am bringing a flood of waters\" — the Hebrew is \"mabbul,\" often rendered as \"flood,\" but can imply a comprehensive or judgmental deluge."}, "7": {"verses": {"1": "The LORD said to Noah, “You and your entire household come into the ark, for I have seen you as righteous before me in this generation.\n", "2": "From every clean beast you are to take for yourself seven pairs, male and female, and from the beast that is not clean you are to take two, male and female.\n", "3": "Likewise, from the birds of the sky—seven pairs, male and female, to keep alive a living seed on the surface of the whole earth.\n", "4": "For in seven more days I will rain on the earth for forty days and forty nights, and I will blot out every living thing I have made from the face of the ground.”\n", "5": "Noah did as the LORD had commanded him.\n", "6": "Noah was six hundred years old when the floodwaters came upon the earth.\n", "7": "Noah and his sons and his wife and his sons’ wives with him went into the ark because of the waters of the flood.\n", "8": "From the clean beast and the unclean beast, and from the birds and all that crawls on the ground,\n", "9": "two by two they came to Noah into the ark, male and female, as God had commanded Noah.\n", "10": "And it came to pass in the seventh day that the floodwaters were upon the earth.\n", "11": "In the six hundredth year of Noah’s life, in the second month, on the seventeenth day of the month—on that day all the fountains of the great deep burst forth, and the floodgates of the heavens were opened.\n", "12": "The rain was upon the earth for forty days and forty nights.\n", "13": "On that very day Noah and Shem and Ham and Japheth, Noah’s sons, and Noah’s wife and the three wives of his sons with them entered the ark,\n", "14": "they and every living creature by its kind, and all the beasts by their kind, and all the crawling things that crawl on the earth by their kind, and every bird by its kind, every winged bird.\n", "15": "They entered the ark with Noah, two by two of every kind of flesh in which there was breath of life.\n", "16": "Those entering were male and female of every kind of flesh, as God had commanded him. And the LORD shut him in.\n", "17": "The flood was upon the earth for forty days, and the waters increased and lifted up the ark and it rose above the earth.\n", "18": "The waters increased greatly, very greatly upon the earth, and the ark floated on the surface of the waters.\n", "19": "The waters increased so greatly that all the high mountains under the entire sky were covered.\n", "20": "The waters rose fifteen cubits over the mountains and covered them.\n", "21": "Every living thing that moved on the surface of the earth—birds, beasts, creeping things, and all the creatures that swarm on the earth, and every human being—\n", "22": "everything in whose nose was the breath of life, of all that was on dry land, perished.\n", "23": "He wiped out every living thing that was on the face of the earth—human and beast and creeping thing and birds of the sky—and they were blotted out from the earth. Only Noah was left, and those who were with him in the ark.\n", "24": "The waters prevailed on the earth for one hundred and fifty days.\n"}, "notes": "Notes\n- v. 20: \"fifteen cubits\" is a literal translation of \"חמשׁ עשרה אמה\", which is 15 cubits. This is a specific measurement, though some interpretations may equate it with \"fifteen feet\" or similar, depending on the cubit length assumed.\n- v. 21: \"everything in whose nose was the breath of life\" translates \"כֹּל אֲשֶׁר נִשְׁמַת־רוּחַ חַיִּים בְּאַפָּיו\" literally. The phrase \"in whose nose\" reflects the Hebrew idiom, not a literal anatomical location.\n- v. 24: \"one hundred and fifty days\" is a direct translation of \"חמשׁים וּמְאַת יוֹם\". Some manuscripts or traditions may render the number differently, but the text here is clear."}, "8": {"verses": {"1": "God remembered Noah and all the living creatures and every beast that were with him in the ark. God caused a wind to pass over the earth, and the waters subsided.\n", "2": "The fountains of the deep were sealed, and the floodgates of the heavens were closed. The rain ceased from the sky.\n", "3": "The waters receded gradually from the earth, going back and forth, until the end of one hundred and fifty days.\n", "4": "The ark came to rest in the seventh month, on the seventeenth day of the month, on the mountains of Ararat.\n", "5": "The waters continued to decrease until the tenth month. On the first day of the tenth month the tops of the mountains became visible.\n", "6": "It came to pass at the end of forty days that Noah opened the window of the ark he had made.\n", "7": "He sent out the raven, which went back and forth until the waters had dried up from the earth.\n", "8": "Then he sent out the dove from himself to see if the waters had receded from the surface of the land.\n", "9": "But the dove found no resting place for the sole of its foot, so it returned to him into the ark, for water was still on the surface of all the earth. Noah stretched out his hand, took the dove, and brought it back to him into the ark.\n", "10": "He waited another seven days, and again sent out the dove from the ark.\n", "11": "The dove came back to him in the evening, and there was an olive leaf torn off in its beak. Then Noah knew that the waters had receded from the earth.\n", "12": "He waited another seven days, and again sent out the dove. This time it did not return to him anymore.\n", "13": "In the six hundredth and first year, in the first month, on the first day of the month, the waters had dried up from the earth. Noah removed the covering of the ark and looked, and saw that the surface of the land had dried up.\n", "14": "In the second month, on the twenty-seventh day of the month, the land had dried.\n", "15": "Then God spoke to Noah, saying:\n", "16": "“Come out of the ark—you, your wife, your sons, and your sons’ wives with you.\n", "17": "Every living creature that is with you, every flesh of bird, beast, and all creeping things that crawl on the earth, let them come out with you, and they shall multiply and fill the earth.”\n", "18": "So Noah came out, along with his sons and his wife, and his sons’ wives with him.\n", "19": "Every living creature, every creeping thing, and every bird—all that moved on the earth—came out from the ark in their families.\n", "20": "Noah built an altar to the LORD, and took from all the clean cattle and from all the clean birds, and offered burnt offerings on the altar.\n", "21": "The LORD smelled the pleasing aroma, and in his heart he said, “I will never again curse the ground because of humanity, for the inclination of the human heart is evil from youth. I will never again strike down every living thing as I have done.”\n", "22": "While the earth remains, seedtime and harvest, cold and heat, summer and winter, day and night will not cease.\n"}, "notes": "Notes\n- v. 1: \"Remembered\" is a poetic anthropomorphism for acting with covenantal faithfulness.\n- v. 21: \"In his heart he said\" reflects the narrative voice describing God's internal resolve; this is not a direct quote.\n- v. 22: \"While the earth remains\" reflects the Hebrew phrase le-olam ad, often used to express a perpetual covenant."}, "9": {"verses": {"1": "God blessed Noah and his sons, saying to them, “Be fertile, multiply, and fill the earth.\n", "2": "The fear of you and the dread of you will be upon every living beast of the earth, and upon every bird of the sky, upon everything that moves along the ground, and upon all the fish of the sea; they are given into your hand.\n", "3": "Every creature that moves and lives shall be yours for food, as I gave you the green plants.\n", "4": "But you must not eat flesh with its life—its blood—in it.\n", "5": "For your own lives, your blood I will demand an accounting. From the hand of every beast I will demand it, and from the hand of humans, from the hand of each man’s brother, I will demand the life of a human.\n", "6": "Whoever sheds the blood of a human, by a human shall their blood be shed, for in the image of God, God made the human.\n", "7": "And you, be fertile, multiply, and fill the earth, and dominate it.\n", "8": "Then God spoke to Noah and to his sons with him, saying:\n", "9": "“I am establishing my covenant with you and with your descendants after you,\n", "10": "and with every living creature that is with you: the birds, the domestic animals, and every wild beast that is with you, all that came out of the ark, all creatures on the earth.\n", "11": "I will establish my covenant with you, and never again will all flesh be cut off by the waters of the flood, and there will never again be a flood to destroy the earth.”\n", "12": "God said, “This is the sign of the covenant I am making between me and you and every living creature with you, for all generations to come:\n", "13": "I have placed my bow in the clouds, and it shall be a sign of the covenant between me and the earth.\n", "14": "When I bring clouds over the earth, and the bow appears in the clouds,\n", "15": "I will remember the covenant I made between me and you and every living creature of all flesh, and the waters shall never again become a flood to destroy every living creature.\n", "16": "The bow shall be in the clouds, and I will see it to remember the eternal covenant between God and every living creature of all flesh on the earth.”\n", "17": "God said to Noah, “This is the sign of the covenant I have established between me and every living creature on the earth.”\n", "18": "The sons of Noah who went out from the ark were Shem, Ham, and Japheth. Ham was the father of Canaan.\n", "19": "These three were the sons of Noah, and from them the whole earth was dispersed.\n", "20": "Noah, a man of the soil, planted a vineyard.\n", "21": "He drank of the wine, became drunk, and lay uncovered in his tent.\n", "22": "Ham, the father of Canaan, saw the nakedness of his father and told his two brothers outside.\n", "23": "But Shem and Japheth took a garment and laid it on both their shoulders, and walked in reverse to cover their father’s nakedness. Their faces were turned backward, and they did not see their father’s nakedness.\n", "24": "When Noah awoke from his wine, he learned what his youngest son had done to him.\n", "25": "He said, “Cursed be Canaan; a slave of slaves he shall be to his brothers.”\n", "26": "He said, “Blessed be the Lord, the God of Shem, and let Canaan be a slave to them.”\n", "27": "“May God enlarge Japheth, and may he dwell in the tents of Shem; and let Canaan be a slave to them.”\n", "28": "Noah lived for 350 years after the flood.\n", "29": "The total length of Noah’s life was 950 years, and he died.\n"}, "notes": "Notes\n- v. 4: The phrase \"in its life\" (בְּנַפְשׁוֹ) reflects the Hebrew's use of \"nephesh\" for \"life\" rather than \"soul.\"\n- v. 27: \"Japheth\" is a proper name, and the poetic structure of v. 27 is preserved, with the repetition of \"Canaan be a slave to them.\"\n- v. 28–29: The phrase \"lived for\" (וַֽיְחִי) is used to distinguish the time after the flood from the full length of his life."}, "10": {"verses": {"1": "These are the descendants of the sons of Noah: Shem, Ham, and Japheth. They each had sons after the flood.\n", "2": "The sons of Japheth were Gomer, Magog, Madai, Javan, Tubal, Meshech, and Tiras.\n", "3": "The sons of Gomer were Ashkenaz, Riphath, and Togarmah.\n", "4": "The sons of Javan were Elishah, Tarshish, Kittim, and Dodanim.\n", "5": "From these the island-dwelling nations separated, each to their own lands, by their language, in their families, by their nations.\n", "6": "The sons of Ham were Cush, Egypt, Put, and Canaan.\n", "7": "The sons of Cush were Seba, Havilah, Sabtah, Raamah, and Sabteca. The sons of Raamah were Sheba and Dedan.\n", "8": "Cush fathered Nimrod, who became a mighty man on the earth.\n", "9": "He was a mighty hunter before the LORD. That is why it is said, “Like Nimrod, a mighty hunter before the LORD.”\n", "10": "The beginning of his kingdom was Babel, Erech, Accad, and Calneh, in the land of Shinar.\n", "11": "From that land, Assyria went out and built Nineveh, Rehoboth-Ir, and Calah.\n", "12": "And Resen, between Nineveh and Calah—that is the great city.\n", "13": "The sons of Egypt were Ludim, Anamim, Lehabim, Naphthuhim,\n", "14": "Pathrusim, Casluhim (from whom the Philistines came), and Caphtorim.\n", "15": "Canaan fathered Sidon his firstborn, and Heth,\n", "16": "and the Jebusites, the Amorites, and the Girgashites,\n", "17": "the Hivites, the Arkites, and the Sinites,\n", "18": "the Arvadites, the Zemarites, and the Hamathites. Later, the clans of the Canaanites dispersed.\n", "19": "The boundary of the Canaanites extended from Sidon as far as Gerar, to Gaza, as far as Sodom and Gomorrah, Admah and Zeboiim, as far as Lasha.\n", "20": "These are the sons of Ham, by their families, by their languages, in their lands, by their nations.\n", "21": "Shem, too, had sons born to him, and he became the father of all the sons of Eber, the older brother of Japheth.\n", "22": "The sons of Shem were Elam, Asshur, Arpachshad, Lud, and Aram.\n", "23": "The sons of Aram were Uz, Hul, Gether, and Mash.\n", "24": "Arpachshad fathered Shelah, and Shelah fathered Eber.\n", "25": "To Eber were born two sons. The name of one was Peleg, for in his time the earth was divided. His brother’s name was Joktan.\n", "26": "Joktan fathered Almodad, Sheleph, Hazarmaveth, Jerah,\n", "27": "Hadoram, Uzal, Diklah,\n", "28": "Obal, Abimael, and Sheba,\n", "29": "Ofir, Havilah, and Jobab. All these were the sons of Joktan.\n", "30": "Their settlements extended from Mesha as far as Sephar, the mountain east of the desert.\n", "31": "These are the sons of Shem, by their families, by their languages, in their lands, by their nations.\n", "32": "These are the families of the sons of Noah, by their generations, by their nations. From these the nations dispersed on the earth after the flood.\n"}, "notes": "Notes\n- v. 5: \"island-dwelling nations\" reflects \"אִיֵּי הַגּוֹיִם\" (islands of the nations), referring to seafaring or coastal peoples.\n- v. 9: \"before the LORD\" is likely metaphorical, referring to being recognized or feared by people rather than a divine favor.\n- v. 15: \"Canaan fathered Sidon his firstborn\" — \"firstborn\" is added for clarity, though Hebrew does not use the word for \"firstborn\" (בְּכֹר) here; it is implied.\n- v. 25: \"Peleg\" is interpreted as meaning \"division,\" and the phrase \"in his time the earth was divided\" reflects the naming rationale in context.\n- v. 30: \"mountain east of the desert\" is a contextual rendering of \"הַקֶּֽדֶם\" (the East), referring to the general region east of the Arabian desert."}, "11": {"verses": {"1": "Now the whole earth had one language and the same words.\n", "2": "As they traveled eastward, they found a plain in the land of Shinar and settled there.\n", "3": "They said to one another, \"Come, let us make bricks and burn them thoroughly.\" The brick became their stone and the clay their mortar.\n", "4": "They said, \"Come, let us build a city and a tower with its top in the heavens, and let us make a name for ourselves, lest we be scattered over the face of the whole earth.\"\n", "5": "The LORD came down to see the city and the tower that the people of the earth had built.\n", "6": "And the LORD said, \"Indeed, they are one people and they all have one language, and this is only the beginning of what they will do. Now nothing they propose to do will be impossible for them.\n", "7": "Come, let us go down and confuse their language, so that they cannot understand one another's speech.\"\n", "8": "So the LORD scattered them from there over the face of the whole earth, and they ceased to build the city.\n", "9": "Therefore the name of it was called Babel, because there the LORD confused the language of the whole earth, and from there the LORD scattered them over the face of the whole earth.\n", "10": "These are the generations of Shem. Shem was a hundred years old when he fathered Arpachshad two years after the flood.\n", "11": "Shem lived after fathering Arpachshad five hundred years and had other sons and daughters.\n", "12": "Arpachshad lived thirty-five years and fathered Shelah.\n", "13": "Arpachshad lived after fathering Shelah four hundred and three years and had other sons and daughters.\n", "14": "Shelah lived thirty years and fathered Eber.\n", "15": "Shelah lived after fathering Eber four hundred and three years and had other sons and daughters.\n", "16": "Eber lived thirty-four years and fathered Peleg.\n", "17": "Eber lived after fathering Peleg four hundred and thirty years and had other sons and daughters.\n", "18": "Peleg lived thirty years and fathered Reu.\n", "19": "Peleg lived after fathering Reu two hundred and nine years and had other sons and daughters.\n", "20": "Reu lived thirty-two years and fathered Serug.\n", "21": "Reu lived after fathering Serug two hundred and seven years and had other sons and daughters.\n", "22": "Serug lived thirty years and fathered Nahor.\n", "23": "Serug lived after fathering Nahor two hundred years and had other sons and daughters.\n", "24": "Nahor lived twenty-nine years and fathered Terah.\n", "25": "Nahor lived after fathering Terah nineteen years and one hundred years and had other sons and daughters.\n", "26": "Terah lived seventy years and fathered Abram, Nahor, and Haran.\n", "27": "These are the generations of Terah. Terah fathered Abram, Nahor, and Haran. Haran fathered Lot.\n", "28": "Haran died in the presence of his father Terah in the land of his birth, in Ur of the Chaldeans.\n", "29": "Abram and Nahor took wives. The name of Abram’s wife was Sarai, and the name of Nahor’s wife was Milcah, daughter of Haran, the father of Milcah and also the father of Iscah.\n", "30": "Sarai was barren; she had no child.\n", "31": "Terah took Abram his son, and Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they went out together from Ur of the Chaldeans to go to the land of Canaan. They arrived at Haran and settled there.\n", "32": "The years of Terah were two hundred and five years, and Terah died in Haran.\n"}, "notes": "Notes\n- v. 9: \"Babel\" is a transliteration of the Hebrew word בָּבֶל, which plays on the verb בָּלַל (to confuse/mingle), as noted in the text. The name is explained as a reference to the confusion of language.\n- v. 31: \"Ur of the Chaldeans\" is a direct translation of אוּר כַּשְׂדִּים, with \"Chaldeans\" used to correspond to the historical term."}, "12": {"verses": {"1": "The LORD said to Abram, \"Go forth from your land, from your birthplace, and from your father's house to the land that I will show you.\n", "2": "I will make you into a great nation, and I will bless you, and I will make your name great. You will be a source of blessing.\n", "3": "I will bless those who bless you and curse those who curse you, and through you, all the families of the earth will be blessed.\"\n", "4": "Abram went as the LORD had spoken to him, and Lot went with him. Abram was seventy-five years old when he left Haran.\n", "5": "Abram took Sarai his wife, and Lot his nephew, along with all their possessions and all the people they had acquired in Haran. They journeyed to the land of Canaan and arrived there.\n", "6": "Abram passed through the land as far as the site of Shechem, to the terebinth of Moreh. At that time, the Canaanites were already in the land.\n", "7": "The LORD appeared to Abram and said, \"I will give this land to your descendants.\" There Abram built an altar to the LORD who had appeared to him.\n", "8": "Then he moved from there into the hill country east of Bethel and pitched his tent—Bethel to the west and Ai to the east. There he built an altar to the LORD and called upon the name of the LORD.\n", "9": "Abram continued to travel, journeying southward.\n", "10": "A famine struck the land, and Abram went down to Egypt to sojourn there, for the famine was severe in the land.\n", "11": "When he was about to enter Egypt, he said to his wife Sarai, \"I know that you are a very beautiful woman.\n", "12": "When the Egyptians see you, they will say, 'This is his wife,' and they may kill me, but they will let you live.\n", "13": "Please say you are my sister, so that it may go well with me because of you, and so that I may live because of you.\"\n", "14": "When Abram entered Egypt, the Egyptians saw that the woman was very beautiful.\n", "15": "Pharaoh's officials saw her and praised her highly to Pharaoh, and the woman was taken into Pharaoh's house.\n", "16": "Because of her, Pharaoh treated Abram well, giving him flocks and herds, male and female donkeys, male and female slaves, and camels.\n", "17": "But the LORD sent a great plague upon Pharaoh and his house because of Sarai, Abram's wife.\n", "18": "Pharaoh called Abram and said, \"What have you done to me? Why did you not tell me that she was your wife?\n", "19": "Why did you say, 'She is my sister,' so that I took her as my wife? Now then, take your wife and go.\"\n", "20": "Pharaoh gave orders to his men, and they sent Abram away—with his wife and all that he had.\n"}, "notes": "Notes\n- v. 1: \"Go forth from your land\" — \"לֶךְ־לְךָ\" is a rare and emphatic expression, often translated as \"Go for yourself\" or \"Go out to yourself,\" but here rendered as \"Go forth\" to preserve the intensity and direction of the divine command.\n- v. 3: \"curse those who curse you\" — the Hebrew uses \"אָאֹר\" from \"עָרַר,\" meaning to curse or speak against; the translation mirrors the parallel structure of the blessing.\n- v. 13: \"Please say you are my sister\" — the Hebrew \"אֲחֹתִי\" is \"my sister\"; Abram asks Sarai to lie about their relationship.\n- v. 17: \"a great plague\" — the Hebrew \"נְגָעִים גְּדֹלִים\" is literally \"great plagues\" or \"serious afflictions,\" translated as \"a great plague\" to maintain clarity and conciseness."}, "13": {"verses": {"1": "Abram and his wife, along with all that he had, went up from Egypt to the Negev.\n", "2": "Abram was very rich in livestock, in silver, and in gold.\n", "3": "He journeyed on from the Negev to Bethel, to the place where his tent had been at the beginning, between Bethel and Ai.\n", "4": "He went to the site of the altar he had made there before and called on the name of the LORD.\n", "5": "Lot, who was going with Abram, had flocks, herds, and tents.\n", "6": "But the land could not bear the two of them together, for their possessions were too numerous, and they could not live together.\n", "7": "A quarrel arose between the herdsmen of Abram and the herdsmen of Lot, and at that time the Canaanite and the Perizzite were living in the land.\n", "8": "Abram said to Lot, \"Let there be no quarrel between me and you, and between my herdsmen and your herdsmen, for we are brothers.\n", "9": "The whole land is before you. Separate yourself from me. If you go to the left, I will go to the right; if you go to the right, I will go to the left.\"\n", "10": "Lot lifted up his eyes and saw the whole plain of the Jordan, for all of it was well watered, before the LORD destroyed Sodom and Gomorrah, like the garden of the LORD, like the land of Egypt—this was the plain of Zoar.\n", "11": "So Lot chose for himself the whole plain of the Jordan, and Lot journeyed east. Thus they separated from one another, each going his own way.\n", "12": "Abram settled in the land of Canaan, while Lot settled among the cities of the plain and pitched his tent as far as Sodom.\n", "13": "Now the men of Sodom were wicked and great sinners against the LORD.\n", "14": "The LORD said to Abram, after Lot had separated from him, \"Lift up your eyes and look from the place where you are—northward, southward, eastward, and westward.\n", "15": "For all the land that you see I will give to you and to your descendants forever.\n", "16": "I will make your descendants as the dust of the earth. If anyone can count the dust of the earth, then your descendants can be counted.\"\n", "17": "\"Rise up and walk through the length and breadth of the land, for I will give it to you.\"\n", "18": "Abram pitched his tent and went to live in the oaks of Mamre, which are in Hebron, and there he built an altar to the LORD.\n"}, "notes": "Notes\n- v. 10: \"this was the plain of Zoar\" — \"Zoar\" is a rare name; some traditions read \"Beloved\" or \"the Well.\" \"Zoar\" is retained as a known name in the context of the Jordan plain.\n- v. 18: \"oaks of Mamre\" — \"Mamre\" is a proper name, retained in the translation. The \"oaks\" refer to the terebinth trees, common in such contexts."}, "14": {"verses": {"1": "In the days of Amraphel king of Shinar, Arioch king of Ellasar, Kedorlaomer king of Elam, and Tidal king of the Goiim,\n", "2": "they made war against Bera king of Sodom, Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboiim, and the king of Bela, that is, Zoar.\n", "3": "All of these joined together in the Valley of Siddim, which is the Salt Sea.\n", "4": "They had served Kedorlaomer for twelve years, but in the thirteenth year they rebelled.\n", "5": "And in the fourteenth year, Kedorlaomer came with the kings who were with him, and they defeated the Rephaim in Ashteroth-Karnaim, the Zuzim in Ham, the Emim in the Valley of Kiriathaim,\n", "6": "the Horites in Mount Hermon, Seir, as far as the region of the Arabah, which is in the wilderness.\n", "7": "They returned and came to Eyn Mishpat, which is Kadesh, and they defeated all the land of the Amalekites, and also the Amorites who lived in Hazazon Tamar.\n", "8": "Then the king of Sodom, the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela, that is, Zoar, went out and made war in the Valley of Siddim,\n", "9": "against Kedorlaomer king of Elam, Tidal king of the Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against five.\n", "10": "The Valley of Siddim had pools of bitumen. The kings of Sodom and Gomorrah fled and fell there, while the survivors escaped to the hills.\n", "11": "They took all the goods of Sodom and Gomorrah and their food and went away.\n", "12": "They also took Lot, the nephew of Abram, along with his possessions, for he was living in Sodom.\n", "13": "A fugitive came and reported to Abram the Hebrew, who was living among the terebinth trees of Mamre the Amorite, a brother of Eshkol and of Aner, both of whom were allied to Abram.\n", "14": "When Abram heard that his brother had been captured, he led out his trained men, born in his household, 318 in all, and pursued them to Dan.\n", "15": "During the night, he and his men divided among them and attacked, routing them and chasing them as far as Hobah, which is to the left of Damascus.\n", "16": "He recovered all the goods and also rescued his brother Lot and his possessions, along with the women and the people.\n", "17": "The king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him, at the Valley of the King, which is the Valley of Shaveh.\n", "18": "Melchizedek, king of Salem, brought out bread and wine. He was a priest of God Most High.\n", "19": "He blessed him and said, \"Blessed be Abram by God Most High, Creator of heaven and earth.\n", "20": "And blessed be God Most High, who has delivered your enemies into your hand.\" Abram gave him a tenth of everything.\n", "21": "The king of Sodom said to Abram, \"Give me the people, and take the goods for yourself.\"\n", "22": "Abram replied to the king of Sodom, \"I have lifted my hand to the LORD, God Most High, Creator of heaven and earth,\n", "23": "that I will not take so much as a thread or a sandal strap from what is yours, lest you say, ‘I have made Abram rich.’\"\n", "24": "\"Except for what the young men have eaten, and the share of the men who went with me—Anar, Eshkol, and Mamre. Let them take their share.\"\n"}, "notes": "Notes\n- v. 23: \"So much as a thread or a sandal strap\" renders מִחוּט וְעַד שְׂרֽוֹךְ־נַעַל literally and idiomatically, capturing the idea of taking even the smallest item.\n- v. 23: \"I have made Abram rich\" is a paraphrase of the implied meaning of the Hebrew, not a direct translation of any specific phrase."}, "15": {"verses": {"1": "After these events, the word of the LORD came to Abram in a vision, saying, \"Do not fear, Abram. I am your shield, and your reward will be exceedingly great.\"\n", "2": "Abram said, \"O Lord GOD, what will you give me, since I continue childless, and the heir of my household is Eliezer of Damascus?\"\n", "3": "Abram added, \"You have given me no offspring, and so a servant born in my house will inherit me.\"\n", "4": "But the word of the LORD came to him, \"This one will not inherit you. No, the one who will come from your own body will inherit you.\"\n", "5": "He took him outside and said, \"Look now toward the heavens and count the stars, if you are able to count them.\" He said to him, \"So shall your offspring be.\"\n", "6": "Abram believed the LORD, and he counted it to him as righteousness.\n", "7": "He said to him, \"I am the LORD who brought you from Ur of the Chaldeans to give you this land to possess it.\"\n", "8": "Abram asked, \"O Lord GOD, by what will I know that I will possess it?\"\n", "9": "He said to him, \"Take for me a heifer three years old, a female goat three years old, a ram three years old, a turtledove, and a young pigeon.\"\n", "10": "Abram took all these, cut them in two, and placed each half opposite the other. But he did not cut the birds.\n", "11": "Birds of prey descended on the carcasses, and Abram drove them away.\n", "12": "The sun was about to set, and a deep sleep fell upon Abram. A dark and terrifying shadow passed over him.\n", "13": "He said to Abram, \"Know this for certain: your descendants will be strangers in a land not theirs. They will serve and be oppressed there for four hundred years.\n", "14": "But I will judge the nation they serve, and afterward they will go out with great possessions.\n", "15": "As for you, you will go to your fathers in peace. You will be buried at a good old age.\"\n", "16": "But in the fourth generation they will return here, for the sin of the Amorites is not yet complete.\"\n", "17": "The sun had set, and it was dark. A smoking furnace and a flaming torch passed between the pieces.\n", "18": "On that day the LORD made a covenant with Abram, saying, \"To your offspring I give this land, from the river of Egypt to the great river, the Euphrates:\n", "19": "the Kenite, the Kenezzite, and the Kadmonite,\n", "20": "the Hittite, the Perizzite, and the Rephaim,\n", "21": "the Amorite, the Canaanite, the Girgashite, and the Jebusite.\"\n"}, "notes": "Notes\n- v. 8: \"By what will I know\" — the use of \"בַּמָּה\" is idiomatic, often rendered as \"by what\" or \"in what way.\"\n- v. 16: \"the sin of the Amorites is not yet complete\" — the Hebrew uses \"עֲוֺן\" (iniquity/sin) and \"שָׁלֵם\" (complete/satisfied), indicating a moral or judicial delay.\n- v. 17: \"a smoking furnace and a flaming torch passed between the pieces\" — the imagery is poetic and symbolic, representing the seal of the covenant."}, "16": {"verses": {"1": "Sarai, the wife of Abram, did not bear children for him. She had an Egyptian servant named Hagar.\n", "2": "Sarai said to Abram, \"Look, the LORD has withheld from me the ability to bear children. Please go in to my servant. Perhaps I will have a child through her.\" Abram listened to the voice of Sarai.\n", "3": "Sarai, the wife of Abram, took Hagar the Egyptian, her servant, after Abram had lived ten years in the land of Canaan. She gave her to Abram, her husband, to be his wife.\n", "4": "He went in to Hagar, and she became pregnant. When she saw that she was pregnant, she looked down on her mistress in her eyes.\n", "5": "Sarai said to Abram, \"You have been unjust to me. I gave my servant to your bosom, and when she saw that she was pregnant, she looked down on me. May the LORD be the judge between you and me.\"\n", "6": "Abram said to Sarai, \"Here, your servant is in your power. Do to her what pleases you in your eyes.\" So Sarai treated her harshly, and Hagar fled from her presence.\n", "7": "An angel of the LORD found her by a spring in the wilderness, at the spring on the road to Shur.\n", "8": "He said, \"Hagar, servant of Sarai, where have you come from and where are you going?\" She replied, \"I am fleeing from my mistress Sarai.\"\n", "9": "The angel of the LORD said to her, \"Return to your mistress and be subject to her hand.\"\n", "10": "He said to her, \"I will greatly multiply your offspring, and they will be innumerable because of their abundance.\"\n", "11": "He said to her, \"You are pregnant and will give birth to a son. Name him Ishmael, for the LORD has heard your suffering.\"\n", "12": "He will be a wild man. His hand will be against all, and the hand of all against him. He will dwell over all his brothers.\"\n", "13": "She gave the name of the LORD who had spoken to her: \"You are the God who sees me,\" for she said, \"Have I truly seen the One who sees me?\"\n", "14": "So the well was named Beer-lahai-roi; it is between Kadesh and Bered.\n", "15": "Hagar bore Abram a son, and Abram named the son whom Hagar had borne to him Ishmael.\n", "16": "Abram was eighty-six years old when Hagar bore Ishmael to Abram.\n"}, "notes": "Notes\n- v. 1: \"shifcha\" is translated as \"servant\" rather than \"maidservant\" to align with modern English clarity and the narrative's context.\n- v. 13: \"Ata el ro'i\" is rendered as \"You are the God who sees me,\" reflecting the meaning of the name rather than a direct transliteration.\n- v. 14: \"Beer-lahai-roi\" is transliterated with a brief explanation to preserve the proper name while offering context."}, "17": {"verses": {"1": "Abram was ninety-nine years old when the LORD appeared to him. He said, \"I am El Shaddai. Walk in my presence and be blameless.\n", "2": "I will establish a covenant between me and you. I will multiply you greatly, very greatly.\"\n", "3": "Abram fell on his face, and God spoke to him, saying:\n", "4": "\"I am making this covenant with you. You will be the father of a countless number of nations.\n", "5": "No longer will your name be Abram. Your name will be Abraham, for I have made you the father of a countless number of nations.\n", "6": "I will make you exceedingly fruitful. I will make you into nations, and from you will come forth kings.\n", "7": "I will establish my covenant between me and you, and between your descendants after you, generation after generation, as an everlasting covenant, to be your God and the God of your descendants after you.\n", "8": "I will give to you and to your descendants after you the land of your sojournings, the whole land of Canaan, as a permanent possession. And I will be their God.\n", "9": "God said to Abraham, \"You must keep my covenant, you and your descendants after you, generation after generation.\n", "10": "This is my covenant, which you must keep between me and you and your descendants after you: Every male among you must be circumcised.\n", "11": "You must circumcise the flesh of your foreskins, and it will be a sign of the covenant between me and you.\n", "12": "Every male among you, whether born in your household or bought with your money from a foreign people not of your descendants, must be circumcised at the age of eight days.\n", "13": "Whether born in your household or bought with your money, every male must be circumcised. This will be my covenant in your flesh, an everlasting covenant.\n", "14": "Any male who is not circumcised in the flesh of his foreskin shall be cut off from his people. He has broken my covenant.\"\n", "15": "God said to Abraham, \"As for your wife Sarai, you must no longer call her name Sarai. Her name is Sarah.\n", "16": "I will bless her, and from her I will give you a son. I will bless her, and she will become mothers of nations. Kings of peoples will come from her.\"\n", "17": "Abraham fell on his face, and he laughed. He said to himself, \"Can a son be born to one who is a hundred years old? And can Sarah, who is ninety years old, bear a child?\"\n", "18": "Abraham said to God, \"If only Ishmael might live before you!\"\n", "19": "God said, \"No, but Sarah your wife will bear you a son. His name will be Isaac. I will establish my covenant with him, for an everlasting covenant for his descendants after him.\"\n", "20": "As for Ishmael, I have heard you. I will bless him, and I will multiply him greatly. He will father twelve chieftains, and I will make him into a great nation.\n", "21": "But my covenant I will establish with Isaac, the son whom Sarah will bear to you, in this year at this time, next year.\"\n", "22": "God finished speaking to him, and the presence of God went up from Abraham.\n", "23": "Abraham took Ishmael his son and all those born in his household and all those bought with his money, every male among the men of his household, and circumcised the flesh of their foreskins on the very day God had spoken to him.\n", "24": "Abraham was ninety-nine years old when he was circumcised in the flesh of his foreskin.\n", "25": "Ishmael his son was thirteen years old when he was circumcised in the flesh of his fores", "26": "On the very day Abraham was circumcised, and Ishmael his son.\n", "27": "Every man in his household, whether born in the household or bought with money from a foreigner, was circumcised with him."}, "notes": "Notes\n- v. 14: The Hebrew term נֶפֶשׁ (nephesh) is translated as \"life\" in \"the life shall be cut off,\" which avoids the term \"soul\" and aligns with the glossary instruction to use contextually appropriate terms.\n- v. 15-16: The name change from Sarai to Sarah is presented as a divine directive, with the promise of Sarah becoming \"mothers of nations\" to reflect the Hebrew plural used in reference to her."}, "18": {"verses": {"1": "The LORD appeared to Abraham near the terebinth trees of Mamre as he was sitting at the entrance of his tent in the heat of the day.\n", "2": "He looked up and saw three men standing near him. He looked up and ran to greet them, bowing low to the ground.\n", "3": "He said, \"My lord, if I have found favor in your eyes, please do not pass by your servant.\"\n", "4": "\"Let me bring a little water,\" he said, \"and you can wash your feet and rest under the tree.\n", "5": "I will also bring some bread, so you may refresh yourselves before you continue on, for you have passed by your servant.\" They said, \"Do as you have said.\"\n", "6": "Abraham hurried into the tent to Sarah and said, \"Quick, prepare three measures of fine flour, knead it, and make cakes.\"\n", "7": "Then he ran to the herd, selected a tender and good young bull, and gave it to the servant, who hurried to prepare it.\n", "8": "He took curd and milk and the cooked bull, set it before them, and stood over them under the tree while they ate.\n", "9": "The men said to Abraham, \"Where is your wife Sarah?\" He replied, \"There, in the tent.\"\n", "10": "One of them said, \"I will return to you at the appointed time, and behold, Sarah your wife will have a son.\" Sarah was listening at the entrance of the tent behind him.\n", "11": "Abraham and Sarah were both old, advanced in years. It had ceased to be with Sarah as the way of women.\n", "12": "Sarah laughed to herself, thinking, \"After I have grown old, will I have pleasure? And my master is old!\"\n", "13": "The LORD said to Abraham, \"Why did Sarah laugh, saying, 'Shall I indeed bear a child, when I am so old?'\"\n", "14": "\"Is anything too hard for the LORD?\" he asked. \"I will return to you at the appointed time, and Sarah will have a son.\"\n", "15": "Sarah denied it, saying, \"I did not laugh,\" for she was afraid. But he said, \"Yes, you did laugh.\"\n", "16": "The men left from there and looked toward Sodom, and Abraham walked with them to send them off.\n", "17": "The LORD said, \"Shall I hide from Abraham what I am about to do?\n", "18": "For Abraham will surely become a great and mighty nation, and all the nations of the earth will be blessed through him.\n", "19": "For I have chosen him, so that he may command his children and his household after him to keep the way of the LORD by doing righteousness and justice, so that the LORD may bring to Abraham what he has promised him.\"\n", "20": "The LORD said, \"The outcry of Sodom and Gomorrah is great, and their sin is very grave.\n", "21": "I will go down now and see whether they have done entirely according to the outcry that has come to me, and if not, I will know.\"\n", "22": "The men turned from there and went toward Sodom, while Abraham remained standing before the LORD.\n", "23": "Abraham approached and said, \"Will you indeed destroy the righteous along with the wicked?\n", "24": "Suppose there are fifty righteous in the city. Will you destroy and not spare the place for the sake of the fifty righteous who are in it?\n", "25": "Far be it from you to do such a thing, to kill the righteous with the wicked, so that the righteous is like the wicked. Far be it from you! Shall the Judge of all the earth not do justice?\"\n", "26": "The LORD said, \"If I find fifty righteous in Sodom, I will spare the whole place for their sake.\"\n", "27": "Abraham answered, \"I, though I am but dust and ashes, have taken the liberty to speak to my Lord.\n", "28": "Suppose the fifty righteous are lacking five; will you destroy the whole city because of the five?\" And he said, \"I will not destroy it if I find forty-five there.\"\n", "29": "He continued speaking to him and said, \"Suppose forty are found there.\" He said, \"I will not do it for the sake of forty.\"\n", "30": "He said, \"May my Lord not grow angry, and I will speak just once more. Suppose thirty are found there.\" He said, \"I will not do it if I find thirty there.\"\n", "31": "He said, \"I, though I am but dust and ashes, will speak to my Lord just this once. Suppose twenty are found there.\" He said, \"I will not destroy it for the sake of twenty.\"\n", "32": "He said, \"May my Lord not grow angry, and I will speak yet once more. Suppose ten are found there.\" He said, \"I will not destroy it for the sake of ten.\"\n", "33": "The LORD went his way after he had finished speaking to Abraham, and Abraham returned to his place.\n"}, "notes": "Notes\n- v. 10: \"I will return to you at the appointed time\" — the phrase \"the appointed time\" translates מָאתָה, which is a Hebrew idiom for a specific future moment.\n- v. 15: \"I did not laugh\" — Sarah's denial is a rare case where the context forces a departure from the glossary's \"never 'soul' by default\" for נֶפֶשׁ, which appears here in the phrase \"I did not laugh,\" but it is not used in the sense of 'soul' here.\n- v. 25: \"The righteous is like the wicked\" — the Hebrew כָּרָשָׁע is translated as \"the wicked\" but is used here in comparison, hence the repetition for emphasis.\n- v. 32: \"just this once\" — the Hebrew phrase לַפַּעַם is translated as \"just this once\" to reflect the incremental negotiation in tone and intent."}, "19": {"verses": {"1": "The two angels arrived at Sodom in the evening, and Lot was sitting at the gate of the city. When he saw them, he rose to meet them and bowed low to the ground.\n", "2": "He said, \"Now, my lords, please turn aside to your servant’s house and spend the night, and wash your feet. In the morning you may continue on your journey.\" But they said, \"No, we will spend the night in the square.\"\n", "3": "Yet he urged them strongly, and they turned to him and went into his house. He prepared a meal for them, and they ate.\n", "4": "Before they lay down, the men of the city, the men of Sodom, surrounded the house, from the youngest to the oldest, every one of the people, from every end.\n", "5": "They called to Lot and said, \"Where are the men who came to you tonight? Bring them out to us, so that we may know them.\"\n", "6": "Lot went out to them at the entrance and shut the door behind him.\n", "7": "He said, \"My brothers, don’t act so wickedly.\n", "8": "Here now, I have two daughters who have not known a man. Let me bring them out to you, and you may do to them as you please. But don’t do anything to these men, for it is on account of their shade that I have received you.\"\n", "9": "But they said, \"Stand back!\" And one said, \"This fellow came to live among us as a foreigner, and now he wants to judge us? We will treat you worse than them!\" And they pressed hard on the man, Lot, and came to break down the door.\n", "10": "Then the men reached out and brought Lot into the house with them, and they shut the door behind him.\n", "11": "And they struck the men at the entrance of the house, both small and great, so that they were unable to find the door.\n", "12": "Then the men said to Lot, \"Do you have anyone else here—sons-in-law, sons, daughters, or anything you own in the city? Get out of this place.\n", "13": "For we are about to destroy this place, because the outcry of its people has become great to the Lord. And the Lord has sent us to destroy it.\"\n", "14": "So Lot went out and spoke to his sons-in-law, the ones who were taking his daughters in marriage, and said, \"Get up, leave this place, for the Lord is about to destroy the city.\" But to his sons-in-law it seemed like a joke.\n", "15": "As morning began to break, the angels urged Lot, saying, \"Get up, take your wife and your two daughters who are here, or you will be swept away in the punishment of the city.\"\n", "16": "But he hesitated, and the men had to take hold of his hand, his wife's hand, and the hands of his two daughters by the compassion of the Lord for him, and they led him outside and left him beyond the city.\n", "17": "After they had brought him out, one said, \"Escape for your life! Do not look back or stand anywhere in the valley. Escape to the mountains, or you will be swept away.\"\n", "18": "Lot said to them, \"No, my lords,\n", "19": "for surely I have found favor in your eyes, and your kindness has been great toward me in sparing my life. But I cannot escape to the mountains, for the disaster will overtake me, and I will die.\n", "20": "This city is near, and it is small. Please let me escape there, for it is small, and my life will be spared.\"\n", "21": "He said to him, \"I grant you this favor also, in not overthrowing the city of which you have spoken.\n", "22": "Hurry, escape there, for I cannot do anything until you arrive there.\" And so the city was named Zoar.\n", "23": "The sun had risen over the earth when Lot came to Zoar.\n", "24": "Then the Lord rained down on Sodom and Gomorrah brimstone and fire from the Lord out of the heavens.\n", "25": "He overthrew the cities and all the valley and all the people of the cities and the plants of the land.\n", "26": "His wife, looking back from behind him, became a pillar of salt.\n", "27": "Abraham rose early in the morning to the place where he had stood before the Lord.\n", "28": "He looked toward Sodom and Gomorrah and the entire valley of the land, and he saw the smoke of the land rising like the smoke of a furnace.\n", "29": "When God destroyed the cities of the valley, he remembered Abraham and sent Lot out of the disaster when he overthrew the cities where Lot had lived.\n", "30": "Lot went up from Zoar and lived in the mountains, and his two daughters were with him, for he was afraid to live in Zoar. He lived in a cave with his two daughters.\n", "31": "The older daughter said to the younger, \"Our father is old, and there is no man on earth to come in to us like all the world.\n", "32": "Let us go and give our father wine to drink, and we will lie with him, so we may preserve life from our father.\"\n", "33": "That night they gave their father wine to drink, and the older daughter went in and lay with him. He did not know when she lay down or when she rose.\n", "34": "The next day, the older daughter said to the younger, \"I lay with my father last night. Let us give him wine again tonight, and you go in and lie with him, so we may preserve life from our father.\"\n", "35": "That night they gave their father wine to drink, and the younger daughter went in and lay with him. He did not know when she lay down or when she rose.\n", "36": "So the two daughters of Lot became pregnant by their father.\n", "37": "The older daughter bore a son and named him Moab. He became the ancestor of the Moabites to this day.\n", "38": "The younger daughter also bore a son and named him Ben-Ammi. He became the ancestor of the Ammonites to this day.\n"}, "notes": "Notes\n- v. 34: The phrase \"he did not know\" is idiomatic, indicating lack of awareness or recognition.\n- v. 37: \"Moab\" is a proper name; \"the ancestor of the Moabites\" is a clarifying addition.\n- v. 38: \"Ben-Ammi\" is a proper name; \"the ancestor of the Ammonites\" is a clarifying addition."}, "21": {"verses": {"1": "The LORD visited Sarah as He had said, and He did to Sarah as He had promised.\n", "2": "She became pregnant and gave birth to Abraham a son in his old age, at the time God had appointed for him.\n", "3": "Abraham named the son born to him—whom Sarah had borne—Isaac.\n", "4": "Abraham circumcised his son Isaac when he was eight days old, as God had commanded him.\n", "5": "Abraham was a hundred years old when his son Isaac was born to him.\n", "6": "Sarah said, “God has given me laughter, and everyone who hears of this will laugh with me—Isaac is my laughter!”\n", "7": "And she added, “Who would have told Abraham that Sarah would nurse children? I have indeed borne a son in my old age.”\n", "8": "The boy grew and was weaned, and Abraham held a great feast on the day Isaac was weaned.\n", "9": "But Sarah saw the son of Hagar the Egyptian, whom she had borne to Abraham, laughing.\n", "10": "So she said to Abraham, “Drive out this slave woman and her son, for the son of this slave woman will not inherit with my son Isaac.”\n", "11": "The matter distressed Abraham greatly because his son was his heir.\n", "12": "But God said to Abraham, “Do not let it distress you on account of the boy and your slave woman. Whatever Sarah tells you, listen to her, for through Isaac your descendants will be named.”\n", "13": "And of the son of the slave woman, I will make a nation too, for he is also your offspring.”\n", "14": "At dawn the next day, Abraham took some bread and a skin of water and gave them to Hagar, putting the child on her shoulder. Then he sent her away, and she wandered off into the wilderness of Beersheba.\n", "15": "When the water in the skin was gone, she put the child under one of the desert shrubs.\n", "16": "She went off and sat down opposite him a bowshot away, for she said, “I do not want to watch the child die.” So she sat opposite him and began to weep.\n", "17": "Then God heard the boy crying, and an angel of God called to Hagar from heaven and said to her, “What troubl
