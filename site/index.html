ְרָהָם בְּאָזְנֵי בְנֵי־חֵת לְכֹל בָּאֵי שַֽׁעַר־עִירוֹ לֵאמֹֽר׃", "11": "לֹֽא־אֲדֹנִי שְׁמָעֵנִי הַשָּׂדֶה נָתַתִּי לָךְ וְהַמְּעָרָה אֲשֶׁר־בּוֹ לְךָ נְתַתִּיהָ לְעֵינֵי בְנֵי־עַמִּי נְתַתִּיהָ לָּךְ קְבֹר מֵתֶֽךָ׃", "12": "וַיִּשְׁתַּחוּ אַבְרָהָם לִפְנֵי עַם הָאָֽרֶץ׃", "13": "וַיְדַבֵּר אֶל־עֶפְרוֹן בְּאָזְנֵי עַם־הָאָרֶץ לֵאמֹר אַךְ אִם־אַתָּה לוּ שְׁמָעֵנִי נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי וְאֶקְבְּרָה אֶת־מֵתִי שָֽׁמָּה׃", "14": "וַיַּעַן עֶפְרוֹן אֶת־אַבְרָהָם לֵאמֹר לֽוֹ׃", "15": "אֲדֹנִי שְׁמָעֵנִי אֶרֶץ אַרְבַּע מֵאֹת שֶֽׁקֶל־כֶּסֶף בֵּינִי וּבֵֽינְךָ מַה־הִוא וְאֶת־מֵתְךָ קְבֹֽר׃", "16": "וַיִּשְׁמַע אַבְרָהָם אֶל־עֶפְרוֹן וַיִּשְׁקֹל אַבְרָהָם לְעֶפְרֹן אֶת־הַכֶּסֶף אֲשֶׁר דִּבֶּר בְּאָזְנֵי בְנֵי־חֵת אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף עֹבֵר לַסֹּחֵֽר׃", "17": "וַיָּקָם ׀ שְׂדֵה עֶפְרוֹן אֲשֶׁר בַּמַּכְפֵּלָה אֲשֶׁר לִפְנֵי מַמְרֵא הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר־בּוֹ וְכָל־הָעֵץ אֲשֶׁר בַּשָּׂדֶה אֲשֶׁר בְּכָל־גְּבֻלוֹ סָבִֽיב׃", "18": "לְאַבְרָהָם לְמִקְנָה לְעֵינֵי בְנֵי־חֵת בְּכֹל בָּאֵי שַֽׁעַר־עִירֽוֹ׃", "19": "וְאַחֲרֵי־כֵן קָבַר אַבְרָהָם אֶת־שָׂרָה אִשְׁתּוֹ אֶל־מְעָרַת שְׂדֵה הַמַּכְפֵּלָה עַל־פְּנֵי מַמְרֵא הִוא חֶבְרוֹן בְּאֶרֶץ כְּנָֽעַן׃", "20": "וַיָּקָם הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר־בּוֹ לְאַבְרָהָם לַאֲחֻזַּת־קָבֶר מֵאֵת בְּנֵי־חֵֽת׃"}, "lang": "hbo"}, "24": {"verses": {"1": "Abraham was old, advanced in years. The LORD had blessed Abraham in all things.", "2": "He said to his servant, the elder of his household, who was in charge of all he had, \"Place your hand under my thigh,", "3": "and I will make you swear by the LORD, the God of heaven and the God of earth, that you will not take a wife for my son from the daughters of the Canaanites, among whom I live.", "4": "But you must go to my land and to my family, and take a wife for my son Isaac.\"", "5": "The servant said to him, \"What if the woman is not willing to come back with me to this land? Should I bring your son back to the land from which you came?\"", "6": "Abraham said to him, \"Beware that you do not return my son there.", "7": "The LORD, the God of heaven, who brought me from my father's house and from the land of my birth and who spoke to me and swore to me, saying, 'To your offspring I will give this land,' He will send His angel before you, and you will take a wife for my son from there.", "8": "If the woman is not willing to follow you, you will be free from this oath of mine. Only do not return my son there.\"", "9": "The servant placed his hand under Abraham's thigh and swore to him concerning that matter.", "10": "Then the servant took ten of his master's camels, and all the good things of his master were in his hand. He rose and went to Aram-Naharaim, to the city of Nahor.", "11": "He blessed the camels outside the city at the well of water at the time of evening, at the time of the women coming to draw water.", "12": "He said, \"O LORD, God of my master Abraham, please cause me to find favor in your sight and do kindness with my master Abraham.", "13": "I stand by the spring of water, and the daughters of the men of the city are coming out to draw water.", "14": "May it be that the young woman to whom I say, 'Lower your jar, that I may drink,' and she says, 'Drink, and I will also water your camels,' she will be the one you have appointed for your servant Isaac. Then I will know that you have shown kindness to my master.\"", "15": "It had not yet finished speaking when here was Rebekah, the daughter of Bethuel son of Milcah, the wife of Nahor, Abraham's brother, coming out with her jar on her shoulder.", "16": "The young woman was very good-looking, a virgin, and no man had known her. She went down to the spring, filled her jar, and came up.", "17": "The servant ran to meet her and said, \"Please let me have a little water to drink from your jar.\"", "18": "She said, \"Drink, my lord,\" and quickly lowered her jar to her hand and gave him a drink.", "19": "After she had given him a drink, she said, \"I will also water your camels until they have finished drinking.\"", "20": "She quickly emptied her jar into the trough and ran again to the well to draw water, and she watered all the camels.", "21": "The man was watching her in silence to know whether the LORD had made his journey successful or not.", "22": "When the camels had finished drinking, the man took out a gold ring weighing a half-shekel, and two gold bracelets for her hands, weighing ten shekels.", "23": "He said, \"Whose daughter are you? Please tell me, is there a place for us to stay?\"", "24": "She said to him, \"I am the daughter of Bethuel, the son of Nahor, whom Milcah bore.\"", "25": "She added, \"We also have plenty of straw and feed, and also a place to spend the night.\"", "26": "The man bowed down before the LORD.", "27": "He said, \"Blessed be the LORD, the God of my master Abraham, who has not abandoned His kindness and faithfulness toward me. The LORD led me on the way to the house of my master's brothers.\"", "28": "The young woman ran and told her household about these things.", "29": "Now Rebekah had a brother named Laban, and Laban ran out to the man at the spring.", "30": "When Laban saw the ring and the bracelets on his sister's hands, and heard his sister Rebekah speak, saying, \"This is how the man spoke to me,\" he went to the man and there he was, standing by the camels at the spring.", "31": "He said, \"Come in, blessed be the LORD. Why do you stand outside? I have made the house ready, and a place for the camels.\"", "32": "The man went into the house, and he untied the camels, and gave straw and feed to the camels, and water to wash his feet and the feet of the men who were with him.", "33": "He set food before him. He said, \"I will not eat until I have spoken my words.\" He said, \"Speak.\"", "34": "He said, \"I am the servant of Abraham.\"", "35": "\"The LORD has greatly blessed my master, and he has become great. He has given him sheep and cattle, silver and gold, male and female servants, and camels and donkeys.", "36": "Sarah, my master's wife, bore a son to my master in his old age, and he gave him everything he has.\"", "37": "\"My master made me swear, saying, 'You must not take a wife for my son from the daughters of the Canaanites, in whose land I live.", "38": "But you must go to my father's house and to my family, and take a wife for my son.'\"", "39": "\"I said to my master, 'What if the woman is not willing to come with me?'", "40": "He said to me, 'The LORD, before whom I walk, will send His angel with you and make your journey successful, and you will take a wife for my son from my father's family and from my father's house.'", "41": "Then you will be free from your oath if you go to my family and they do not give her to you. But if they give her to you, then you will be free from your oath.\"", "42": "\"I came today to the spring and said, 'O LORD, God of my master Abraham, please let me find success in my journey, the one on which I walk.", "43": "I stand by the spring of water, and the young woman who comes out to draw water, I will say to her, 'Please give me a little water to drink from your jar.'", "44": "She will say to me, 'Drink, and I will also water your camels.' That will be the woman the LORD has appointed for the son of my master.'\"", "45": "\"I had not yet finished speaking in my heart when behold, Rebekah came, with her jar on her shoulder. She went down to the spring and drew water, and I said to her, 'Please give me to drink.'\"", "46": "\"She quickly lowered her jar from her shoulder and said, 'Drink, and I will also water your camel.' I drank, and the camel also drank.", "47": "I asked her, 'Whose daughter are you?' She said, 'I am the daughter of Bethuel, the son of Nahor, whom Milcah bore.' I put the ring on her nose and the bracelets on her hands.", "48": "I bowed down before the LORD and blessed the LORD, the God of my master Abraham, who had led me on a true path to take the daughter of my master's brother for his son.\"", "49": "\"Now then, if you will show kindness and faithfulness to my master, tell me, and if not, tell me, and I will turn to the right or to the left.\"", "50": "Laban and Bethuel answered, \"This matter has come from the LORD; we cannot speak to you either good or bad.", "51": "Here is Rebekah before you. Take her and go, and let her be a wife to your master's son, just as the LORD has spoken.\"", "52": "When the servant heard their words, he bowed to the ground before the LORD.", "53": "Then the servant brought out articles of silver, articles of gold, and garments, and gave them to Rebekah. He also gave gifts to her brother and to her mother.", "54": "They ate and drank, he and the men who were with him, and they spent the night there. He rose in the morning, and said, \"Let me now go to my master.\"", "55": "Her brother and her mother said, \"Let the young woman stay with us a few days, ten or so, and then she may go.\"", "56": "But he said to them, \"Do not delay me, for the LORD has made my journey successful. Let me go so that I may go to my master.\"", "57": "They said, \"We will call the young woman and ask her what she thinks.\"", "58": "They called Rebekah and said to her, \"Will you go with this man?\" She said, \"I will go.\"", "59": "So they sent their sister Rebekah, along with her nurse and Abraham's servant and his men.", "60": "They blessed Rebekah and said to her, \"Our sister, may you become thousands of myriads, and may your offspring possess the gates of those who hate them.\"", "61": "Rebekah and her young women rose and mounted the camels, and they followed the man. The servant took Rebekah and went away.", "62": "Isaac had come from Beer-lahai-roi and was living in the Negev.", "63": "Isaac went out to meditate in the field in the evening, and he lifted his eyes and saw, and behold, camels were coming.", "64": "Rebekah lifted her eyes and saw Isaac. She dismounted from the camel.", "65": "She said to the servant, \"Who is that man walking in the field toward us?\" The servant said, \"That is my master.\" She took the veil and covered herself.", "66": "The servant told Isaac all the things he had done.", "67": "Isaac brought Rebekah into the tent of Sarah his mother. He took Rebekah and she became his wife, and he loved her. Isaac was comforted after his mother's death."}, "notes": "Notes\n- v. 1: \"advanced in years\" reflects the Hebrew's \"בָּא בַּיָּמִים\" which literally means \"came in the days.\"\n- v. 5: \"the land from which you came\" refers to the land of Ur, not explicitly named, as the text does not mention it.\n- v. 14: \"showed kindness to my master\" reflects the Hebrew's \"עָשִׂיתָ חֶסֶד עִם־אֲדֹנִֽי,\" where \"חֶסֶד\" is translated as \"kindness\" or \"steadfast love.\"\n- v. 21: \"the LORD had made his journey successful\" reflects the Hebrew's \"הֹכִיחַ יְהוָה לְבֶן־אֲדֹנִֽי,\" where \"הֹכִיחַ\" is translated as \"made successful.\"\n- v. 48: \"led me on a true path\" reflects the Hebrew's \"הִנְחַנִּי בְּדֶרֶךְ אֱמֶת,\" where \"הִנְחַנִּי\" is translated as \"led me.\"\n- v. 67: \"was comforted after his mother's death\" assumes the narrative context that Sarah, Isaac's mother, had died before this point.", "src": {"1": "וְאַבְרָהָם זָקֵן בָּא בַּיָּמִים וַֽיהוָה בֵּרַךְ אֶת־אַבְרָהָם בַּכֹּֽל׃", "2": "וַיֹּאמֶר אַבְרָהָם אֶל־עַבְדּוֹ זְקַן בֵּיתוֹ הַמֹּשֵׁל בְּכָל־אֲשֶׁר־לוֹ שִֽׂים־נָא יָדְךָ תַּחַת יְרֵכִֽי׃", "3": "וְאַשְׁבִּיעֲךָ בַּֽיהוָה אֱלֹהֵי הַשָּׁמַיִם וֵֽאלֹהֵי הָאָרֶץ אֲשֶׁר לֹֽא־תִקַּח אִשָּׁה לִבְנִי מִבְּנוֹת הַֽכְּנַעֲנִי אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּֽוֹ׃", "4": "כִּי אֶל־אַרְצִי וְאֶל־מוֹלַדְתִּי תֵּלֵךְ וְלָקַחְתָּ אִשָּׁה לִבְנִי לְיִצְחָֽק׃", "5": "וַיֹּאמֶר אֵלָיו הָעֶבֶד אוּלַי לֹא־תֹאבֶה הָֽאִשָּׁה לָלֶכֶת אַחֲרַי אֶל־הָאָרֶץ הַזֹּאת הֶֽהָשֵׁב אָשִׁיב אֶת־בִּנְךָ אֶל־הָאָרֶץ אֲשֶׁר־יָצָאתָ מִשָּֽׁם׃", "6": "וַיֹּאמֶר אֵלָיו אַבְרָהָם הִשָּׁמֶר לְךָ פֶּן־תָּשִׁיב אֶת־בְּנִי שָֽׁמָּה׃", "7": "יְהוָה ׀ אֱלֹהֵי הַשָּׁמַיִם אֲשֶׁר לְקָחַנִי מִבֵּית אָבִי וּמֵאֶרֶץ מֽוֹלַדְתִּי וַאֲשֶׁר דִּבֶּר־לִי וַאֲשֶׁר נִֽשְׁבַּֽע־לִי לֵאמֹר לְזַרְעֲךָ אֶתֵּן אֶת־הָאָרֶץ הַזֹּאת הוּא יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּֽׁם׃", "8": "וְאִם־לֹא תֹאבֶה הָֽאִשָּׁה לָלֶכֶת אַחֲרֶיךָ וְנִקִּיתָ מִשְּׁבֻעָתִי זֹאת רַק אֶת־בְּנִי לֹא תָשֵׁב שָֽׁמָּה׃", "9": "וַיָּשֶׂם הָעֶבֶד אֶת־יָדוֹ תַּחַת יֶרֶךְ אַבְרָהָם אֲדֹנָיו וַיִּשָּׁבַֽע לוֹ עַל־הַדָּבָר הַזֶּֽה׃", "10": "וַיִּקַּח הָעֶבֶד עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו וַיֵּלֶךְ וְכָל־טוּב אֲדֹנָיו בְּיָדוֹ וַיָּקָם וַיֵּלֶךְ אֶל־אֲרַם נַֽהֲרַיִם אֶל־עִיר נָחֽוֹר׃", "11": "וַיַּבְרֵךְ הַגְּמַלִּים מִחוּץ לָעִיר אֶל־בְּאֵר הַמָּיִם לְעֵת עֶרֶב לְעֵת צֵאת הַשֹּׁאֲבֹֽת׃", "12": "וַיֹּאמַר ׀ יְהוָה אֱלֹהֵי אֲדֹנִי אַבְרָהָם הַקְרֵה־נָא לְפָנַי הַיּוֹם וַעֲשֵׂה־חֶסֶד עִם אֲדֹנִי אַבְרָהָֽם׃", "13": "הִנֵּה אָנֹכִי נִצָּב עַל־עֵין הַמָּיִם וּבְנוֹת אַנְשֵׁי הָעִיר יֹצְאֹת לִשְׁאֹב מָֽיִם׃", "14": "וְהָיָה הַֽנַּעֲרָ אֲשֶׁר אֹמַר אֵלֶיהָ הַטִּי־נָא כַדֵּךְ וְאֶשְׁתֶּה וְאָמְרָה שְׁתֵה וְגַם־גְּמַלֶּיךָ אַשְׁקֶה אֹתָהּ הֹכַחְתָּ לְעַבְדְּךָ לְיִצְחָק וּבָהּ אֵדַע כִּי־עָשִׂיתָ חֶסֶד עִם־אֲדֹנִֽי׃", "15": "וַֽיְהִי־הוּא טֶרֶם כִּלָּה לְדַבֵּר וְהִנֵּה רִבְקָה יֹצֵאת אֲשֶׁר יֻלְּדָה לִבְתוּאֵל בֶּן־מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם וְכַדָּהּ עַל־שִׁכְמָֽהּ׃", "16": "וְהַֽנַּעֲרָ טֹבַת מַרְאֶה מְאֹד בְּתוּלָה וְאִישׁ לֹא יְדָעָהּ וַתֵּרֶד הָעַיְנָה וַתְּמַלֵּא כַדָּהּ וַתָּֽעַל׃", "17": "וַיָּרָץ הָעֶבֶד לִקְרָאתָהּ וַיֹּאמֶר הַגְמִיאִינִי נָא מְעַט־מַיִם מִכַּדֵּֽךְ׃", "18": "וַתֹּאמֶר שְׁתֵה אֲדֹנִי וַתְּמַהֵר וַתֹּרֶד כַּדָּהּ עַל־יָדָהּ וַתַּשְׁקֵֽהוּ׃", "19": "וַתְּכַל לְהַשְׁקֹתוֹ וַתֹּאמֶר גַּם לִגְמַלֶּיךָ אֶשְׁאָב עַד אִם־כִּלּוּ לִשְׁתֹּֽת׃", "20": "וַתְּמַהֵר וַתְּעַר כַּדָּהּ אֶל־הַשֹּׁקֶת וַתָּרָץ עוֹד אֶֽל־הַבְּאֵר לִשְׁאֹב וַתִּשְׁאַב לְכָל־גְּמַלָּֽיו׃", "21": "וְהָאִישׁ מִשְׁתָּאֵה לָהּ מַחֲרִישׁ לָדַעַת הַֽהִצְלִיחַ יְהוָה דַּרְכּוֹ אִם־לֹֽא׃", "22": "וַיְהִי כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת וַיִּקַּח הָאִישׁ נֶזֶם זָהָב בֶּקַע מִשְׁקָלוֹ וּשְׁנֵי צְמִידִים עַל־יָדֶיהָ עֲשָׂרָה זָהָב מִשְׁקָלָֽם׃", "23": "וַיֹּאמֶר בַּת־מִי אַתְּ הַגִּידִי נָא לִי הֲיֵשׁ בֵּית־אָבִיךְ מָקוֹם לָנוּ לָלִֽין׃", "24": "וַתֹּאמֶר אֵלָיו בַּת־בְּתוּאֵל אָנֹכִי בֶּן־מִלְכָּה אֲשֶׁר יָלְדָה לְנָחֽוֹר׃", "25": "וַתֹּאמֶר אֵלָיו גַּם־תֶּבֶן גַּם־מִסְפּוֹא רַב עִמָּנוּ גַּם־מָקוֹם לָלֽוּן׃", "26": "וַיִּקֹּד הָאִישׁ וַיִּשְׁתַּחוּ לַֽיהוָֽה׃", "27": "וַיֹּאמֶר בָּרוּךְ יְהוָה אֱלֹהֵי אֲדֹנִי אַבְרָהָם אֲשֶׁר לֹֽא־עָזַב חַסְדּוֹ וַאֲמִתּוֹ מֵעִם אֲדֹנִי אָנֹכִי בַּדֶּרֶךְ נָחַנִי יְהוָה בֵּית אֲחֵי אֲדֹנִֽי׃", "28": "וַתָּרָץ הַֽנַּעֲרָ וַתַּגֵּד לְבֵית אִמָּהּ כַּדְּבָרִים הָאֵֽלֶּה׃", "29": "וּלְרִבְקָה אָח וּשְׁמוֹ לָבָן וַיָּרָץ לָבָן אֶל־הָאִישׁ הַחוּצָה אֶל־הָעָֽיִן׃", "30": "וַיְהִי ׀ כִּרְאֹת אֶת־הַנֶּזֶם וְֽאֶת־הַצְּמִדִים עַל־יְדֵי אֲחֹתוֹ וּכְשָׁמְעוֹ אֶת־דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר כֹּֽה־דִבֶּר אֵלַי הָאִישׁ וַיָּבֹא אֶל־הָאִישׁ וְהִנֵּה עֹמֵד עַל־הַגְּמַלִּים עַל־הָעָֽיִן׃", "31": "וַיֹּאמֶר בּוֹא בְּרוּךְ יְהוָה לָמָּה תַעֲמֹד בַּחוּץ וְאָנֹכִי פִּנִּיתִי הַבַּיִת וּמָקוֹם לַגְּמַלִּֽים׃", "32": "וַיָּבֹא הָאִישׁ הַבַּיְתָה וַיְפַתַּח הַגְּמַלִּים וַיִּתֵּן תֶּבֶן וּמִסְפּוֹא לַגְּמַלִּים וּמַיִם לִרְחֹץ רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּֽוֹ׃", "33": "וַיּוּשַׂם לְפָנָיו לֶאֱכֹל וַיֹּאמֶר לֹא אֹכַל עַד אִם־דִּבַּרְתִּי דְּבָרָי וַיֹּאמֶר דַּבֵּֽר׃", "34": "וַיֹּאמַר עֶבֶד אַבְרָהָם אָנֹֽכִי׃", "35": "וַיהוָה בֵּרַךְ אֶת־אֲדֹנִי מְאֹד וַיִּגְדָּל וַיִּתֶּן־לוֹ צֹאן וּבָקָר וְכֶסֶף וְזָהָב וַעֲבָדִם וּשְׁפָחֹת וּגְמַלִּים וַחֲמֹרִֽים׃", "36": "וַתֵּלֶד שָׂרָה אֵשֶׁת אֲדֹנִי בֵן לַֽאדֹנִי אַחֲרֵי זִקְנָתָהּ וַיִּתֶּן־לּוֹ אֶת־כָּל־אֲשֶׁר־לֽוֹ׃", "37": "וַיַּשְׁבִּעֵנִי אֲדֹנִי לֵאמֹר לֹא־תִקַּח אִשָּׁה לִבְנִי מִבְּנוֹת הַֽכְּנַעֲנִי אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצֽוֹ׃", "38": "אִם־לֹא אֶל־בֵּית־אָבִי תֵּלֵךְ וְאֶל־מִשְׁפַּחְתִּי וְלָקַחְתָּ אִשָּׁה לִבְנִֽי׃", "39": "וָאֹמַר אֶל־אֲדֹנִי אֻלַי לֹא־תֵלֵךְ הָאִשָּׁה אַחֲרָֽי׃", "40": "וַיֹּאמֶר אֵלָי יְהוָה אֲשֶׁר־הִתְהַלַּכְתִּי לְפָנָיו יִשְׁלַח מַלְאָכוֹ אִתָּךְ וְהִצְלִיחַ דַּרְכֶּךָ וְלָקַחְתָּ אִשָּׁה לִבְנִי מִמִּשְׁפַּחְתִּי וּמִבֵּית אָבִֽי׃", "41": "אָז תִּנָּקֶה מֵאָלָתִי כִּי תָבוֹא אֶל־מִשְׁפַּחְתִּי וְאִם־לֹא יִתְּנוּ לָךְ וְהָיִיתָ נָקִי מֵאָלָתִֽי׃", "42": "וָאָבֹא הַיּוֹם אֶל־הָעָיִן וָאֹמַר יְהוָה אֱלֹהֵי אֲדֹנִי אַבְרָהָם אִם־יֶשְׁךָ־נָּא מַצְלִיחַ דַּרְכִּי אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶֽיהָ׃", "43": "הִנֵּה אָנֹכִי נִצָּב עַל־עֵין הַמָּיִם וְהָיָה הָֽעַלְמָה הַיֹּצֵאת לִשְׁאֹב וְאָמַרְתִּי אֵלֶיהָ הַשְׁקִֽינִי־נָא מְעַט־מַיִם מִכַּדֵּֽךְ׃", "44": "וְאָמְרָה אֵלַי גַּם־אַתָּה שְׁתֵה וְגַם לִגְמַלֶּיךָ אֶשְׁאָב הִוא הָֽאִשָּׁה אֲשֶׁר־הֹכִיחַ יְהוָה לְבֶן־אֲדֹנִֽי׃", "45": "אֲנִי טֶרֶם אֲכַלֶּה לְדַבֵּר אֶל־לִבִּי וְהִנֵּה רִבְקָה יֹצֵאת וְכַדָּהּ עַל־שִׁכְמָהּ וַתֵּרֶד הָעַיְנָה וַתִּשְׁאָב וָאֹמַר אֵלֶיהָ הַשְׁקִינִי נָֽא׃", "46": "וַתְּמַהֵר וַתּוֹרֶד כַּדָּהּ מֵֽעָלֶיהָ וַתֹּאמֶר שְׁתֵה וְגַם־גְּמַלֶּיךָ אַשְׁקֶה וָאֵשְׁתְּ וְגַם הַגְּמַלִּים הִשְׁקָֽתָה׃", "47": "וָאֶשְׁאַל אֹתָהּ וָאֹמַר בַּת־מִי אַתְּ וַתֹּאמֶר בַּת־בְּתוּאֵל בֶּן־נָחוֹר אֲשֶׁר יָֽלְדָה־לּוֹ מִלְכָּה וָאָשִׂם הַנֶּזֶם עַל־אַפָּהּ וְהַצְּמִידִים עַל־יָדֶֽיהָ׃", "48": "וָאֶקֹּד וָֽאֶשְׁתַּחֲוֶה לַיהוָה וָאֲבָרֵךְ אֶת־יְהוָה אֱלֹהֵי אֲדֹנִי אַבְרָהָם אֲשֶׁר הִנְחַנִי בְּדֶרֶךְ אֱמֶת לָקַחַת אֶת־בַּת־אֲחִי אֲדֹנִי לִבְנֽוֹ׃", "49": "וְעַתָּה אִם־יֶשְׁכֶם עֹשִׂים חֶסֶד וֶֽאֱמֶת אֶת־אֲדֹנִי הַגִּידוּ לִי וְאִם־לֹא הַגִּידוּ לִי וְאֶפְנֶה עַל־יָמִין אוֹ עַל־שְׂמֹֽאל׃", "50": "וַיַּעַן לָבָן וּבְתוּאֵל וַיֹּאמְרוּ מֵיְהוָה יָצָא הַדָּבָר לֹא נוּכַל דַּבֵּר אֵלֶיךָ רַע אוֹ־טֽוֹב׃", "51": "הִנֵּֽה־רִבְקָה לְפָנֶיךָ קַח וָלֵךְ וּתְהִי אִשָּׁה לְבֶן־אֲדֹנֶיךָ כַּאֲשֶׁר דִּבֶּר יְהוָֽה׃", "52": "וַיְהִי כַּאֲשֶׁר שָׁמַע עֶבֶד אַבְרָהָם אֶת־דִּבְרֵיהֶם וַיִּשְׁתַּחוּ אַרְצָה לַֽיהוָֽה׃", "53": "וַיּוֹצֵא הָעֶבֶד כְּלֵי־כֶסֶף וּכְלֵי זָהָב וּבְגָדִים וַיִּתֵּן לְרִבְקָה וּמִגְדָּנֹת נָתַן לְאָחִיהָ וּלְאִמָּֽהּ׃", "54": "וַיֹּאכְלוּ וַיִּשְׁתּוּ הוּא וְהָאֲנָשִׁים אֲשֶׁר־עִמּוֹ וַיָּלִינוּ וַיָּקוּמוּ בַבֹּקֶר וַיֹּאמֶר שַׁלְּחֻנִי לַֽאדֹנִֽי׃", "55": "וַיֹּאמֶר אָחִיהָ וְאִמָּהּ תֵּשֵׁב הַנַּעֲרָ אִתָּנוּ יָמִים אוֹ עָשׂוֹר אַחַר תֵּלֵֽךְ׃", "56": "וַיֹּאמֶר אֲלֵהֶם אַל־תְּאַחֲרוּ אֹתִי וַֽיהוָה הִצְלִיחַ דַּרְכִּי שַׁלְּחוּנִי וְאֵלְכָה לַֽאדֹנִֽי׃", "57": "וַיֹּאמְרוּ נִקְרָא לַֽנַּעֲרָ וְנִשְׁאֲלָה אֶת־פִּֽיהָ׃", "58": "וַיִּקְרְאוּ לְרִבְקָה וַיֹּאמְרוּ אֵלֶיהָ הֲתֵלְכִי עִם־הָאִישׁ הַזֶּה וַתֹּאמֶר אֵלֵֽךְ׃", "59": "וַֽיְשַׁלְּחוּ אֶת־רִבְקָה אֲחֹתָם וְאֶת־מֵנִקְתָּהּ וְאֶת־עֶבֶד אַבְרָהָם וְאֶת־אֲנָשָֽׁיו׃", "60": "וַיְבָרֲכוּ אֶת־רִבְקָה וַיֹּאמְרוּ לָהּ אֲחֹתֵנוּ אַתְּ הֲיִי לְאַלְפֵי רְבָבָה וְיִירַשׁ זַרְעֵךְ אֵת שַׁעַר שֹׂנְאָֽיו׃", "61": "וַתָּקָם רִבְקָה וְנַעֲרֹתֶיהָ וַתִּרְכַּבְנָה עַל־הַגְּמַלִּים וַתֵּלַכְנָה אַחֲרֵי הָאִישׁ וַיִּקַּח הָעֶבֶד אֶת־רִבְקָה וַיֵּלַֽךְ׃", "62": "וְיִצְחָק בָּא מִבּוֹא בְּאֵר לַחַי רֹאִי וְהוּא יוֹשֵׁב בְּאֶרֶץ הַנֶּֽגֶב׃", "63": "וַיֵּצֵא יִצְחָק לָשׂוּחַ בַּשָּׂדֶה לִפְנוֹת עָרֶב וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה גְמַלִּים בָּאִֽים׃", "64": "וַתִּשָּׂא רִבְקָה אֶת־עֵינֶיהָ וַתֵּרֶא אֶת־יִצְחָק וַתִּפֹּל מֵעַל הַגָּמָֽל׃", "65": "וַתֹּאמֶר אֶל־הָעֶבֶד מִֽי־הָאִישׁ הַלָּזֶה הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ וַיֹּאמֶר הָעֶבֶד הוּא אֲדֹנִי וַתִּקַּח הַצָּעִיף וַתִּתְכָּֽס׃", "66": "וַיְסַפֵּר הָעֶבֶד לְיִצְחָק אֵת כָּל־הַדְּבָרִים אֲשֶׁר עָשָֽׂה׃", "67": "וַיְבִאֶהָ יִצְחָק הָאֹהֱלָה שָׂרָה אִמּוֹ וַיִּקַּח אֶת־רִבְקָה וַתְּהִי־לוֹ לְאִשָּׁה וַיֶּאֱהָבֶהָ וַיִּנָּחֵם יִצְחָק אַחֲרֵי אִמּֽוֹ׃"}, "lang": "hbo"}}};

const ABBREV = {"gen": "Genesis", "ex": "Exodus", "exod": "Exodus", "lev": "Leviticus", "num": "Numbers", "deut": "Deuteronomy", "dt": "Deuteronomy", "josh": "Joshua", "judg": "Judges", "1sam": "1_Samuel", "2sam": "2_Samuel", "1kgs": "1_Kings", "2kgs": "2_Kings", "1chr": "1_Chronicles", "2chr": "2_Chronicles", "neh": "Nehemiah", "esth": "Esther", "ps": "Psalms", "psa": "Psalms", "prov": "Proverbs", "eccl": "Ecclesiastes", "song": "Song_of_Songs", "isa": "Isaiah", "jer": "Jeremiah", "lam": "Lamentations", "ezek": "Ezekiel", "dan": "Daniel", "hos": "Hosea", "obad": "Obadiah", "mic": "Micah", "nah": "Nahum", "hab": "Habakkuk", "zeph": "Zephaniah", "hag": "Haggai", "zech": "Zechariah", "mal": "Malachi", "matt": "Matthew", "mt": "Matthew", "mk": "Mark", "lk": "Luke", "jn": "John", "rom": "Romans", "1cor": "1_Corinthians", "2cor": "2_Corinthians", "gal": "Galatians", "eph": "Ephesians", "phil": "Philippians", "col": "Colossians", "1thess": "1_Thessalonians", "2thess": "2_Thessalonians", "1tim": "1_Timothy", "2tim": "2_Timothy", "phlm": "Philemon", "heb": "Hebrews", "jas": "James", "1pet": "1_Peter", "2pet": "2_Peter", "1jn": "1_John", "2jn": "2_John", "3jn": "3_John", "rev": "Revelation"};
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const $ = s => document.querySelector(s);
const disp = b => b.replace(/_/g," ");

const allBooks = Object.keys(ORDER).sort((a,b) => ORDER[a]-ORDER[b]);
const haveBooks = allBooks.filter(b => DATA[b]);

/* ---------- text size ---------- */
let fs = +(localStorage.getItem("fs") || 18);
const applyFs = () => document.documentElement.style.setProperty("--fs", fs + "px");
applyFs();
$("#fsMinus").onclick = () => { fs = Math.max(14, fs - 1); localStorage.setItem("fs", fs); applyFs(); };
$("#fsPlus").onclick  = () => { fs = Math.min(26, fs + 1); localStorage.setItem("fs", fs); applyFs(); };

/* ---------- navigation ---------- */
function navRender(current) {
  let html = "", lastT = "";
  for (const b of allBooks) {
    const t = ORDER[b] <= 39 ? "Old Testament" : "New Testament";
    if (t !== lastT) { html += `<div class="t">${t}</div>`; lastT = t; }
    html += `<a href="#${b}/1" class="${DATA[b]?'':'missing'} ${b===current?'on':''}">${disp(b)}</a>`;
  }
  $("#books").innerHTML = html;
  const sel = $("#bookSel");
  sel.innerHTML = haveBooks.map(b =>
    `<option value="${b}" ${b===current?'selected':''}>${disp(b)}</option>`).join("");
}
$("#bookSel").addEventListener("change", e => location.hash = `#${e.target.value}/1`);

function chapterList(book){ return Object.keys(DATA[book]).map(Number).sort((a,b)=>a-b); }

function neighbours(book, ch) {
  const chs = chapterList(book);
  const i = chs.indexOf(+ch);
  let prev = i > 0 ? {b:book, c:chs[i-1]} : null;
  let next = i < chs.length-1 ? {b:book, c:chs[i+1]} : null;
  const bi = haveBooks.indexOf(book);
  if (!prev && bi > 0) { const pb = haveBooks[bi-1]; prev = {b:pb, c:chapterList(pb).at(-1)}; }
  if (!next && bi < haveBooks.length-1) { const nb = haveBooks[bi+1]; next = {b:nb, c:chapterList(nb)[0]}; }
  return {prev, next};
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ---------- language view: en | orig | par ---------- */
let view = localStorage.getItem("view") || "en";
function setView(v){ view = v; localStorage.setItem("view", v); route(); }
const vtag = (src, n) => src._lang ? `<span class="lt">${LANGS[src._lang[n]].name}</span>` : "";

function renderChapter(book, ch, highlightVerse) {
  const chData = DATA[book] && DATA[book][ch];
  const main = $("#main");
  navRender(book);
  if (!chData) { main.innerHTML = `<p class="empty">${disp(book)} ${ch} has not been translated yet.</p>`; return; }
  const chs = chapterList(book);
  let html = `<h2>${disp(book)} ${ch}${chData.lang ? ` <small class="lang">${LANGS[chData.lang].name}</small>` : ""}</h2>`;
  html += `<div class="chnav">` + chs.map(c =>
    `<a href="#${book}/${c}" class="${c==ch?'on':''}">${c}</a>`).join("") + `</div>`;
  const src = chData.src, lang = chData.lang || "hbo", L = LANGS[lang];
  const rtl = L.dir === "rtl", ocls = "orig " + L.script.toLowerCase();
  const v = src ? view : "en";
  if (src) html += `<div class="tabs">
    <a class="${v==='en'?'on':''}" onclick="setView('en')">English</a>
    <a class="${v==='orig'?'on':''}" onclick="setView('orig')">${L.name}</a>
    <a class="${v==='par'?'on':''}" onclick="setView('par')">Side by side</a></div>`;
  main.className = v === "par" ? "wide" : "";
  const nums = Object.keys(v === "en" ? chData.verses : src).filter(k => k !== "_lang").map(Number).sort((a,b)=>a-b);
  if (v === "orig") {
    for (const n of nums)
      html += `<p class="ov ${ocls}" dir="${rtl?'rtl':'ltr'}" id="v-${book}-${ch}-${n}"><sup class="v">${n}</sup>${vtag(src,n)}${esc(src[n])}</p>`;
  } else if (v === "par") {
    html += `<div class="par">`;
    for (const n of nums) {
      const e = chData.verses[n];
      html += `<div class="o ${ocls}" dir="${rtl?'rtl':'ltr'}"><sup class="v">${n}</sup>${vtag(src,n)}${esc(src[n])}</div>
        <div class="e" id="v-${book}-${ch}-${n}"><sup class="v">${n}</sup>${e ? esc(e).replace(/\n\n/g,"\n").trim() : "<i style='color:var(--muted)'>—</i>"}</div>`;
    }
    html += `</div>`;
  }
  let para = [];
  const flush = () => { if (para.length) { html += `<p class="vv">${para.join(" ")}</p>`; para = []; } };
  for (const n of (v === "en" ? nums : [])) {
    const t = chData.verses[n];
    const vid = `v-${book}-${ch}-${n}`;
    if (t.includes("\n")) {
      flush();
      html += `<div class="poetry" id="${vid}"><sup class="v">${n}</sup>${esc(t).replace(/\n\n/g,"\n").trimEnd()}</div>`;
    } else {
      para.push(`<span id="${vid}"><sup class="v">${n}</sup>${esc(t)}</span>`);
    }
  }
  flush();
  if (chData.notes) {
    html += `<div class="notes">${esc(chData.notes).replace(/^Notes:?/i,"<b>Translator's notes</b>").replace(/\n/g,"<br>")}</div>`;
  }
  const {prev, next} = neighbours(book, ch);
  html += `<div class="pn">
    <a class="${prev?'':'off'}" href="${prev?`#${prev.b}/${prev.c}`:'#'}">← ${prev?`${disp(prev.b)} ${prev.c}`:''}</a>
    <a class="${next?'':'off'}" href="${next?`#${next.b}/${next.c}`:'#'}">${next?`${disp(next.b)} ${next.c}`:''} →</a>
  </div>`;
  main.innerHTML = html;
  if (highlightVerse) {
    const el = document.getElementById(`v-${book}-${ch}-${highlightVerse}`);
    if (el) { el.scrollIntoView({block:"center"}); el.classList.add("flash"); }
  } else window.scrollTo(0,0);
}

/* ---------- reference finder ---------- */
function goRef(input) {
  const m = input.trim().toLowerCase().match(/^([1-3]?\s*[a-z ]+?)\s*(\d+)?(?::(\d+))?$/);
  if (!m) return false;
  let book = ABBREV[m[1].replace(/\s+/g,"")];
  if (!book) {
    const t = m[1].trim().replace(/\s+/g,"_").toLowerCase();
    book = allBooks.find(b => b.toLowerCase().startsWith(t));
  }
  if (!book) return false;
  location.hash = `#${book}/${m[2]||1}${m[3] ? "/"+m[3] : ""}`;
  return true;
}

/* ---------- search ---------- */
function search(q) {
  navRender(null);
  q = q.trim();
  const main = $("#main");
  if (q.length < 2) { main.innerHTML = `<p class="empty">Type at least two characters.</p>`; return; }
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
  const hits = [];
  outer:
  for (const book of haveBooks) {
    for (const ch of chapterList(book)) {
      for (const [v, t] of Object.entries(DATA[book][ch].verses)) {
        rx.lastIndex = 0;
        if (rx.test(t)) { hits.push({book, ch, v, t}); if (hits.length >= 200) break outer; }
      }
    }
  }
  let html = `<h2>Search: “${esc(q)}”</h2><div id="results">`;
  html += `<p class="empty">${hits.length}${hits.length>=200?"+":""} verse${hits.length===1?"":"s"} found.</p>`;
  for (const h of hits) {
    rx.lastIndex = 0;
    html += `<div class="hit" onclick="location.hash='#${h.book}/${h.ch}/${h.v}'">
      <div class="ref">${disp(h.book)} ${h.ch}:${h.v}</div>
      ${esc(h.t).replace(rx, m => `<mark>${m}</mark>`)}</div>`;
  }
  main.innerHTML = html + "</div>";
}

/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { if (haveBooks[0]) location.hash = `#${haveBooks[0]}/1`; return; }
  const [book, ch, v] = h.split("/");
  $("#q").value = "";
  renderChapter(book, ch, v ? +v : null);
}
$("#ref").addEventListener("keydown", e => {
  if (e.key === "Enter" && goRef(e.target.value)) e.target.value = "";
});
let deb;
$("#q").addEventListener("input", e => {
  clearTimeout(deb);
  const val = e.target.value;
  deb = setTimeout(() => val.trim() ? search(val) : route(), 250);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const h = location.hash.slice(1).split("/");
  if (h.length < 2 || !DATA[h[0]]) return;
  const {prev, next} = neighbours(h[0], h[1]);
  if (e.key === "ArrowLeft" && prev) location.hash = `#${prev.b}/${prev.c}`;
  if (e.key === "ArrowRight" && next) location.hash = `#${next.b}/${next.c}`;
});
window.addEventListener("hashchange", route);
route();
</script>
