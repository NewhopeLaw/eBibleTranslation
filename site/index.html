es you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”\n", "18": "“Rise up, lift up the boy, and hold him by the hand, for I will make him into a great nation.”\n", "19": "God opened her eyes, and she saw a well of water. She went and filled the skin with water and gave it to the boy to drink.\n", "20": "Then God was with the boy, and he grew up and lived in the wilderness, becoming a skillful bowman.\n", "21": "He lived in the wilderness of Paran, and his mother got him a wife from the land of Egypt.\n", "22": "At that time Abimelech and Phicol, his general, spoke to Abraham, saying, “God is with you in everything you do.\n", "23": "Now therefore, swear to me here by God that you will deal with me and my descendants and my land with truth, just as the kindness I have shown you.”\n", "24": "Abraham said, “I will swear.”\n", "25": "But Abraham reproved Abimelech regarding a well of water that Abimelech’s servants had taken.\n", "26": "Abimelech said, “I did not know who did this, and you did not tell me, nor did I hear about it until today.”\n", "27": "So Abraham gave him sheep and oxen, and the two of them made a covenant.\n", "28": "Abraham set apart seven ewe lambs by themselves.\n", "29": "Abimelech asked Abraham, “What is the meaning of these seven ewes you have set apart by themselves?”\n", "30": "Abraham replied, “I give you these seven ewes in return for the well you dug, so they will be a witness that I dug this well.”\n", "31": "That is why that place was called Beersheba, for there both of them swore an oath.\n", "32": "So Abraham and Abimelech made a covenant at Beersheba, and Abimelech and his general returned to the land of the Philistines.\n", "33": "Abraham planted a tamarisk tree at Beersheba and called there on the name of the LORD, the Everlasting God.\n", "34": "Abraham sojourned in the land of the Philistines for many days.\n"}, "notes": "Notes\n- v. 12: \"through Isaac your descendants will be named\" renders the Hebrew יִקָּרֵא לְךָ זָֽרַע, which combines the verb \"will be called\" with \"offspring,\" reflecting Isaac as the named ancestor of the promised lineage.\n- v. 20: \"becoming a skillful bowman\" renders רֹבֶה קַשָּֽׁת, where \"roveh\" is a rare term; this translation captures both the idea of \"making many\" and the literal \"skillful with a bow.\"\n- v. 31: \"Beersheba\" is a compound of בְּאֵר (well) and שְׁבַע (seven), reflecting the covenant and the seven ewes."}, "22": {"verses": {"1": "After these things, God tested Abraham. He called to him, “Abraham!” and he replied, “Here I am!”\n", "2": "He said, “Take your son, your beloved Isaac, and go to the land of Moriah. Sacrifice him there as a burnt offering on one of the mountains I will name for you.”\n", "3": "Abraham rose early the next day, saddled his donkey, and took with him two of his young men and his son Isaac. He gathered the wood for the burnt offering and started out to go to the place God had told him about.\n", "4": "On the third day Abraham lifted his eyes and saw the place from afar.\n", "5": "He said to his young men, “Stay here with the donkey, while I and the boy go on ahead. We will worship there and return to you.”\n", "6": "Abraham took the wood for the offering and placed it on Isaac, his son. He carried the fire and the knife in his own hand, and the two of them walked together.\n", "7": "Isaac spoke to Abraham his father and said, “Father?” He replied, “Here I am, my son.” Isaac said, “The fire and the wood are here, but where is the lamb for the offering?”\n", "8": "Abraham said, “God will see to the lamb for the offering, my son.” And the two of them walked on together.\n", "9": "They arrived at the place God had told him about. There Abraham built an altar, arranged the wood, and bound his son Isaac and placed him on the altar, on top of the wood.\n", "10": "Abraham reached out and took the knife to slaughter his son.\n", "11": "An angel of the LORD called to him from heaven and said, “Abraham! Abraham!” He answered, “Here I am!”\n", "12": "He said, “Do not lay your hand on the boy or do anything to him, for now I know that you fear God and have not withheld your beloved son from me.”\n", "13": "Abraham lifted his eyes and saw a ram caught in the thicket, its horns entangled. He went and took the ram and offered it as a burnt offering in place of his son.\n", "14": "Abraham named the place *The LORD Will See*, as it is said to this day, “On the mountain of the LORD it shall be seen.”\n", "15": "The angel of the LORD called out to Abraham a second time from heaven.\n", "16": "He said, “By myself I swear, declares the LORD, that because you have done this thing and have not withheld your beloved son from me,\n", "17": "I will surely bless you and greatly multiply your descendants like the stars in the sky and like the sand on the seashore. Your descendants will possess the gates of their enemies.\n", "18": "And through your descendants all the nations of the earth will be blessed, because you have obeyed my voice.”\n", "19": "Abraham returned to his young men, and they rose and went together to Beer Sheba. Abraham lived at Beer Sheba.\n", "20": "After these events, it was reported to Abraham, “Look, Milcah too has borne children to your brother Nahor.”\n", "21": "His firstborn was Uz, his brother Buz, and Kemuel the father of Aram.\n", "22": "And Kesed, Hazo, Pildash, Jidlaph, and Bethuel.\n", "23": "And Bethuel became the father of Rebekah. These eight Milcah bore to Abraham’s brother Nahor.\n", "24": "His concubine, whose name was Reumah, also bore children: Tebah, Gaham, Tahash, and Maacah.\n"}, "notes": "Notes\n- v. 14: The name *The LORD Will See* (יהוה יראה) is a play on the Hebrew for “the LORD sees” and “the LORD will see.” The rendering reflects both meanings.\n- v. 15: The angel’s second call is marked to emphasize its solemnity and the weight of the oath that follows.\n- v. 16: “By myself I swear, declares the LORD” reflects the Hebrew *בִּי נִשְׁבַּעְתִּי נְאֻם־יְהוָה* and captures the divine solemnity of the oath.\n- v. 20–24: These verses list descendants of Nahor through Milcah and Reumah. The structure and renderings follow the Hebrew carefully, distinguishing between the two mothers and their offspring."}}};
const ORDER = {"Genesis": 1, "Exodus": 2, "Leviticus": 3, "Numbers": 4, "Deuteronomy": 5, "Joshua": 6, "Judges": 7, "Ruth": 8, "1_Samuel": 9, "2_Samuel": 10, "1_Kings": 11, "2_Kings": 12, "1_Chronicles": 13, "2_Chronicles": 14, "Ezra": 15, "Nehemiah": 16, "Esther": 17, "Job": 18, "Psalms": 19, "Proverbs": 20, "Ecclesiastes": 21, "Song_of_Songs": 22, "Isaiah": 23, "Jeremiah": 24, "Lamentations": 25, "Ezekiel": 26, "Daniel": 27, "Hosea": 28, "Joel": 29, "Amos": 30, "Obadiah": 31, "Jonah": 32, "Micah": 33, "Nahum": 34, "Habakkuk": 35, "Zephaniah": 36, "Haggai": 37, "Zechariah": 38, "Malachi": 39, "Matthew": 40, "Mark": 41, "Luke": 42, "John": 43, "Acts": 44, "Romans": 45, "1_Corinthians": 46, "2_Corinthians": 47, "Galatians": 48, "Ephesians": 49, "Philippians": 50, "Colossians": 51, "1_Thessalonians": 52, "2_Thessalonians": 53, "1_Timothy": 54, "2_Timothy": 55, "Titus": 56, "Philemon": 57, "Hebrews": 58, "James": 59, "1_Peter": 60, "2_Peter": 61, "1_John": 62, "2_John": 63, "3_John": 64, "Jude": 65, "Revelation": 66};
const ABBREV = {"gen": "Genesis", "ex": "Exodus", "exod": "Exodus", "lev": "Leviticus", "num": "Numbers", "deut": "Deuteronomy", "dt": "Deuteronomy", "josh": "Joshua", "judg": "Judges", "1sam": "1_Samuel", "2sam": "2_Samuel", "1kgs": "1_Kings", "2kgs": "2_Kings", "1chr": "1_Chronicles", "2chr": "2_Chronicles", "neh": "Nehemiah", "esth": "Esther", "ps": "Psalms", "psa": "Psalms", "prov": "Proverbs", "eccl": "Ecclesiastes", "song": "Song_of_Songs", "isa": "Isaiah", "jer": "Jeremiah", "lam": "Lamentations", "ezek": "Ezekiel", "dan": "Daniel", "hos": "Hosea", "obad": "Obadiah", "mic": "Micah", "nah": "Nahum", "hab": "Habakkuk", "zeph": "Zephaniah", "hag": "Haggai", "zech": "Zechariah", "mal": "Malachi", "matt": "Matthew", "mt": "Matthew", "mk": "Mark", "lk": "Luke", "jn": "John", "rom": "Romans", "1cor": "1_Corinthians", "2cor": "2_Corinthians", "gal": "Galatians", "eph": "Ephesians", "phil": "Philippians", "col": "Colossians", "1thess": "1_Thessalonians", "2thess": "2_Thessalonians", "1tim": "1_Timothy", "2tim": "2_Timothy", "phlm": "Philemon", "heb": "Hebrews", "jas": "James", "1pet": "1_Peter", "2pet": "2_Peter", "1jn": "1_John", "2jn": "2_John", "3jn": "3_John", "rev": "Revelation"};
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const $ = s => document.querySelector(s);
const disp = b => b.replace(/_/g," ");

const allBooks = Object.keys(ORDER).sort((a,b) => ORDER[a]-ORDER[b]);
const haveBooks = allBooks.filter(b => DATA[b]);

/* ---------- text size ---------- */
let fs = +(localStorage.getItem("fs") || 18);
const applyFs = () => document.documentElement.style.setProperty("--fs", fs + "px");
applyFs();
$("#fsMinus").onclick = () => { fs = Math.max(14, fs - 1); localStorage.setItem("fs", fs); applyFs(); };
$("#fsPlus").onclick  = () => { fs = Math.min(26, fs + 1); localStorage.setItem("fs", fs); applyFs(); };

/* ---------- navigation ---------- */
function navRender(current) {
  let html = "", lastT = "";
  for (const b of allBooks) {
    const t = ORDER[b] <= 39 ? "Old Testament" : "New Testament";
    if (t !== lastT) { html += `<div class="t">${t}</div>`; lastT = t; }
    html += `<a href="#${b}/1" class="${DATA[b]?'':'missing'} ${b===current?'on':''}">${disp(b)}</a>`;
  }
  $("#books").innerHTML = html;
  const sel = $("#bookSel");
  sel.innerHTML = haveBooks.map(b =>
    `<option value="${b}" ${b===current?'selected':''}>${disp(b)}</option>`).join("");
}
$("#bookSel").addEventListener("change", e => location.hash = `#${e.target.value}/1`);

function chapterList(book){ return Object.keys(DATA[book]).map(Number).sort((a,b)=>a-b); }

function neighbours(book, ch) {
  const chs = chapterList(book);
  const i = chs.indexOf(+ch);
  let prev = i > 0 ? {b:book, c:chs[i-1]} : null;
  let next = i < chs.length-1 ? {b:book, c:chs[i+1]} : null;
  const bi = haveBooks.indexOf(book);
  if (!prev && bi > 0) { const pb = haveBooks[bi-1]; prev = {b:pb, c:chapterList(pb).at(-1)}; }
  if (!next && bi < haveBooks.length-1) { const nb = haveBooks[bi+1]; next = {b:nb, c:chapterList(nb)[0]}; }
  return {prev, next};
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderChapter(book, ch, highlightVerse) {
  const chData = DATA[book] && DATA[book][ch];
  const main = $("#main");
  navRender(book);
  if (!chData) { main.innerHTML = `<p class="empty">${disp(book)} ${ch} has not been translated yet.</p>`; return; }
  const chs = chapterList(book);
  let html = `<h2>${disp(book)} ${ch}</h2>`;
  html += `<div class="chnav">` + chs.map(c =>
    `<a href="#${book}/${c}" class="${c==ch?'on':''}">${c}</a>`).join("") + `</div>`;
  let para = [];
  const flush = () => { if (para.length) { html += `<p class="vv">${para.join(" ")}</p>`; para = []; } };
  for (const n of Object.keys(chData.verses).map(Number).sort((a,b)=>a-b)) {
    const t = chData.verses[n];
    const vid = `v-${book}-${ch}-${n}`;
    if (t.includes("\n")) {
      flush();
      html += `<div class="poetry" id="${vid}"><sup class="v">${n}</sup>${esc(t).replace(/\n\n/g,"\n").trimEnd()}</div>`;
    } else {
      para.push(`<span id="${vid}"><sup class="v">${n}</sup>${esc(t)}</span>`);
    }
  }
  flush();
  if (chData.notes) {
    html += `<div class="notes">${esc(chData.notes).replace(/^Notes:?/i,"<b>Translator's notes</b>").replace(/\n/g,"<br>")}</div>`;
  }
  const {prev, next} = neighbours(book, ch);
  html += `<div class="pn">
    <a class="${prev?'':'off'}" href="${prev?`#${prev.b}/${prev.c}`:'#'}">← ${prev?`${disp(prev.b)} ${prev.c}`:''}</a>
    <a class="${next?'':'off'}" href="${next?`#${next.b}/${next.c}`:'#'}">${next?`${disp(next.b)} ${next.c}`:''} →</a>
  </div>`;
  main.innerHTML = html;
  if (highlightVerse) {
    const el = document.getElementById(`v-${book}-${ch}-${highlightVerse}`);
    if (el) { el.scrollIntoView({block:"center"}); el.classList.add("flash"); }
  } else window.scrollTo(0,0);
}

/* ---------- reference finder ---------- */
function goRef(input) {
  const m = input.trim().toLowerCase().match(/^([1-3]?\s*[a-z ]+?)\s*(\d+)?(?::(\d+))?$/);
  if (!m) return false;
  let book = ABBREV[m[1].replace(/\s+/g,"")];
  if (!book) {
    const t = m[1].trim().replace(/\s+/g,"_").toLowerCase();
    book = allBooks.find(b => b.toLowerCase().startsWith(t));
  }
  if (!book) return false;
  location.hash = `#${book}/${m[2]||1}${m[3] ? "/"+m[3] : ""}`;
  return true;
}

/* ---------- search ---------- */
function search(q) {
  navRender(null);
  q = q.trim();
  const main = $("#main");
  if (q.length < 2) { main.innerHTML = `<p class="empty">Type at least two characters.</p>`; return; }
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
  const hits = [];
  outer:
  for (const book of haveBooks) {
    for (const ch of chapterList(book)) {
      for (const [v, t] of Object.entries(DATA[book][ch].verses)) {
        rx.lastIndex = 0;
        if (rx.test(t)) { hits.push({book, ch, v, t}); if (hits.length >= 200) break outer; }
      }
    }
  }
  let html = `<h2>Search: “${esc(q)}”</h2><div id="results">`;
  html += `<p class="empty">${hits.length}${hits.length>=200?"+":""} verse${hits.length===1?"":"s"} found.</p>`;
  for (const h of hits) {
    rx.lastIndex = 0;
    html += `<div class="hit" onclick="location.hash='#${h.book}/${h.ch}/${h.v}'">
      <div class="ref">${disp(h.book)} ${h.ch}:${h.v}</div>
      ${esc(h.t).replace(rx, m => `<mark>${m}</mark>`)}</div>`;
  }
  main.innerHTML = html + "</div>";
}

/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { if (haveBooks[0]) location.hash = `#${haveBooks[0]}/1`; return; }
  const [book, ch, v] = h.split("/");
  $("#q").value = "";
  renderChapter(book, ch, v ? +v : null);
}
$("#ref").addEventListener("keydown", e => {
  if (e.key === "Enter" && goRef(e.target.value)) e.target.value = "";
});
let deb;
$("#q").addEventListener("input", e => {
  clearTimeout(deb);
  const val = e.target.value;
  deb = setTimeout(() => val.trim() ? search(val) : route(), 250);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const h = location.hash.slice(1).split("/");
  if (h.length < 2 || !DATA[h[0]]) return;
  const {prev, next} = neighbours(h[0], h[1]);
  if (e.key === "ArrowLeft" && prev) location.hash = `#${prev.b}/${prev.c}`;
  if (e.key === "ArrowRight" && next) location.hash = `#${next.b}/${next.c}`;
});
window.addEventListener("hashchange", route);
route();
</script>
